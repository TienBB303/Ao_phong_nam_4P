<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments/head :: head}"></head>
<style>
    .color-box {
        display: inline-block;     /* nằm gọn trong ô */
        width: 150px;               /* chiều rộng cố định */
        padding: 4px 0;            /* khoảng cách trên/dưới */
        border-radius: 4px;        /* bo góc */
        color: #fff;               /* chữ trắng */
        text-align: center;        /* chữ giữa */
        white-space: nowrap;       /* không xuống dòng */
    }
</style>
<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<header th:replace="~{admin/fragments/header :: header}"></header>

<div class="pc-container">
    <div class="pc-content">
        <!-- breadcrumb -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title">
                            <h5 class="m-b-10">Thông tin sản phẩm</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- content: bạn dán phần “cards, charts, tables …” ở đây -->
        <div class="row">
            <div class="card shadow-sm mb-4">
                <div class="card-body row g-3">
                    <!-- Tên sản phẩm -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tên sản phẩm</label>
                        <input type="text" class="form-control border rounded-3 shadow-sm" th:value="${productForm.name}" readonly>
                    </div>

                    <!-- Mã sản phẩm -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Mã sản phẩm</label>
                        <input type="text" class="form-control border rounded-3 shadow-sm" th:value="${productForm.code}" readonly>
                    </div>

                    <!-- Loại sản phẩm -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Loại sản phẩm</label>
                        <input type="text" class="form-control border rounded-3 shadow-sm"
                               th:each="cate : ${listCategory}" th:if="${cate.id == productForm.categoryId}"
                               th:value="${cate.name}" readonly>
                    </div>

                    <!-- Hãng -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Hãng</label>
                        <input type="text" class="form-control border rounded-3 shadow-sm"
                               th:each="b : ${listBrand}" th:if="${b.id == productForm.brandId}"
                               th:value="${b.name}" readonly>
                    </div>

                    <!-- Chất liệu -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Chất liệu</label>
                        <input type="text" class="form-control border rounded-3 shadow-sm"
                               th:each="m : ${listMaterial}" th:if="${m.id == productForm.materialId}"
                               th:value="${m.name}" readonly>
                    </div>
                </div>
            </div>

            <h5 class="mb-3 text-success"><i class="bi bi-list-ul me-1"></i> Danh sách biến thể</h5>

            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle text-center">
                    <thead class="table-primary">
                    <tr>
                        <th scope="col">Tên</th>
                        <th scope="col">Ảnh</th>
                        <th scope="col">Barcode</th>
                        <th scope="col">Màu</th>
                        <th scope="col">Giá</th>
                        <th scope="col">Số lượng</th>
                        <th scope="col">Trạng thái</th>
                        <th scope="col">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="detail : ${listProductDetail}">
                        <td th:text="${detail.product.name + '(' + detail.color.name + ' - ' + detail.size.code + ' )'}">
                            Tên
                        </td>
                        <td>
                            <img th:if="${!detail.images.isEmpty()}"
                                 th:src="${detail.images.get(0).path_file}"
                                 width="100" alt="Ảnh sản phẩm"/>
                            <span th:if="${detail.images.isEmpty()}">Không có ảnh</span>
                        </td>
                        <td>
                            <img th:src="@{'/barcode-images/' + ${detail.barcode} + '.png'}" width="150" alt="Barcode"/>
                        </td>
<!--                        <td>-->
<!--                                <span class="px-2 py-1 rounded text-white border shadow-sm d-inline-block text-center"-->
<!--                                      style="display: block; width: 80px"-->
<!--                                      th:text="${detail.color.name}"-->
<!--                                      th:style="'background-color:' + ${detail.color.code}">-->
<!--                                </span>-->
                        <td>
                              <span class="color-box"
                                    th:text="${detail.color.name}"
                                    th:style="'background-color:' + ${detail.color.code}">
                              </span>
                        </td>
                        </td>
                        <td th:text="${detail.price}" class="giaVND">Giá</td>
                        <td th:text="${detail.quantity}">Số lượng</td>
                        <td style="text-align: center">
                            <span th:if="${detail.status}" class="badge bg-success">Đang bán</span>
                            <span th:unless="${detail.status}" class="badge bg-danger">Ngừng bán</span>
                        </td>
                        <td style="text-align: center">
                            <a class="btn btn-outline-info thayDoiTrangThai" style="width: 70px" title="đổi trạng thái sản phẩm" th:attr="data-id=${detail.id}">
                                <i class="ti ti-arrows-right-left"></i>
                            </a>
                            <a class="btn btn-outline-warning hienThiThongTinModal" style="width: 70px" title="Sửa"
                               th:attr="data-id=${detail.id}"
                               data-bs-toggle="modal" data-bs-target="#modalChinhSua">
                                <i class="ti ti-pencil"></i>
                            </a>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{admin/fragments/footer :: footer}"></footer>

<div class="modal fade" id="modalChinhSua" tabindex="-1" aria-labelledby="modalChinhSuaLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalChinhSuaLabel">Chỉnh sửa sản phẩm </h5>
            </div>
            <div class="modal-body">
                <form id="updateProductDetail" method="post" action="/admin/product-detail/update">
                    <input type="hidden" id="product_detail_id" name="ProductDetailId">
                    <div class="mb-3">
                        <!--                        <label for="product_price_update" class="form-label">Giá</label><span class="text-danger">*</span>-->
                        <input type="hidden" class="form-control giaVND" id="product_price_update" name="productPriceUpdate" placeholder="Nhập giá...">
                    </div>
                    <div class="mb-3">
                        <label for="product_quantity_update" class="form-label">Số lượng</label>
                        <input type="number" class="form-control" id="product_quantity_update" name="productQuantityUpdate" placeholder="Nhập số lượng...">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-success">
                            <i class="bi bi-check-lg"></i>
                        </button>
                        <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>


<script>
    function formatCurrencyVND(value) {
        return Number(value).toLocaleString('vi-VN', { style: 'currency', currency: 'VND' });
    }

    $(document).ready(function () {
        $('.giaVND').each(function () {
            const raw = $(this).text().trim(); // lấy text thay vì value
            if (!isNaN(raw) && raw.length > 0) {
                const formatted = formatCurrencyVND(raw);
                $(this).text(formatted); // gán lại text đã format
            }
        });
    });
</script>
<!-- Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="${alert != null}" th:inline="javascript">
    Swal.fire({
        toast: true,
        icon: /*[[${type}]]*/ null,
        title: '[[${alert}]]', // Thông báo từ controller
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });
</script>
<script>
    $(document).on('click', '.hienThiThongTinModal', function () {
        const id = $(this).data('id');
        console.log("ID lấy được:", id);
        $('#product_detail_id').val(id); // Gắn ID vào input ẩn trong form

        $.ajax({
            url: `/admin/product-detail/detail/${id}`,
            type: 'GET',
            success: function (response) {
                console.log("Gia :", response.price);
                console.log("So luong :", response.quantity);
                $('#product_detail_id').val(response.id);
                $('#product_price_update').val(response.price);
                $('#product_quantity_update').val(response.quantity);
            },
            error: function (xhr) {
            }
        });
    });
</script>
<script>
    $(document).on('click', '.thayDoiTrangThai', function () {
        const id = $(this).data('id');
        Swal.fire({
            title: 'Bạn có chắc muốn đổi trạng thái?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Có',
            cancelButtonText: 'Không'
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = `/admin/product-detail/change-status/${id}`;
            }
        });
    });
</script>
</body>
</html>
