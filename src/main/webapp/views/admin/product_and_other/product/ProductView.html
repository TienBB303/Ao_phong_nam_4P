<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments/head :: head}"></head>
<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<header th:replace="~{admin/fragments/header :: header}"></header>
<style>
    .btn i {
        line-height: 2;      /* bỏ thừa chiều cao */
        vertical-align: middle;
        display: inline-flex;
        align-items: center; /* căn icon giữa */
        justify-content: center;
        font-size: 1rem;     /* chỉnh nếu muốn icon đều nhau */
    }
</style>
<div class="pc-container">
    <div class="pc-content">
        <!-- breadcrumb -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title align-items-center mb-3">
                            <div class="d-flex align-items-center">
                                <h5 class="mb-0 me-2">Quản lý sản phẩm</h5>
                                <a th:href="@{/admin/product/view-add}"
                                   class="btn btn-sm btn-primary rounded-circle shadow-lg d-flex align-items-center justify-content-center"
                                   style="width: 32px; height: 32px;" title="Thêm sản phẩm mới ">
                                    <i class="ti ti-plus"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- content: bạn dán phần “cards, charts, tables …” ở đây -->
        <div class="row">
            <!-- Form tìm kiếm-->
            <form class="bg-white border rounded shadow-sm p-4 mb-4" method="get">
                <!-- Dòng nhập tên và trạng thái -->
                <div class="row g-3 align-items-end mb-3">
                    <div class="col-md-8">
                        <label for="searchInput" class="form-label">Tên sản phẩm</label>
                        <div class="input-group shadow-sm">
                            <input type="text" id="searchInput" name="productNameSearch"
                                   class="form-control" placeholder="Nhập tên hoặc mã sản phẩm..."
                                   th:value="${param.productNameSearch}">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="category_search" class="form-label">Loại sản phẩm</label>
                        <select id="category_search" name="productCategorySearch" class="form-select shadow-sm">
                            <option value="" th:selected="${productCategorySearch == null}">Tất cả loại</option>
                            <option th:each="cate : ${listCategory}"
                                    th:value="${cate.id}"
                                    th:text="${cate.name}"
                                    th:if="${cate.status}"
                                    th:selected="${cate.id == productCategorySearch}">
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Dòng dropdown: Loại - Hãng - Chất liệu -->
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label for="brand_search" class="form-label">Hãng sản xuất</label>
                        <select id="brand_search" name="productBrandSearch" class="form-select shadow-sm">
                            <option value="" th:selected="${productBrandSearch == null}">Tất cả hãng</option>
                            <option th:each="brand : ${listBrand}"
                                    th:value="${brand.id}"
                                    th:text="${brand.name}"
                                    th:if="${brand.status}"
                                    th:selected="${brand.id == productBrandSearch}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="material_search" class="form-label">Chất liệu</label>
                        <select id="material_search" name="productMaterialSearch" class="form-select shadow-sm">
                            <option value="" th:selected="${productMaterialSearch == null}">Tất cả chất liệu</option>
                            <option th:each="mate : ${listMaterial}"
                                    th:value="${mate.id}"
                                    th:text="${mate.name}"
                                    th:if="${mate.status}"
                                    th:selected="${mate.id == productMaterialSearch}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="status_search" class="form-label">Loại sản phẩm</label>
                        <select id="status_search" name="productStatusSearch" class="form-select shadow-sm">
                            <option value="" th:selected="${productStatusSearch == null}">Tất cả trạng thái</option>
                            <option value="true" th:selected="${productStatusSearch == true}">Đang bán</option>
                            <option value="false" th:selected="${productStatusSearch == false}">Ngừng bán</option>
                        </select>
                    </div>
                    <div class="col-md-1 d-grid">
                        <button type="submit" class="btn btn-primary mt-4" id="search_product_btn" title="Tìm kiếm">
                            <i class="ti ti-search"></i>
                        </button>
                    </div>
                    <div class="col-md-1 d-grid">
                        <a th:href="@{/admin/product/hien-thi}" class="btn btn-warning mt-4" id="clear_search" title="Xóa tìm kiếm">
                            <i  class="ti ti-eraser"></i>
                        </a>
                    </div>
                </div>
            </form>
            <!-- Nếu không tìm thấy sản phẩm -> load ảnh null-->
            <div th:if="${#lists.isEmpty(listProduct.content)}" class="d-flex flex-column justify-content-center align-items-center" style="height: 400px;">
                <img src="https://shop.nebulacare.in/Content/Images/nodata.jpg" style="max-height: 400px;">
            </div>
            <!-- Nếu tìm thấy sản phẩm -> show table-->
            <div th:if="${!#lists.isEmpty(listProduct.content)}" class="card-body">
                <table class="table table-striped table-bordered dataTable-table" id="table1">
                    <thead>
                    <tr>
                        <th style="text-align: center">STT</th>
                        <th style="text-align: center">Mã sản phẩm</th>
                        <th style="text-align: center">Tên sản phẩm</th>
                        <th style="text-align: center">Loại sản phẩm</th>
                        <th style="text-align: center">Hãng</th>
                        <th style="text-align: center">Chất liệu</th>
                        <th style="text-align: center">Số lượng</th>
                        <th style="text-align: center">Trạng thái</th>
                        <th style="text-align: center">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="sp, iter : ${listProduct.content}" th:data-id="${sp.id}">
                        <td th:text="${listProduct.number * listProduct.size + iter.index + 1}"></td>
                        <td th:text="${sp.code}"></td>
                        <td th:text="${sp.name}"></td>
                        <td th:text="${sp.category.name}"></td>
                        <td th:text="${sp.brand.name}"></td>
                        <td th:text="${sp.material.name}"></td>
                        <td th:text="${totalQuantity[sp.id]}">0</td>
                        <td style="text-align: center">
                            <span th:if="${sp.status}" class="badge bg-success">Đang bán</span>
                            <span th:unless="${sp.status}" class="badge bg-danger">Ngừng bán</span>
                        </td>
                        <td style="text-align: center">
                            <a class="btn btn-outline-info" th:href="@{'/admin/product/view-detail/' + ${sp.id}}" style="width: 70px" title="Xem">
                            ️ 👁️
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <!-- Phân trang -->
            <div class="dataTable-bottom">
                <nav th:if="${listProduct.totalPages > 0}">
                    <ul class="pagination d-flex justify-content-end">
                        <li class="page-item" th:classappend="${listProduct.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/product/hien-thi(page=${listProduct.number > 0 ? listProduct.number - 1 : 0},
                                    size=${listProduct.size},
                                    productNameSearch=${productNameSearch},
                                    productStatusSearch=${productStatusSearch},
                                    roductCategorySearch=${productCategorySearch},
                                    productBrandSearch=${productBrandSearch},
                                    productMaterialSearch=${productMaterialSearch})}">
                                Trước
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, listProduct.totalPages - 1)}"
                            th:classappend="${i == listProduct.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/admin/product/hien-thi(   page=${i},
                                    size=${listProduct.size},
                                    productNameSearch=${productNameSearch},
                                    productStatusSearch=${productStatusSearch},
                                    roductCategorySearch=${productCategorySearch},
                                    productBrandSearch=${productBrandSearch},
                                    productMaterialSearch=${productMaterialSearch}
                                   )}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <li class="page-item" th:classappend="${listProduct.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/product/hien-thi(   page=${listProduct.number + 1},
                                   size=${listProduct.size},
                                   productNameSearch=${productNameSearch},
                                   productStatusSearch=${productStatusSearch},
                                   roductCategorySearch=${productCategorySearch},
                                   productBrandSearch=${productBrandSearch},
                                   productMaterialSearch=${productMaterialSearch}
                                   )}">
                                Sau
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
<!-- Script -->
<script th:if="${alert != null}" th:inline="javascript">
    Swal.fire({
        toast: true,
        icon: [[${type}]], // Đảm bảo `type` là kiểu string (success, error,...)
        title: [[${alert}]],
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });
</script>

<script>
    $(document).on('click', '.hienThiThongTinModal', function () {
        const id = $(this).data('id');
        console.log("ID sản phẩm:", id);
        console.log("DATA:", $(this).data()); // debug
        console.log("ID sản phẩm:", id);      // kiểm tra có ra khôn
        $('#product_id').val(id);

        $.ajax({
            url: `/admin/product/get-detail/${id}`,
            type: 'GET',
            success: function (response) {
                console.log("Dữ liệu sản phẩm:", response);
                $('#product_id').val(response.id);
                $('#product_name_update').val(response.name);
                $('#product_category_update').val(response.category.id);
                $('#product_brand_update').val(response.brand.id);
                $('#product_material_update').val(response.material.id);
            },
            error: function (xhr) {
                console.error("Lỗi khi lấy dữ liệu sản phẩm:", xhr);
            }
        });
    });
</script>


</body>
</html>
