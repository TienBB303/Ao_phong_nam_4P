<th:block th:fragment="head">
  <meta charset="utf-8">
  <title th:text="${title} ?: '4P Store'">4P Store</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Mantis is made using Bootstrap 5 design framework.">
  <meta name="keywords" content="Mantis, Dashboard, Bootstrap 5, Admin">
  <meta name="author" content="CodedThemes">

  <!-- Favicon (file nội bộ) -->
  <link rel="icon" th:href="@{/assets/images/logo_4P.png}" type="image/svg+xml">

  <!-- Google Font (CDN) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" id="main-font-link">

  <!-- Icon fonts (nội bộ) -->
  <link rel="stylesheet" th:href="@{/assets/fonts/tabler-icons.min.css}">
  <link rel="stylesheet" th:href="@{/assets/fonts/feather.css}">
  <link rel="stylesheet" th:href="@{/assets/fonts/fontawesome.css}">
  <link rel="stylesheet" th:href="@{/assets/fonts/material.css}">

  <!-- Template CSS (nội bộ) -->
  <link rel="stylesheet" th:href="@{/assets/css/style.css}" id="main-style-link">
  <link rel="stylesheet" th:href="@{/assets/css/style-preset.css}">

  <!-- Thư viện thêm (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
  <link href="https://unpkg.com/filepond@^4/dist/filepond.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.min.css" rel="stylesheet" />

  <!-- Custom cuối cùng để override -->
  <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
</th:block>
