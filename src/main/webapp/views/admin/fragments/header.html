<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="header">
<header class="pc-header" th:fragment="header">
  <div class="header-wrapper">
    <!-- Mobile -->
    <div class="me-auto pc-mob-drp">
      <ul class="list-unstyled">
        <li class="pc-h-item pc-sidebar-collapse">
          <a href="#" class="pc-head-link ms-0" id="sidebar-hide"><i class="ti ti-menu-2"></i></a>
        </li>
        <li class="pc-h-item pc-sidebar-popup">
          <a href="#" class="pc-head-link ms-0" id="mobile-collapse"><i class="ti ti-menu-2"></i></a>
        </li>
      </ul>
    </div>

    <!-- Right -->
    <div class="ms-auto">
      <ul class="list-unstyled">
        <!-- Messages dropdown -->
        <li class="dropdown pc-h-item">
          <a class="pc-head-link dropdown-toggle arrow-none me-0" data-bs-toggle="dropdown" href="#">
            <i class="ti ti-mail"></i>
          </a>
          <div class="dropdown-menu dropdown-notification dropdown-menu-end pc-h-dropdown">
            <div class="dropdown-header d-flex align-items-center justify-content-between">
              <h5 class="m-0">Message</h5>
              <a href="#!" class="pc-head-link bg-transparent"><i class="ti ti-x text-danger"></i></a>
            </div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-header px-0 text-wrap header-notification-scroll position-relative" style="max-height: calc(100vh - 215px)">
              <div class="list-group list-group-flush w-100">
                <a class="list-group-item list-group-item-action">
                  <div class="d-flex">
                    <div class="flex-shrink-0">
                      <img th:src="@{/assets/images/user/avatar-2.jpg}" alt="user-image" class="user-avtar">
                    </div>
                    <div class="flex-grow-1 ms-1">
                      <span class="float-end text-muted">3:00 AM</span>
                      <p class="text-body mb-1">It's <b>Cristina danny's</b> birthday today.</p>
                      <span class="text-muted">2 min ago</span>
                    </div>
                  </div>
                </a>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <div class="text-center py-2">
              <a href="#!" class="link-primary">View all</a>
            </div>
          </div>
        </li>

        <!-- User profile -->
        <li class="dropdown pc-h-item header-user-profile">
          <a class="pc-head-link dropdown-toggle arrow-none me-0" data-bs-toggle="dropdown" href="#" data-bs-auto-close="outside">
            <img th:src="@{/assets/images/user/avatar-2.jpg}" alt="user-image" class="user-avtar">
            <span>Stebin Ben</span>
          </a>
          <div class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown">
            <div class="dropdown-header">
              <div class="d-flex mb-1">
                <div class="flex-shrink-0">
                  <img th:src="@{/assets/images/user/avatar-2.jpg}" alt="user-image" class="user-avtar wid-35">
                </div>
                <div class="flex-grow-1 ms-3">
                  <h6 class="mb-1">Stebin Ben</h6>
                  <span>4PStore</span>
                </div>
                <!-- Giữ nguyên: icon logout dùng form POST /logout -->
                <form action="/logout" method="post" style="margin:0;">
                  <button type="submit" class="pc-head-link bg-transparent" style="border:none;background:none;padding:0;">
                    <i class="ti ti-power text-danger"></i>
                  </button>
                </form>
              </div>
            </div>
            <ul class="nav drp-tabs nav-fill nav-tabs" id="mydrpTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="drp-t1" data-bs-toggle="tab" data-bs-target="#drp-tab-1" type="button">
                  <i class="ti ti-user"></i> Profile
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="drp-t2" data-bs-toggle="tab" data-bs-target="#drp-tab-2" type="button">
                  <i class="ti ti-settings"></i> Setting
                </button>
              </li>
            </ul>

            <div class="tab-content">
              <div class="tab-pane fade show active" id="drp-tab-1">
                <a href="#!" class="dropdown-item"><i class="ti ti-edit-circle"></i> <span>Edit Profile</span></a>
                <a href="#!" class="dropdown-item"><i class="ti ti-user"></i> <span>View Profile</span></a>
                <a href="#!" class="dropdown-item"><i class="ti ti-clipboard-list"></i> <span>Social Profile</span></a>
                <a href="#!" class="dropdown-item"><i class="ti ti-wallet"></i> <span>Billing</span></a>
                <!-- XÓA mục Logout ở dưới cùng -->
              </div>
              <div class="tab-pane fade" id="drp-tab-2">
                <a href="#!" class="dropdown-item"><i class="ti ti-help"></i> <span>Support</span></a>
                <a href="#!" class="dropdown-item"><i class="ti ti-user"></i> <span>Account Settings</span></a>
                <a href="#!" class="dropdown-item"><i class="ti ti-lock"></i> <span>Privacy Center</span></a>
                <a href="#!" class="dropdown-item"><i class="ti ti-messages"></i> <span>Feedback</span></a>
                <a href="#!" class="dropdown-item"><i class="ti ti-list"></i> <span>History</span></a>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </div>

  </div>
</header>
</html>
