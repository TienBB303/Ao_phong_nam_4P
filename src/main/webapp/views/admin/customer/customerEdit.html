<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments/head :: head}"></head>
<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<header th:replace="~{admin/fragments/header :: header}"></header>

<div class="pc-container">
    <div class="pc-content">
        <!-- breadcrumb -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title">
                            <h5 class="m-b-10">Chỉnh sửa thông tin khách hàng</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
         <!-- Hiển thị thông báo -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="row">
            <form th:action="@{/admin/customer/update}" th:object="${customerDto}" method="post"
                  class="p-4 rounded shadow-sm bg-light">

                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">Mã khách hàng:</label>
                    <input type="text" th:field="*{code}" class="form-control" readonly/>
                </div>

                <div class="mb-3">
                    <label>Họ tên</label>
                    <input th:field="*{name}" id="name" type="text" class="form-control"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Giới tính:</label>
                    <div>
                        <input type="radio" th:field="*{gender}" value="true" id="male">
                        <label for="male">Nam</label>
                        <input type="radio" th:field="*{gender}" value="false" id="female">
                        <label for="female">Nữ</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ngày sinh:</label>
                    <input type="date"
                           th:field="*{birthday}"
                           th:value="${#temporals.format(customerDto.birthday, 'yyyy-MM-dd')}"
                           id="birthday"
                           class="form-control"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}"></div>
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input th:field="*{email}" type="email" id="email" class="form-control"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label>Số điện thoại</label>
                    <input th:field="*{phoneNumber}" id="phoneNumber" type="text" class="form-control"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}"
                         th:errors="*{phoneNumber}"></div>
                </div>
                <h5 class="fw-semibold">ĐỊA CHỈ GIAO HÀNG</h5>
                <div class="mb-3">
                    <label for="province" class="form-label">Tỉnh/Thành phố</label>
                    <select th:field="*{address.provinceId}" id="province" class="form-select"></select>
                    <input type="hidden" th:field="*{address.provinceName}" id="provinceName"/>
                </div>
                <div class="mb-3">
                    <label for="district" class="form-label">Quận/Huyện</label>
                    <select th:field="*{address.districtId}" id="district" class="form-select"></select>
                    <input type="hidden" th:field="*{address.districtName}" id="districtName"/>
                </div>
                <div class="mb-3">
                    <label for="ward" class="form-label">Phường/Xã</label>
                    <select th:field="*{address.wardId}" id="ward" class="form-select"></select>
                    <input type="hidden" th:field="*{address.wardName}" id="wardName"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Địa chỉ chi tiết:</label>
                    <input type="text" th:field="*{address.addressDetail}" class="form-control"/>
                </div>
<!--                <div class="form-check mb-3">-->
<!--                    <input class="form-check-input" type="checkbox" id="otherReceiver" onclick="toggleReceiverForm()">-->
<!--                    <label class="form-check-label" for="otherReceiver">-->
<!--                        Người nhận khác người mua-->
<!--                    </label>-->
<!--                </div>-->
<!--                <div id="receiverForm" th:style="${customerDto.address.receiverName != null || customerDto.address.receiverPhoneNumber != null} ? 'display:block;' : 'display:none;'">-->
<!--                    <div class="mb-3">-->
<!--                        <label class="form-label">Tên người nhận:</label>-->
<!--                        <input type="text" th:field="*{address.receiverName}" class="form-control"/>-->
<!--                        <div class="text-danger" th:if="${#fields.hasErrors('address.receiverName')}" th:errors="*{address.receiverName}"></div>-->
<!--                    </div>-->
<!--                    <div class="mb-3">-->
<!--                        <label class="form-label">SĐT người nhận:</label>-->
<!--                        <input type="text" th:field="*{address.receiverPhoneNumber}" class="form-control"/>-->
<!--                        <div class="text-danger" th:if="${#fields.hasErrors('address.receiverPhoneNumber')}" th:errors="*{address.receiverPhoneNumber}"></div>-->
<!--                    </div>-->
<!--                </div>-->
<!--                <div class="form-check mb-3">-->
<!--                    <input class="form-check-input" type="checkbox" id="isDefault" th:field="*{address.isDefault}" th:checked="${customerDto.address.isDefault == true}">-->
<!--                    <label class="form-check-label" for="isDefault">-->
<!--                        Đặt làm địa chỉ mặc định-->
<!--                    </label>-->
<!--                </div>-->
                <div class="mb-3">
                    <label for="isActive" class="form-label">Trạng thái</label>
                    <select id="isActive" th:field="*{isActive}" class="form-select">
                        <option th:value="true">Hoạt động</option>
                        <option th:value="false">Không hoạt động</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between">
                    <a th:href="@{/admin/customer/view}" class="btn btn-outline-secondary">← Quay lại</a>
                    <button type="submit" class="btn btn-primary">💾 Lưu thay đổi</button>
                </div>

            </form>
        </div>
    </div>
</div>
<footer th:replace="~{admin/fragments/footer :: footer}"></footer>

<style>
    .pc-content label[for="isActive"] { color: #0d6efd !important; font-weight: 600; }
    .pc-content #isActive { color: #111 !important; background-color: #fff !important; border-color: #0d6efd !important; }
    .pc-content #isActive option { color: #111 !important; }
</style>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        // Token GHN
        const token = '9c1ee582-5a3b-11f0-99f8-027692bb547c';

        // Selects
        const provinceSelect = document.getElementById('province');
        const districtSelect = document.getElementById('district');
        const wardSelect = document.getElementById('ward');

        // Hidden fields
        const provinceNameInput = document.getElementById('provinceName');
        const districtNameInput = document.getElementById('districtName');
        const wardNameInput = document.getElementById('wardName');

        const selectedProvinceId = /*[[${customerDto.address.provinceId}]]*/ null;
        const selectedDistrictId = /*[[${customerDto.address.districtId}]]*/ null;
        const selectedWardId = /*[[${customerDto.address.wardId}]]*/ null;

        // Placeholder mặc định
        provinceSelect.innerHTML = '<option value="">-- Chọn Tỉnh/Thành phố --</option>';
        districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
        wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';

        // Load danh sách Tỉnh
        fetch('https://online-gateway.ghn.vn/shiip/public-api/master-data/province', {
            headers: { 'token': token }
        })
        .then(res => res.json())
        .then(data => {
            data.data.forEach(p => {
                const selected = (p.ProvinceID == selectedProvinceId) ? 'selected' : '';
                provinceSelect.innerHTML += `<option value="${p.ProvinceID}" ${selected}>${p.ProvinceName}</option>`;
            });

            if (selectedProvinceId) {
                loadDistricts(selectedProvinceId, selectedDistrictId, selectedWardId);
            } else {
                updateFullAddress();
            }
        });

        // Khi đổi Tỉnh
        provinceSelect.addEventListener('change', () => {
            districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
            wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';

            provinceNameInput.value = provinceSelect.options[provinceSelect.selectedIndex]?.text || "";
            districtNameInput.value = "";
            wardNameInput.value = "";

            if (provinceSelect.value) {
                loadDistricts(provinceSelect.value, null, null);
            } else {
                updateFullAddress();
            }
        });

        // Load Quận/Huyện theo Tỉnh
        function loadDistricts(provinceId, selectedDistId, selectedWardIdIn) {
            fetch('https://online-gateway.ghn.vn/shiip/public-api/master-data/district', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'token': token },
                body: JSON.stringify({ province_id: parseInt(provinceId) })
            })
            .then(res => res.json())
            .then(data => {
                districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
                data.data.forEach(d => {
                    const selected = (d.DistrictID == selectedDistId) ? 'selected' : '';
                    districtSelect.innerHTML += `<option value="${d.DistrictID}" ${selected}>${d.DistrictName}</option>`;
                });

                if (selectedDistId) {
                    loadWards(selectedDistId, selectedWardIdIn);
                } else {
                    updateFullAddress();
                }
            });
        }

        // Khi đổi Quận/Huyện
        districtSelect.addEventListener('change', () => {
            wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';

            districtNameInput.value = districtSelect.options[districtSelect.selectedIndex]?.text || "";
            wardNameInput.value = "";

            if (districtSelect.value) {
                loadWards(districtSelect.value, null);
            } else {
                updateFullAddress();
            }
        });

        // Load Phường/Xã theo Quận/Huyện
        function loadWards(districtId, selectedWard) {
            fetch(`https://online-gateway.ghn.vn/shiip/public-api/master-data/ward?district_id=${districtId}`, {
                headers: { 'token': token }
            })
            .then(res => res.json())
            .then(data => {
                wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
                data.data.forEach(w => {
                    const selected = (w.WardCode == selectedWard) ? 'selected' : '';
                    wardSelect.innerHTML += `<option value="${w.WardCode}" ${selected}>${w.WardName}</option>`;
                });
                updateFullAddress();
            });
        }

        // Khi đổi Phường/Xã
        wardSelect.addEventListener('change', updateFullAddress);

        // Cập nhật tên tỉnh/huyện/xã vào hidden inputs
        function updateFullAddress() {
            provinceNameInput.value = provinceSelect.options[provinceSelect.selectedIndex]?.text || "";
            districtNameInput.value = districtSelect.options[districtSelect.selectedIndex]?.text || "";
            wardNameInput.value = wardSelect.options[wardSelect.selectedIndex]?.text || "";
        }

        // Validate form + đảm bảo hidden inputs cập nhật trước khi submit
        const form = document.querySelector("form");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const phoneInput = document.getElementById("phoneNumber");

        if (form) {
            form.addEventListener("submit", function (e) {
                // luôn đồng bộ tên Tỉnh/Huyện/Xã
                updateFullAddress();

                let isValid = true;

                nameInput.setCustomValidity("");
                emailInput.setCustomValidity("");
                phoneInput.setCustomValidity("");

                const nameRegex = /^[\p{L}\s]+$/u;
                if (!nameRegex.test(nameInput.value.trim())) {
                    nameInput.setCustomValidity("Tên chỉ được chứa chữ cái và khoảng trắng.");
                    isValid = false;
                }
                nameInput.reportValidity();

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(emailInput.value.trim())) {
                    emailInput.setCustomValidity("Email không đúng định dạng.");
                    isValid = false;
                }
                emailInput.reportValidity();

                const phoneRegex = /^0\d{9}$/;
                if (!phoneRegex.test(phoneInput.value.trim())) {
                    phoneInput.setCustomValidity("Số điện thoại phải bắt đầu bằng 0 và có đúng 10 chữ số.");
                    isValid = false;
                }
                phoneInput.reportValidity();

                if (!isValid) {
                    e.preventDefault();
                    return;
                }

                if (!confirm("Bạn có chắc chắn muốn lưu thay đổi cho khách hàng này không?")) {
                    e.preventDefault();
                }
            });
        }
    });
</script>
</body>
</html>
