<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments/head :: head}"></head>
<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<header th:replace="~{admin/fragments/header :: header}"></header>

<div class="pc-container">
    <div class="pc-content">
        <!-- breadcrumb -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title">
                            <h5 class="m-b-10">Danh sách khách hàng</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- content: bạn dán phần “cards, charts, tables …” ở đây -->
            <div th:if="${error}" class="alert alert-warning alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        <div class="row">
            <form class="p-4 rounded shadow-sm mb-4" method="get" th:action="@{/admin/customer/view}">
                <div class="row gy-3 align-items-end">
                    <div class="col-md-3">
                        <label for="keyword" class="form-label">Tìm kiếm theo tên hoặc mã KH</label>
                        <input type="text" name="keyword" id="keyword" class="form-control"
                               placeholder="Nhập tên hoặc mã..." th:value="${keyword}">
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-primary w-100" id="search-btn">
                            <i class="ti ti-search me-1"></i> Tìm kiếm
                        </button>
                    </div>
                    <div class="col-md-2">
                        <a th:href="@{/admin/customer/view}" class="btn btn-outline-secondary w-100">
                            Hủy
                        </a>
                    </div>
                </div>
            </form>
            <div class="d-flex justify-content-end mb-3">
                <a th:href="@{/admin/customer/create}" class="btn btn-primary">➕ Thêm mới khách hàng</a>
            </div>
            <table class="table table-hover table-bordered align-middle text-center">
                <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã KH</th>
                    <th>Họ tên</th>
                    <th>Số điện thoại</th>
                    <th>Giới tính</th>
                    <th>Ngày sinh</th>
                    <th>Địa chỉ</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c, iterStat : ${customerPage.content}" th:if="${c != null}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${c.code != null ? c.code : ''}"></td>
                    <td th:text="${c.name != null ? c.name : ''}"></td>
                    <td th:text="${c.phoneNumber != null ? c.phoneNumber : ''}"></td>
                    <td th:text="${c.gender == true ? 'Nam' : (c.gender == false ? 'Nữ' : '')}"></td>
                    <td th:text="${c.birthDate != null ? #temporals.format(c.birthDate, 'dd/MM/yyyy') : ''}"></td>
                    <td>
                    <span th:if="${c.addresses != null && !c.addresses.isEmpty()}"
                          th:text="${c.addresses[0].addressDetail
                           + (c.addresses[0].wardName != null ? ', ' + c.addresses[0].wardName : '')
                           + (c.addresses[0].districtName != null ? ', ' + c.addresses[0].districtName : '')
                           + (c.addresses[0].provinceName != null ? ', ' + c.addresses[0].provinceName : '')}">
                    </span>
                        <span th:if="${c.addresses == null || c.addresses.isEmpty()}" th:text="''"></span>
                    </td>
                    <td>
                            <span th:if="${c.isActive != null and c.isActive}"
                                  class="badge badge-active">Hoạt động</span>
                        <span th:if="${c.isActive != null and !c.isActive}" class="badge badge-inactive">Không hoạt động</span>
                        <span th:if="${c.isActive == null}" class="badge badge-inactive">Không xác định</span>
                    </td>
                    <td>
                        <a th:href="${c.id != null ? '/admin/customer/edit/' + c.id : '#'}">
                            <button class="btn-icon text-dark">✏️</button>
                        </a>
                        <a th:href="${c.id != null ? '/admin/customer/delete/' + c.id : '#'}">
                            <button class="btn-icon text-danger" onclick="return confirm('Bạn có chắc muốn xóa?')">
                                🗑️
                            </button>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-end">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link page-link-ajax" href="#" th:data-page="${currentPage - 1}">«</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link page-link-ajax" href="#" th:data-page="${i}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                        <a class="page-link page-link-ajax" href="#" th:data-page="${currentPage + 1}">»</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{admin/fragments/footer :: footer}"></footer>

<script>
    function changePage(page) {
        const params = new URLSearchParams(window.location.search);
        params.set("page", page);

        // Giữ lại keyword nếu có
        const keyword = document.querySelector("input[name='keyword']")?.value;
        if (keyword && keyword.trim() !== '') {
            params.set("keyword", keyword);
        }

        window.location.search = params.toString();
    }
    // Hàm thay đổi trang khi click vào nút phân trang
    document.addEventListener("DOMContentLoaded", function () {
        // Xử lý tìm kiếm
        const searchBtn = document.getElementById("search-btn");
        if (searchBtn) {
            searchBtn.addEventListener("click", function (e) {
                e.preventDefault();
                const params = new URLSearchParams();
                params.set("page", 0);
                params.set("keyword", document.querySelector("input[name='keyword']").value);
                window.location.search = params.toString();
            });
        }

        // Khi DOM đã được tải hoàn toàn
        // Xử lý phân trang - GÁN EVENT LISTENER CHO CÁC NÚT PHÂN TRANG
        const pageLinks = document.querySelectorAll('.page-link-ajax');
        pageLinks.forEach(function (link) {
            link.addEventListener('click', function (e) {
                e.preventDefault(); // Ngăn chặn hành vi mặc định của thẻ <a>

                const page = this.getAttribute('data-page'); // Lấy số trang từ thuộc tính data-page
                if (page !== null && page !== undefined) {
                    changePage(parseInt(page)); // Gọi hàm changePage với số trang
                }
            });
        });
    });
</script>

</body>
</html>
