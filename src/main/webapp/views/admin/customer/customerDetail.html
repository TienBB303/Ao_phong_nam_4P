<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments/head :: head}"></head>
<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<header th:replace="~{admin/fragments/header :: header}"></header>

<div class="pc-container">
    <div class="pc-content">
        <!-- breadcrumb -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title">
                            <h5 class="m-b-10">Chi tiết khách hàng</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- content: bạn dán phần “cards, charts, tables …” ở đây -->
        <div class="row">
            <div class="card p-4 shadow-sm">
                <dl class="row">
                    <dt class="col-sm-3">Mã khách hàng:</dt>
                    <dd class="col-sm-9" th:text="${customer.code}"></dd>

                    <dt class="col-sm-3">Họ tên:</dt>
                    <dd class="col-sm-9" th:text="${customer.name}"></dd>

                    <dt class="col-sm-3">Email:</dt>
                    <dd class="col-sm-9" th:text="${customer.account != null ? customer.account.email : ''}"></dd>

                    <dt class="col-sm-3">Số điện thoại:</dt>
                    <dd class="col-sm-9" th:text="${customer.phoneNumber}"></dd>

                    <dt class="col-sm-3">Giới tính:</dt>
                    <dd class="col-sm-9" th:text="${customer.gender == true ? 'Nam' : (customer.gender == false ? 'Nữ' : '')}"></dd>

                    <dt class="col-sm-3">Ngày sinh:</dt>
                    <dd class="col-sm-9" th:text="${customer.birthDate != null ? #temporals.format(customer.birthDate, 'dd/MM/yyyy') : ''}"></dd>

                    <dt class="col-sm-3">Trạng thái:</dt>
                    <dd class="col-sm-9">
                        <span th:if="${customer.isActive}" class="badge bg-success">Hoạt động</span>
                        <span th:if="${!customer.isActive}" class="badge bg-danger">Không hoạt động</span>
                    </dd>

                    <dt class="col-sm-3">Địa chỉ giao hàng:</dt>
                    <dd class="col-sm-9">
                            <span th:if="${customer.addresses != null && !customer.addresses.isEmpty()}"
                                  th:text="${customer.addresses[0].addressDetail
                                    + (customer.addresses[0].wardName != null ? ', ' + customer.addresses[0].wardName : '')
                                    + (customer.addresses[0].districtName != null ? ', ' + customer.addresses[0].districtName : '')
                                    + (customer.addresses[0].provinceName != null ? ', ' + customer.addresses[0].provinceName : '')}">
                            </span>

                        <span th:if="${customer.addresses == null || customer.addresses.isEmpty()}">Chưa có địa chỉ</span>
                    </dd>
                </dl>
                <div class="mt-3">
                    <a th:href="@{/admin/customer/view}" class="btn btn-outline-secondary">⬅ Quay lại danh sách</a>
                    <a th:href="@{'/admin/customer/edit/' + ${customer.id}}" class="btn btn-primary">✏️ Sửa thông tin</a>

                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
</body>
</html>
