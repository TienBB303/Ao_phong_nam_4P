
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments/head :: head}"></head>
<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<header th:replace="~{admin/fragments/header :: header}"></header>

<div class="pc-container">
    <div class="pc-content">
        <!-- breadcrumb -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title">
                            <h5 class="m-b-10">Xin chào</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- content: bạn dán phần “cards, charts, tables …” ở đây -->
        <div class="row">
            <!-- ... dán tiếp các block còn lại từ file gốc ... -->
            <div class="container py-4">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3 mb-4">
                    <div class="col">
                        <div class="card h-100 text-center p-3">
                            <div class="h6">Tổng đơn đặt hàng</div>
                            <div class="h4" th:text="${totalOrders}">0</div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 text-center p-3">
<!--                            <div class="card text-center p-3">-->
                                <div class="h6">Số đơn chờ xử lý</div>
                                <div class="h4" th:text="${pendingOrders}">0</div>
                            </div>
                        </div>
                    <div class="col" th:if="${false}">
                        <div class="card h-100 text-center p-3">
                            <div class="h6">Số đơn chờ xác nhận (đã thanh toán)</div>
                            <div class="h4" th:text="${paidPendingOrders}">0</div>
                            <div class="small text-muted">
                                Tổng chờ xác nhận: <span th:text="${waitingOrders}">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card h-100 text-center p-3">
                            <div class="h6">Tổng doanh thu</div>
                            <div class="h4" th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0</div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 text-center p-3">
                            <div class="h6">Số sản phẩm</div>
                            <div class="h4" th:text="${totalProducts}">0</div>
                        </div>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col-lg-6">
                        <div class="card h-100">
                                <div class="card-body">
                                    <div class="h6 mb-2">Doanh thu 7 ngày gần nhất</div>
                                    <canvas id="revenueChart"
                                            th:data-labels="${dateLabels}"
                                            th:data-values="${revenueValues}"></canvas>
                                </div>
                            </div>
                        </div>
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-body">
                                <div class="h6 mb-2">Đơn hàng theo trạng thái</div>
                                <canvas id="orderPieChart"
                                        th:data-labels="${orderStatusMap.keySet()}"
                                        th:data-values="${orderStatusMap.values()}">
                                </canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Biểu đồ doanh thu 7 ngày gần nhất
        const revenueChart = document.getElementById('revenueChart');
        let dateLabels = revenueChart.getAttribute('data-labels');
        let revenueValues = revenueChart.getAttribute('data-values');
        console.log('Raw dateLabels:', dateLabels);
        console.log('Raw revenueValues:', revenueValues);
        try {
            // Parse dữ liệu từ Thymeleaf - xử lý chuỗi từ ArrayList
            if (dateLabels && dateLabels.startsWith('[') && dateLabels.endsWith(']')) {
                dateLabels = dateLabels.slice(1, -1).split(',').map(s => s.trim().replace(/['"]/g, ''));
            } else {
                dateLabels = dateLabels ? dateLabels.split(',').map(s => s.trim()) : [];
            }

            if (revenueValues && revenueValues.startsWith('[') && revenueValues.endsWith(']')) {
                revenueValues = revenueValues.slice(1, -1).split(',').map(s => parseFloat(s.trim()) || 0);
            } else {
                revenueValues = revenueValues ? revenueValues.split(',').map(s => parseFloat(s.trim()) || 0) : [];
            }
        } catch (e) {
            console.error('Error parsing revenue data:', e);
            dateLabels = [];
            revenueValues = [];
        }
        console.log('Parsed dateLabels:', dateLabels);
        console.log('Parsed revenueValues:', revenueValues);
        new Chart(revenueChart.getContext('2d'), {
            type: 'bar',
            data: {
                labels: dateLabels,
                datasets: [{
                    label: 'Doanh thu (VND)',
                    data: revenueValues,
                    backgroundColor: 'rgba(0,200,150,0.7)',
                    borderColor: 'rgba(0,200,150,1)',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: true
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return new Intl.NumberFormat('vi-VN').format(value) + ' đ';
                            }
                        }
                    }
                }
            }
        });
        // Biểu đồ tròn đơn hàng (dữ liệu động)
        const pie = document.getElementById('orderPieChart');
        let labels = pie.getAttribute('data-labels');
        let values = pie.getAttribute('data-values');
        try {
            if (labels && labels.startsWith('[') && labels.endsWith(']')) {
                labels = labels.slice(1, -1).split(',').map(s => s.trim().replace(/['"]/g, ''));
            } else {
                labels = labels ? labels.split(',').map(s => s.trim()) : [];
            }

            if (values && values.startsWith('[') && values.endsWith(']')) {
                values = values.slice(1, -1).split(',').map(s => parseInt(s.trim()) || 0);
            } else {
                values = values ? values.split(',').map(s => parseInt(s.trim()) || 0) : [];
            }
        } catch (e) {
            console.error('Error parsing order status data:', e);
            labels = [];
            values = [];
        }
        console.log('Parsed order labels:', labels);
        console.log('Parsed order values:', values);
        new Chart(pie.getContext('2d'), {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Đơn hàng',
                    data: values,
                    backgroundColor: [
                        'rgba(255,193,7,0.7)',   // Chờ xác nhận - vàng
                        'rgba(0,123,255,0.7)',   // Đã xác nhận - xanh dương
                        'rgba(108,117,125,0.7)', // Đang giao - xám
                        'rgba(40,167,69,0.7)',   // Hoàn thành - xanh lá
                        'rgba(220,53,69,0.7)',   // Đã hủy - đỏ
                        'rgba(128,0,128,0.7)',   // Giao hàng thất bại (màu bổ sung)
                    ],
                    borderWidth: 2,
                    borderColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: true,
                        position: 'bottom'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.label + ': ' + context.parsed + ' đơn';
                            }
                        }
                    }
                }
            }
        });
    });
</script>
</body>
</html>
