<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments/head :: head}"></head>
<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<header th:replace="~{admin/fragments/header :: header}"></header>

<div class="pc-container">
    <div class="pc-content">
        <!-- breadcrumb -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title align-items-center mb-3">
                            <div class="d-flex align-items-center">
                                <h5 class="m-b-10">Danh sách mã giảm giá</h5>
                                <a th:href="@{/admin/discount/create}"
                                   class="btn btn-sm btn-primary rounded-circle shadow-lg d-flex align-items-center justify-content-center"
                                   style="width: 32px; height: 32px;" title="Thêm mã giảm giá">
                                    <i class="ti ti-plus"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${error}" class="alert alert-warning alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="row">
            <div class="container mt-5">
                <form class="bg-white border rounded shadow-sm p-4 mb-4" method="get">
                    <div class="row g-3 align-items-end mb-3">
                        <!-- Mã -->
                        <div class="col-md-4">
                            <label for="code" class="form-label">Mã giảm giá</label>
                            <input type="text" name="code" id="code"
                                   class="form-control form-control-sm"
                                   placeholder="Nhập mã..." th:value="${code}">
                        </div>
                        <!-- Tên -->
                        <div class="col-md-4">
                            <label for="codeName" class="form-label">Tên giảm giá</label>
                            <input type="text" name="codeName" id="codeName"
                                   class="form-control form-control-sm"
                                   placeholder="Nhập tên..." th:value="${codeName}">
                        </div>
                        <!-- Loại -->
                        <div class="col-md-4">
                            <label for="type" class="form-label">Loại</label>
                            <select name="type" id="type"
                                    class="form-select form-select-sm">
                                <option value="">Tất cả</option>
                                <option value="percent" th:selected="${type == 'percent'}">Phần trăm</option>
                                <option value="amount" th:selected="${type == 'amount'}">Số tiền</option>
                            </select>
                        </div>
                    </div>

                    <!-- Dòng dropdown: Loại - Hãng - Chất liệu -->
                    <div class="row g-3 mb-3">
                        <!-- Ngày áp dụng -->
                        <div class="col-md-3">
                            <label for="start" class="form-label">Ngày áp dụng</label>
                            <input type="date" name="start" id="start"
                                   class="form-control form-control-sm"
                                   th:value="${start}">
                        </div>

                        <!-- Ngày kết thúc -->
                        <div class="col-md-3">
                            <label for="end" class="form-label">Ngày kết thúc</label>
                            <input type="date" name="end" id="end"
                                   class="form-control form-control-sm"
                                   th:value="${end}">
                        </div>

                        <!-- Trạng thái -->
                        <div class="col-md-4">
                            <label for="status" class="form-label">Trạng thái</label>
                            <select name="status" id="status"
                                    class="form-select form-select-sm">
                                <option value="">Tất cả</option>
                                <option value="1" th:selected="${status == 1}">Đang diễn ra</option>
                                <option value="2" th:selected="${status == 2}">Sắp diễn ra</option>
                                <option value="3" th:selected="${status == 3}">Đã kết thúc</option>
                                <option value="4" th:selected="${status == 4}">Đóng</option>
                            </select>
                        </div>
                        <!-- Nút -->
                        <div class="col-md-1 d-grid">
                            <button type="submit" class="btn btn-primary mt-4" id="search-btn" title="Tìm kiếm">
                                <i class="ti ti-search"></i>
                            </button>
                        </div>
                        <div class="col-md-1 d-grid">
                            <a th:href="@{/admin/discount/view}" class="btn btn-warning mt-4" id="clear_search"
                               title="Xóa tìm kiếm">
                                <i class="ti ti-eraser"></i>
                            </a>
                        </div>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle text-center">
                        <thead>
                        <tr>
                            <th>STT</th>
                            <th class="wrap-col">Mã giảm giá</th>
                            <th class="wrap-col">Tên giảm giá</th>
                            <th>Ngày áp dụng</th>
                            <th>Ngày hết hạn</th>
                            <th>Kiểu</th>
                            <th>Giá trị giảm</th>
                            <th>Số lượng</th>
                            <th>Trạng thái</th>
                            <th>Công cụ</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d, iterStat : ${list}">
                            <td th:text="${iterStat.index + 1}"></td>
                            <td th:text="${d.code}"></td>
                            <td th:text="${d.codeName}"></td>
                            <td th:text="${#temporals.format(d.startDatetime, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${#temporals.format(d.endDatetime, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${d.discountType == 'percent' ? 'Phần trăm' : 'Số tiền'}"></td>
                            <td>
                              <span th:if="${d.discountType == 'percent'}"
                                    th:text="${d.discountValue != null ? d.discountValue : 0} + ' %'"></span>
                                <span th:if="${d.discountType == 'amount'}"
                                      th:text="${d.discountValue != null ? #numbers.formatDecimal(d.discountValue, 0, 'POINT', 0, 'COMMA') + '₫' : '0₫'}"></span>
                            </td>
                            <td th:text="${d.usageLimit}"></td>
                            <td>
                              <span th:switch="${d.displayStatus}">
                                <span th:case="'Đã kết thúc'" class="badge bg-secondary">Đã kết thúc</span>
                                <span th:case="'Sắp diễn ra'" class="badge bg-info text-dark">Sắp diễn ra</span>
                                <span th:case="'Đã đóng'" class="badge bg-dark">Đã đóng</span>
                                <span th:case="'Đang diễn ra'" class="badge bg-success">Đang diễn ra</span>
                              </span>
                            </td>
                            <td class="text-nowrap">
                                <a class="btn btn-outline-success btn-sm"
                                   th:href="@{'/admin/discount/toggle-status/' + ${d.id}}"
                                   onclick="return confirm('Bạn có chắc chắn muốn đổi trạng thái?')"
                                   title="Đổi trạng thái"><i class="ti ti-arrows-right-left"></i></a>
                                <a class="btn btn-outline-warning btn-sm" th:href="@{'/admin/discount/edit/' + ${d.id}}"
                                   title="Sửa"><i class="ti ti-pencil"></i></a>
                                <a class="btn btn-outline-primary btn-sm"
                                   th:href="@{'/admin/discount/detail/' + ${d.id}}" title="Chi tiết">👁️</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="mt-3">
                    <div class="d-flex justify-content-end">
                        <ul class="pagination">

                            <!-- Nút « Previous -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/discount/view(
                           page=${currentPage - 1},
                           code=${code},
                           codeName=${codeName},
                           start=${start},
                           end=${end},
                           type=${type},
                           status=${status})}">Trước</a>
                            </li>

                            <!-- Các trang -->
                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link"
                                   th:href="@{/admin/discount/view(
                           page=${i},
                           code=${code},
                           codeName=${codeName},
                           start=${start},
                           end=${end},
                           type=${type},
                           status=${status})}"
                                   th:text="${i + 1}">1</a>
                            </li>

                            <!-- Nút » Next -->
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/discount/view(
                           page=${currentPage + 1},
                           code=${code},
                           codeName=${codeName},
                           start=${start},
                           end=${end},
                           type=${type},
                           status=${status})}">Sau</a>
                            </li>

                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
<script>

    document.addEventListener("DOMContentLoaded", function () {
        const searchBtn = document.getElementById("search-btn");
        if (searchBtn) {
            searchBtn.addEventListener("click", function (e) {
                e.preventDefault();
                const params = new URLSearchParams();

                const getValue = (selector) => {
                    const el = document.querySelector(selector);
                    return el ? el.value : "";
                };

                params.set("page", 0); // reset về trang đầu tiên
                params.set("code", getValue("input[name='code']"));
                params.set("codeName", getValue("input[name='codeName']"));
                params.set("start", getValue("input[name='start']"));
                params.set("end", getValue("input[name='end']"));
                params.set("status", getValue("select[name='status']"));
                params.set("type", getValue("select[name='type']"));

                window.location.search = params.toString();
            });
        }
    });
</script>
</body>
</html>
