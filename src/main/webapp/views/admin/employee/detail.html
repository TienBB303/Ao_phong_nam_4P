<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments/head :: head}"></head>
<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">

<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<header th:replace="~{admin/fragments/header :: header}"></header>

<div class="pc-container">
    <div class="pc-content">
        <!-- breadcrumb -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title">
                            <h5 class="m-b-10">Chi tiết nhân viên</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <form th:object="${accountDto}" method="post">
            <div class="mb-3">
                <label class="form-label">Mã NV:</label>
                <input type="text" th:field="*{code}" class="form-control" readonly/>
            </div>

            <div class="mb-3">
                <label class="form-label">Họ tên:</label>
                <input type="text" th:field="*{customer.name}" class="form-control" readonly/>
            </div>

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" readonly/>
            </div>

            <div class="mb-3">
                <label class="form-label">Số điện thoại:</label>
                <input type="text" th:field="*{customer.phoneNumber}" class="form-control" readonly/>
            </div>

            <div class="mb-3">
                <label class="form-label">Ngày sinh:</label>
                <input type="text"
                       th:value="${#temporals.format(accountDto.customer.birthDate, 'dd/MM/yyyy')}"
                       class="form-control" readonly/>
            </div>

            <div class="mb-3">
                <label class="form-label">Giới tính:</label>
                <input type="text" th:value="${accountDto.customer.gender ? 'Nam' : 'Nữ'}"
                       class="form-control" readonly/>
            </div>

            <div class="mb-3">
                <label class="form-label">Địa chỉ:</label>
                <input type="text" th:each="addr : ${accountDto.customer.addresses}" th:value="${addr.addressDetail + ', ' + addr.wardName + ', ' + addr.districtName + ', ' + addr.provinceName}"
                       class="form-control" readonly/>
            </div>

            <div class="mb-3">
                <label class="form-label">Trạng thái:</label>
                <input type="text" th:value="${accountDto.status ? 'Hoạt động' : 'Ngưng'}"
                       class="form-control" readonly/>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/admin/users}" class="btn btn-dark">⬅ Quay lại</a>
                <a class="btn btn-primary" th:href="@{'/admin/users/edit'(id=${accountDto.id})}">✏️ Sửa</a>
            </div>
        </form>

    </div>
</div>

<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
</body>
</html>
