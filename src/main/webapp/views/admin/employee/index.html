<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments/head :: head}"></head>
<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<header th:replace="~{admin/fragments/header :: header}"></header>

<div class="pc-container">
    <div class="pc-content">
        <!-- breadcrumb -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title align-items-center mb-3">
                            <div class="d-flex align-items-center">
                                <h5 class="m-b-10">Quản lý nhân viên</h5>
                                <a th:href="@{/admin/users/save}"
                                   class="btn btn-sm btn-primary rounded-circle shadow-lg d-flex align-items-center justify-content-center"
                                   style="width: 32px; height: 32px;" title="Thêm mới nhân viên">
                                    <i class="ti ti-plus"></i>
                                </a>
                            </div>

                            <!-- Xóa breadcrumb Dashboard / Quản lý tài khoản / Nhân viên và nút Hủy về /admin/users. -->

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- content: bạn dán phần “cards, charts, tables …” ở đây -->
        <div class="row">
            <div class="card-body">
                <form class="p-4 rounded shadow-sm mb-4" method="get">
                    <div class="row g-3 align-items-end mb-3">
                        <div class="col-md-10">
                            <label for="keyword" class="form-label">Tìm kiếm theo tên hoặc mã NV</label>
                            <input type="text" name="keyword" id="keyword" class="form-control"
                                   placeholder="Nhập tên hoặc mã..." th:value="${keyword}">
                        </div>
                        <div class="col-md-1 d-grid">
                            <button type="submit" class="btn btn-primary mt-4" id="search-btn" title="Tìm kiếm">
                                <i class="ti ti-search"></i>
                            </button>
                        </div>
                        <div class="col-md-1 d-grid">
                            <a th:href="@{/admin/users}" class="btn btn-warning mt-4" id="clear_search" title="Xóa tìm kiếm">
                                <i  class="ti ti-eraser"></i>
                            </a>
                        </div>
                    </div>
                </form>
                <div class="table-responsive">
                    <table id="multi-colum-dt" class="table table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>STT</th>
                            <th>Mã NV</th>
                            <th>Họ và tên</th>
                            <th>Email</th>
                            <th>SĐT</th>
                            <th>Ngày sinh</th>
                            <th>Giới tính</th>
                            <th>Địa chỉ</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="e, i : ${accountPage.content}">
                            <td th:text="${i.index + 1}"></td>
                            <td th:text="${e.code}"></td>
                            <td th:text="${e.customer.name}"></td>
                            <td th:text="${e.email}"></td>
                            <td th:text="${e.customer.phoneNumber}"></td>
                            <td th:text="${#temporals.format(e.customer.birthDate, 'dd/MM/yyyy')}"></td>
                            <td th:text="${e.customer.gender == true ? 'Nam' : 'Nữ'}"></td>
                            <td th:each="address : ${e.customer.addresses}" th:text="${address.addressDetail + ', ' + address.wardName + ', ' + address.districtName + ', ' + address.provinceName}"></td>
                            <td>
                                <span th:class="${e.status} ? 'badge bg-success' : 'badge bg-danger'"
                                      th:text="${e.status} ? 'Đang hoạt động' : 'Đã khóa'"></span>
                            </td>
                            <td style="text-align: center">
                                <a class="btn btn-outline-info" th:href="@{'/admin/users/detail'(id=${e.id})}" style="width: 70px" title="Xem">
                                    👁️
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-end">

                        <!-- Previous -->
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link"
                               th:href="${currentPage > 0} ? @{|?page=${currentPage - 1}&size=5|} : '#'">Trước</a>
                        </li>

                        <!-- Page Numbers -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{|?page=${i}&size=5|}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <!-- Next -->
                        <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                            <a class="page-link"
                               th:href="${currentPage < totalPages - 1} ? @{|?page=${currentPage + 1}&size=5|} : '#'">Sau</a>
                        </li>

                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
</body>
</html>
