<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            z-index: 10;
            color: #6c757d;
            user-select: none;
        }

        .password-toggle:hover {
            color: #495057;
        }

        .form-control {
            padding-right: 45px;
        }
        /* Tránh chồng icon: khi có icon validate (đỏ/xanh) thì chừa thêm khoảng trống và dời icon mắt sang trái */
        .password-container .form-control.is-invalid,
        .password-container .form-control.is-valid {
            padding-right: 90px; /* đủ chỗ cho cả icon validate và icon mắt */
        }
        .password-container .form-control.is-invalid ~ .password-toggle,
        .password-container .form-control.is-valid ~ .password-toggle {
            right: 50px; /* đẩy icon mắt lệch trái để không đè icon cảnh báo */
        }
    </style>
</head>
<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4">Đổi mật khẩu - Tài khoản của tôi</h3>
                    <!-- Hiển thị thông báo -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <form th:action="@{/user/change-password-request}" method="post" id="changePasswordForm">
                        <!-- Mật khẩu hiện tại -->
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label">Mật khẩu hiện tại <span
                                    class="text-danger">*</span></label>
                            <div class="password-container">
                                <input type="password" class="form-control" id="oldPassword" name="oldPassword"
                                       required>
                                <i class="fas fa-eye password-toggle" onclick="togglePassword('oldPassword', this)"></i>
                            </div>
                        </div>

                        <!-- Mật khẩu mới -->
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Mật khẩu mới <span class="text-danger">*</span></label>
                            <div class="password-container">
                                <input type="password" class="form-control" id="newPassword" name="newPassword"
                                       required>
                                <i class="fas fa-eye password-toggle" onclick="togglePassword('newPassword', this)"></i>
                            </div>
                            <div class="form-text">
                                <i class="fas fa-info-circle me-1"></i>
                                Mật khẩu phải có ít nhất 6 ký tự và khác mật khẩu hiện tại
                            </div>
                            <!-- Password strength indicator -->
                            <div id="passwordStrength" class="mt-2" style="display:none;">
                                <div class="progress">
                                    <div class="progress-bar" role="progressbar"></div>
                                </div>
                                <small id="strengthText" class="form-text"></small>
                            </div>
                        </div>

                        <!-- Xác nhận mật khẩu -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới <span
                                    class="text-danger">*</span></label>
                            <div class="password-container">
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                       required>
                                <i class="fas fa-eye password-toggle"
                                   onclick="togglePassword('confirmPassword', this)"></i>
                            </div>
                            <!-- Password match indicator -->
                            <div id="passwordMatch" class="form-text"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                            <i class="fas fa-sync-alt me-2"></i>Đổi mật khẩu
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a th:href="@{/user/profile}" class="text-decoration-none">
                            <i class="fas fa-arrow-left me-2"></i>Quay lại trang cá nhân
                        </a>
                    </div>
                </div> <!-- card-body -->
            </div> <!-- card shadow -->
        </div> <!-- col -->
    </div> <!-- row -->
</div> <!-- container -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Hàm toggle password đơn giản và hiệu quả
        function togglePassword(fieldId, icon) {
            const input = document.getElementById(fieldId);

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const oldPassword = document.getElementById('oldPassword');
            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            const passwordStrength = document.getElementById('passwordStrength');
            const strengthText = document.getElementById('strengthText');
            const passwordMatch = document.getElementById('passwordMatch');

            // Password strength checker
            function checkPasswordStrength(password) {
                let strength = 0;
                let feedback = [];

                if (password.length >= 6) strength += 1;
                else feedback.push('ít nhất 6 ký tự');

                if (/[a-z]/.test(password)) strength += 1;
                if (/[A-Z]/.test(password)) strength += 1;
                if (/[0-9]/.test(password)) strength += 1;
                if (/[^A-Za-z0-9]/.test(password)) strength += 1;

                const levels = ['Rất yếu', 'Yếu', 'Trung bình', 'Mạnh', 'Rất mạnh'];
                const colors = ['danger', 'warning', 'info', 'success', 'success'];

                return {
                    score: strength,
                    level: levels[strength] || 'Rất yếu',
                    color: colors[strength] || 'danger',
                    feedback: feedback
                };
            }

            // Real-time password strength validation
            if (newPassword) {
                newPassword.addEventListener('input', function () {
                    const password = this.value;

                    if (password.length > 0) {
                        passwordStrength.style.display = 'block';
                        const strength = checkPasswordStrength(password);

                        const progressBar = passwordStrength.querySelector('.progress-bar');
                        progressBar.style.width = (strength.score * 20) + '%';
                        progressBar.className = `progress-bar bg-${strength.color}`;

                        strengthText.textContent = `Độ mạnh: ${strength.level}`;
                        strengthText.className = `form-text text-${strength.color}`;

                        if (strength.feedback.length > 0) {
                            strengthText.textContent += ` (Cần: ${strength.feedback.join(', ')})`;
                        }
                    } else {
                        passwordStrength.style.display = 'none';
                    }

                    validatePasswordMatch();
                });
            }

            // Password match validation
            function validatePasswordMatch() {
                const oldPass = oldPassword.value;
                const newPass = newPassword.value;
                const confirmPass = confirmPassword.value;

                if (confirmPass.length > 0) {
                    passwordMatch.style.display = 'block';
                    // 1) Không cho phép xác nhận trùng với mật khẩu hiện tại
                    if (confirmPass === oldPass) {
                        passwordMatch.textContent = '✗ Mật khẩu xác nhận không được trùng với mật khẩu hiện tại';
                        passwordMatch.className = 'form-text text-danger';
                        confirmPassword.classList.remove('is-valid');
                        confirmPassword.classList.add('is-invalid');
                        return;
                    }
                    if (newPass === confirmPass) {
                        passwordMatch.textContent = '✓ Mật khẩu khớp';
                        passwordMatch.className = 'form-text text-success';
                        confirmPassword.classList.remove('is-invalid');
                        confirmPassword.classList.add('is-valid');
                    } else {
                        passwordMatch.textContent = '✗ Mật khẩu không khớp';
                        passwordMatch.className = 'form-text text-danger';
                        confirmPassword.classList.remove('is-valid');
                        confirmPassword.classList.add('is-invalid');
                    }
                } else {
                    passwordMatch.style.display = 'none';
                    confirmPassword.classList.remove('is-invalid', 'is-valid');
                }
            }

            if (confirmPassword) {
                confirmPassword.addEventListener('input', validatePasswordMatch);
            }

            // Form submission
            document.getElementById('changePasswordForm').addEventListener('submit', function (e) {

                let isValid = true;
                let errorMessage = '';

                if (!oldPassword.value.trim()) {
                    isValid = false;
                    errorMessage = 'Vui lòng nhập mật khẩu hiện tại!';
                    oldPassword.focus();
                } else if (newPassword.value.length < 6) {
                    isValid = false;
                    errorMessage = 'Mật khẩu mới phải có ít nhất 6 ký tự!';
                    newPassword.focus();
                } else if (newPassword.value === oldPassword.value) {
                    isValid = false;
                    errorMessage = 'Mật khẩu mới phải khác mật khẩu hiện tại!';
                    newPassword.focus();
                } else if (confirmPassword.value === oldPassword.value) {
                    isValid = false;
                    errorMessage = 'Mật khẩu xác nhận không được trùng với mật khẩu hiện tại!';
                    confirmPassword.focus();
                } else if (newPassword.value !== confirmPassword.value) {
                    isValid = false;
                    errorMessage = 'Mật khẩu xác nhận không khớp!';
                    confirmPassword.focus();
                }

                if (!isValid) {
                    e.preventDefault(); // chỉ chặn khi có lỗi
                    alert(errorMessage);
                }

            });
        });
    </script>
    </body>
</html>
