<!-- templates/user/profile.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout-user.html}">
<head>
    <title>Thông tin tài khoản</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-user me-2"></i>Thông tin tài khoản</h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="row">
                            <div class="col-md-6">
                                <h5 class="text-primary mb-3">Thông tin cá nhân</h5>
                                <div class="mb-3">
                                    <label class="fw-bold">Họ và tên:</label>
                                    <p class="text-muted" th:text="${customer.name}">Tên khách hàng</p>
                                </div>
                                <div class="mb-3">
                                    <label class="fw-bold">Số điện thoại:</label>
                                    <p class="text-muted" th:text="${customer.phoneNumber}">Số điện thoại</p>
                                </div>
                                <div class="mb-3">
                                    <label class="fw-bold">Email:</label>
                                    <p class="text-muted" th:text="${account.email}">Email</p>
                                </div>
                                <div class="mb-3">
                                    <label class="fw-bold">Mã khách hàng:</label>
                                    <p class="text-muted" th:text="${customer.code}">Mã khách hàng</p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <h5 class="text-primary mb-3">Thông tin tài khoản</h5>
                                <div class="mb-3">
                                    <label class="fw-bold">Trạng thái:</label>
                                    <span th:if="${account.status}" class="badge bg-success">Đã kích hoạt</span>
                                    <span th:unless="${account.status}" class="badge bg-warning">Chưa kích hoạt</span>
                                </div>
                                <div class="mb-3">
                                    <label class="fw-bold">Ngày tạo:</label>
                                    <p class="text-muted" th:text="${#temporals.format(account.createdAt, 'dd/MM/yyyy HH:mm')}">Ngày tạo</p>
                                </div>
<!--                                <div class="mb-3">-->
<!--                                    <label class="fw-bold">Vai trò:</label>-->
<!--                                    <p class="text-muted" th:text="${account.role.name}">Vai trò</p>-->
<!--                                </div>-->
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        <div class="text-center">
                            <a href="/" class="btn btn-primary me-2">
                                <i class="fas fa-home me-1"></i>Về trang chủ
                            </a>
                            <a href="/user/orders" class="btn btn-outline-primary">
                                <i class="fas fa-shopping-bag me-1"></i>Xem đơn hàng
                            </a>
                            <button type="button" class="btn btn-warning ms-2" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                                <i class="fas fa-edit me-1"></i>Chỉnh sửa thông tin
                            </button>
                        </div>
                        <!-- Modal chỉnh sửa thông tin cá nhân -->
                        <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
                          <div class="modal-dialog">
                            <div class="modal-content">
                              <form th:action="@{/user/profile/edit}" method="post" th:object="${customer}">
                                <div class="modal-header">
                                  <h5 class="modal-title" id="editProfileModalLabel">Chỉnh sửa thông tin cá nhân</h5>
                                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                  <div class="mb-3">
                                    <label for="name" class="form-label">Họ và tên</label>
                                    <input type="text" id="name" th:field="*{name}" class="form-control" required>
                                  </div>
                                  <div class="mb-3">
                                      <label class="form-label">Giới tính:</label>
                                    <div>
                                      <input type="radio" id="male" name="gender" th:field="*{gender}" value="true"> <label for="male">Nam</label>
                                      <input type="radio" id="female" name="gender" th:field="*{gender}" value="false"> <label for="female">Nữ</label>
                                    </div>
                                  </div>
                                  <div class="mb-3">
                                    <label for="birthday" class="form-label">Ngày sinh</label>
                                    <input type="date" id="birthday" th:field="*{birthday}" class="form-control">
                                  </div>
                                  <div class="mb-3">
                                    <label for="phoneNumber" class="form-label">Số điện thoại</label>
                                    <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" required>
                                  </div>
                                  <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" id="email" th:field="*{email}" class="form-control" readonly>
                                  </div>
                                  <div class="mb-3">
                                    <label for="addressDetail" class="form-label">Địa chỉ cụ thể</label>
                                    <input type="text" id="addressDetail" th:field="*{address.addressDetail}" class="form-control">
                                  </div>
                                  <!-- Các trường tỉnh/thành, quận/huyện, phường/xã, isDefault, receiverName, receiverPhoneNumber có thể bổ sung thêm -->
                                </div>
                                <div class="modal-footer">
                                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                  <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                                </div>
                              </form>
                            </div>
                          </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
