<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout-user.html}">
<head>
    <title>4PStore</title>
    <link rel="stylesheet" th:href="@{/assets/css/mdb.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style-preset.css}">
    <link rel="stylesheet" th:href="@{/assets/css/uikit.css}">
    <link rel="stylesheet" th:href="@{/assets/css/landing.css}">

    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            rel="stylesheet"
    />
    <style>
        .carousel-inner img {
            width: 100%;
            height: 700px;          /* hoặc chiều cao bạn mong muốn */
            object-fit: contain;    /* giữ nguyên toàn bộ ảnh, không crop */
            background-color: #ffffff; /* hoặc trắng, để lấp phần thừa nếu ảnh không full */
        }
        /* Card sản phẩm */
        .product-card {
            transition: transform 0.3s, box-shadow 0.3s;
            border-radius: 10px;
            overflow: hidden;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* Ảnh sản phẩm */
        .product-img {
            height: 260px;
            width: 100%;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
            transition: transform 0.4s ease;
        }
        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        /* Tên sản phẩm */
        .product-name {
            font-size: 15px;
            line-height: 1.4;
            min-height: 40px; /* giữ layout đều nhau nếu tên dài */
            transition: color 0.2s;
        }
        .product-card:hover .product-name {
            color: #0d6efd;
        }

        /* Giá */
        .product-price {
            font-size: 16px;
            color: #dc3545;
        }
    </style>

</head>
<body>
<nav class="navbar fixed-top navbar-expand-lg navbar-light bg-white">
    <div class="container">
        <button
                class="navbar-toggler"
                type="button"
                data-mdb-toggle="collapse"
                data-mdb-target="#navbarSupportedContent1"
                aria-controls="navbarSupportedContent1"
                aria-expanded="false"
                aria-label="Toggle navigation"
        >
            <i class="fas fa-bars"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent1">
            <a class="navbar-brand mt-2 mt-sm-0" href="https://mdbootstrap.com/">
                <img
                        src=""
                        height="20"
                        alt=""
                        loading="lazy"
                />
            </a>
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item active">
                    <a class="nav-link " th:href="@{/}">Home</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/product}">Product</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="">About </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="">Blog</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tracking}">Tra cứu đơn hàng</a>
                </li>
            </ul>
        </div>

        <div class="d-flex align-items-center gap-3">
            <div th:if="${username != null}" class="d-flex align-items-center gap-2">
                <span>Xin chào, <strong th:text="${username}">username</strong></span>
                <a th:href="@{/logout}" onclick="return confirm('Bạn chắc chắn muốn đăng xuất?')"
                   class="btn btn-sm btn-outline-danger">Đăng xuất</a>
            </div>

            <div th:if="${username == null}" class="d-flex align-items-center gap-2">
                <a th:href="@{/login}" class="btn btn-sm btn-outline-primary">Đăng nhập</a>
                <a th:href="@{/register}" class="btn btn-sm btn-outline-secondary">Đăng ký</a>
            </div>

            <a class="nav-link position-relative" href="/cart">
                <i class="fas fa-shopping-cart fa-lg"></i>
                <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill"></span>
            </a>
        </div>
    </div>
</nav>
<div layout:fragment="content">
    <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
<!--                <img th:src="@{/assets/images/slider/img-slide-1.jpg}" class="d-block w-100" alt="Slide 1">-->
                <img th:src="@{/assets/images/banner1.png}" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
<!--                <img th:src="@{/assets/images/slider/img-slide-2.jpg}" class="d-block w-100" alt="Slide 2">-->
                <img th:src="@{/assets/images/banner2.png}" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
<!--                <img th:src="@{/assets/images/slider/img-slide-3.jpg}" class="d-block w-100" alt="Slide 3">-->
                <img th:src="@{/assets/images/banner3.png}" class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- Bộ lọc tìm kiếm -->
    <section class="container my-4">
        <form method="get" class="row g-3">
            <div class="col-md-3">
                <input class="form-control" name="name" placeholder="Tên sản phẩm"
                       th:value="${name}">
            </div>
            <div class="col-md-2">
                <select class="form-select" name="brandId">
                    <option value="">-- Hãng --</option>
                    <option th:each="b : ${listBrand}" th:value="${b.id}"
                            th:text="${b.name}" th:selected="${brandId == b.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select class="form-select" name="categoryId">
                    <option value="">-- Danh mục --</option>
                    <option th:each="c : ${listCategory}" th:value="${c.id}"
                            th:text="${c.name}" th:selected="${categoryId == c.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select class="form-select" name="materialId">
                    <option value="">-- Chất liệu --</option>
                    <option th:each="m : ${listMaterial}" th:value="${m.id}"
                            th:text="${m.name}" th:selected="${materialId == m.id}"></option>
                </select>
            </div>
            <div class="col-md-2 d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-primary w-50" type="submit">
                    <i class="fas fa-search"></i>
                </button>
                <a th:href="@{/}" class="btn btn-sm btn-outline-secondary w-50">
                    <i class="fas fa-eraser"></i>
                </a>
            </div>

        </form>
    </section>

    <!-- Danh sách sản phẩm -->
    <section class="container mb-5" style="padding-top: 5px">
        <div class="row g-4">
            <div class="col-lg-3 col-md-4 col-sm-6" th:each="product : ${listProduct}">
                <a th:href="@{'/product-detail/' + ${product.code}}" class="text-decoration-none text-dark">
                    <div class="card h-80 product-card border-0 shadow p-5">
                        <!-- Ảnh sản phẩm -->
                        <div class="position-relative">
                            <img th:if="${product.mainImagePath != null}"
                                 th:src="@{${product.mainImagePath}}"
                                 class="card-img-top product-img"
                                 alt="Ảnh sản phẩm"/>
                            <img th:if="${product.mainImagePath == null}"
                                 src="/images/no-image.png"
                                 class="card-img-top product-img"
                                 alt="Ảnh sản phẩm"/>

                            <!-- Nhãn HẾT HÀNG -->
                            <span class="badge bg-danger rounded-pill position-absolute top-0 start-0 m-2 px-3 py-2"
                                th:if="${totalQuantity[product.id] == 0 or totalQuantity[product.id] == null}">
                                Hết hàng
                            </span>
                        </div>

                        <!-- Thông tin sản phẩm -->
                        <div class="card-body text-center">
                            <h6 class="card-title fw-bold mb-2 product-name" th:text="${product.name}">
                                Tên sản phẩm
                            </h6>
                            <p class="text-danger fw-bold mb-0 product-price" th:text="${priceRanges[product.id]}">
                                100.000 - 150.000đ
                            </p>
                        </div>
                        <div class="card-body text-center">
                            <a th:href="@{'/product-detail/' + ${product.code}}" class="btn btn-outline-info bg-blue-500 shadow-lg" title="Thêm vào giỏ hàng" style="width: 120px;">
                                <i class="ti ti-shopping-cart-plus"></i>
                            </a>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <!-- Phân trang -->
    <nav th:if="${listProduct != null and listProduct.totalPages > 0}">
        <ul class="pagination justify-content-center mt-4">
            <!-- Previous -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/(page=${currentPage - 1}, name=${name}, brandId=${brandId}, categoryId=${categoryId}, materialId=${materialId})}">«</a>
            </li>
            <!-- Pages -->
            <li class="page-item"
                th:each="pageNum : ${#numbers.sequence(0, listProduct.totalPages - 1)}"
                th:classappend="${pageNum == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/(page=${pageNum}, name=${name}, brandId=${brandId}, categoryId=${categoryId}, materialId=${materialId})}"
                   th:text="${pageNum + 1}">1</a>
            </li>
            <!-- Next -->
            <li class="page-item" th:classappend="${currentPage + 1 == listProduct.totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/(page=${currentPage + 1}, name=${name}, brandId=${brandId}, categoryId=${categoryId}, materialId=${materialId})}">»</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
