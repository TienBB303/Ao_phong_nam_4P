    <!-- Bộ lọc tìm kiếm -->
<section class="container my-4">
    <form method="get" class="row g-3">
        <div class="col-md-3">
            <input class="form-control" name="name" placeholder="Tên sản phẩm"
                   th:value="${name}">
        </div>
        <div class="col-md-2">
            <select class="form-select" name="brandId">
                <option value="">-- Hãng --</option>
                <option th:each="b : ${listBrand}" th:value="${b.id}"
                        th:text="${b.name}" th:selected="${brandId == b.id}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select" name="categoryId">
                <option value="">-- Danh mục --</option>
                <option th:each="c : ${listCategory}" th:value="${c.id}"
                        th:text="${c.name}" th:selected="${categoryId == c.id}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select" name="materialId">
                <option value="">-- Chất liệu --</option>
                <option th:each="m : ${listMaterial}" th:value="${m.id}"
                        th:text="${m.name}" th:selected="${materialId == m.id}"></option>
            </select>
        </div>
        <div class="col-md-2 d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-primary w-50" type="submit">
                <i class="fas fa-search"></i>
            </button>
            <a th:href="@{/}" class="btn btn-sm btn-outline-secondary w-50">
                <i class="fas fa-eraser"></i>
            </a>
        </div>

    </form>
</section>

<!-- Danh sách sản phẩm -->

<section class="container mb-5">
    <div class="row">
        <div class="col-lg-3 col-md-4 col-sm-6 mb-4" th:each="product : ${listProduct}">
            <a th:href="@{'/product-detail/' + ${product.code}}" class="text-decoration-none text-dark">
                <div class="card h-100 shadow-sm border-0 hover-shadow" style="transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                    <!-- Ảnh sản phẩm -->
                    <div class="position-relative">
                        <img src="/images/default-product.jpg" class="img-fluid"
                             style="height: 220px; object-fit: cover;" alt="Ảnh sản phẩm"/>

                        <!-- Hiển thị nhãn HẾT HÀNG -->
                        <span class="badge bg-danger position-absolute top-0 start-0 m-2"
                              th:if="${totalQuantity[product.id] == 0 or totalQuantity[product.id] == null}">
                    Hết hàng
                </span>
                    </div>
                    <div class="card-body text-center">
                        <h6 class="card-title fw-bold mb-2" th:text="${product.name}">Tên sản phẩm</h6>
                        <p class="text-danger fw-bold" th:text="${priceRanges[product.id]}">100.000 - 150.000đ</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</section>
    <!-- Phân trang -->
<nav th:if="${listProduct.totalPages > 0}">
    <ul class="pagination justify-content-center mt-4">

        <!-- Previous -->
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link"
               th:href="@{/(page=${currentPage - 1},
                            name=${name},
                            brandId=${brandId},
                            categoryId=${categoryId},
                            materialId=${materialId})}">«</a>
        </li>

        <!-- Pages -->
        <li class="page-item"
            th:each="pageNum : ${#numbers.sequence(0, listProduct.totalPages - 1)}"
            th:classappend="${pageNum == currentPage} ? 'active'">
            <a class="page-link"
               th:href="@{/(page=${pageNum},
                            name=${name},
                            brandId=${brandId},
                            categoryId=${categoryId},
                            materialId=${materialId})}"
               th:text="${pageNum + 1}">1</a>
        </li>

        <!-- Next -->
        <li class="page-item" th:classappend="${currentPage + 1 == listProduct.totalPages} ? 'disabled'">
            <a class="page-link"
               th:href="@{/(page=${currentPage + 1},
                            name=${name},
                            brandId=${brandId},
                            categoryId=${categoryId},
                            materialId=${materialId})}">»</a>
        </li>
    </ul>
</nav>
