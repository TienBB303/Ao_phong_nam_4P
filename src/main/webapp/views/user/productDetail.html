<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout-user.html}">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
        #productImageCarousel .carousel-inner {
            height: 450px; /* khung cố định */
        }

        #productImageCarousel img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;  /* giữ nguyên tỷ lệ, không crop */
            margin: auto;         /* căn giữa */
            display: block;
        }

        .btn-check:checked + .btn {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }
        .btn-check:disabled + .btn {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.disabled, .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>

</head>

<body>
<div layout:fragment="content">
    <main class="mt-5 pt-4">
        <div class="container mt-5">
            <div class="row g-4">
                <!-- Ảnh sản phẩm -->
                <div class="col-md-6" th:if="${!listProductDetail.isEmpty()}">
                    <!-- Container giới hạn kích thước -->
                    <div class="position-relative bg-light rounded shadow-sm p-3">
                        <div id="productImageCarousel" class="carousel slide" data-mdb-ride="carousel"
                             style="max-width: 100%; height: 450px; overflow: hidden;">
                            <div class="carousel-inner h-100">
                                <div th:each="image, iterStat : ${uniqueImages}"
                                     th:class="'carousel-item h-100' + (${iterStat.index == 0} ? ' active' : '')">
                                    <img th:src="${image.path_file}"
                                         class="d-block mx-auto"
                                         alt="Ảnh sản phẩm"
                                         style="max-height: 450px; object-fit: contain;">
                                </div>
                                <div th:if="${uniqueImages.isEmpty()}">
                                    <p class="text-center">Không có ảnh</p>
                                </div>
                            </div>

                            <!-- Nút điều hướng -->
                            <button class="carousel-control-prev" type="button" data-mdb-target="#productImageCarousel"
                                    data-mdb-slide="prev">
                                <span class="carousel-control-prev-icon"></span>
                            </button>
                            <button class="carousel-control-next" type="button" data-mdb-target="#productImageCarousel"
                                    data-mdb-slide="next">
                                <span class="carousel-control-next-icon"></span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Thông tin sản phẩm -->
                <div class="col-md-6">
                    <div class="p-3" id="productInfo" th:data-product-id="${product.id}">
                        <div class="d-flex align-items-center mb-3">
                            <span class="badge bg-dark me-2" th:text="${product.brand.name}"></span>
                            <span class="badge bg-danger" th:text="${product.material.name}"></span>
                        </div>

                        <h2 class="fw-bold mb-3" th:text="${product.name}">Tên sản phẩm</h2>
                        <!-- Chọn màu -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chọn màu:</label>
                            <div class="d-flex flex-wrap gap-2">
                                <div th:each="color : ${colors}">
                                    <input type="radio" class="btn-check" name="colorId" th:id="'color-' + ${color.id}" th:value="${color.id}">
                                    <label class="btn btn-outline-dark btn-sm" th:for="'color-' + ${color.id}" th:text="${color.name}"></label>
                                </div>
                            </div>
                        </div>

                        <!-- Chọn size -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chọn size:</label>
                            <div class="d-flex flex-wrap gap-2">
                                <div th:each="size : ${sizes}">
                                    <input type="radio" class="btn-check" name="sizeId" th:id="'size-' + ${size.id}" th:value="${size.id}">
                                    <label class="btn btn-outline-primary btn-sm" th:for="'size-' + ${size.id}" th:text="${size.name}"></label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="quantity" class="form-label">Số lượng:</label>
                            <input type="number" id="quantity" name="quantity" value="1" min="1"
                                   class="form-control w-25">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Giá: </label>
                            <span id="priceDisplay" class="fw-bold text-danger">--</span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tồn kho: </label>
                            <span id="quantityDisplay" class="fw-bold text-success">--</span>
                        </div>

                        <form id="addToCartForm">
                            <input type="hidden" id="productDetailId" name="productDetailId"/>
                            <input type="hidden" id="quantityHidden" name="quantity" value="1"/>
                            <button type="submit" class="btn btn-primary me-2">Thêm vào giỏ</button>
                            <button type="button" class="btn btn-danger" id="buyNowBtn"> Mua ngay</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script>
            $(document).ready(function () {
                const productId = $("#productInfo").data("product-id");

                function fetchDetailInfo() {
                    const colorId = $("input[name='colorId']:checked").val();
                    const sizeId = $("input[name='sizeId']:checked").val();

                    if (colorId && sizeId) {
                        $.ajax({
                            url: "/api/product-detail/info-product-detail", // Ở ApiProductController
                            type: "GET",
                            data: { productID: productId, colorID: colorId, sizeID: sizeId },
                            success: function (data) {
                                const priceFormatted = new Intl.NumberFormat('vi-VN', {
                                    style: 'currency',
                                    currency: 'VND'
                                }).format(data.price);

                                $("#priceDisplay").text(priceFormatted);
                                $("#quantityDisplay").text(data.quantity);
                                $("#productDetailId").val(data.id);
                            },
                            error: function () {
                                $("#priceDisplay").text("--");
                                $("#quantityDisplay").text("--");
                            }
                        });
                    }
                }

                // Khi chọn màu → disable size không hợp lệ
                $("input[name='colorId']").on("change", function () {
                    const colorId = $(this).val();

                    $.ajax({
                        url: "/api/product-detail/available-sizes",  // Ở ApiProductController
                        type: "GET",
                        data: { productID: productId, colorID: colorId },
                        success: function (sizes) {
                            // disable tất cả size
                            $("input[name='sizeId']").prop("disabled", true)
                                .siblings("label").addClass("disabled");

                            // enable size hợp lệ
                            sizes.forEach(s => {
                                $("#size-" + s.id).prop("disabled", false)
                                    .siblings("label").removeClass("disabled");
                            });
                        }
                    });

                    fetchDetailInfo();
                });

                // Khi chọn size → disable màu không hợp lệ
                $("input[name='sizeId']").on("change", function () {
                    const sizeId = $(this).val();

                    $.ajax({
                        url: "/api/product-detail/available-colors", // Ở ApiProductController
                        type: "GET",
                        data: { productID: productId, sizeID: sizeId },
                        success: function (colors) {
                            // disable tất cả màu
                            $("input[name='colorId']").prop("disabled", true)
                                .siblings("label").addClass("disabled");

                            // enable màu hợp lệ
                            colors.forEach(c => {
                                $("#color-" + c.id).prop("disabled", false)
                                    .siblings("label").removeClass("disabled");
                            });
                        }
                    });

                    fetchDetailInfo();
                });
            });

            $("input[name='colorId'], input[name='sizeId']").on("click", function () {
                const $this = $(this);

                // Nếu trước đó đã checked
                if ($this.data("waschecked") === true) {
                    $this.prop("checked", false);    // bỏ checked
                    $this.data("waschecked", false); // reset flag
                } else {
                    // clear trạng thái các radio cùng nhóm
                    $("input[name='" + $this.attr("name") + "']").data("waschecked", false);
                    $this.data("waschecked", true); // đánh dấu radio này đã checked
                }
            });
        </script>
<!--        Thêm vào giỏ-->
        <script>
            $("#quantity").on("input", function() {
                $("#quantityHidden").val($(this).val());
            });

            $("#addToCartForm").on("submit", function(e) {
                e.preventDefault();
                const productDetailId = $("#productDetailId").val();
                const quantity = $("#quantityHidden").val();
                const colorId = $("input[name='colorId']:checked").val();
                const sizeId = $("input[name='sizeId']:checked").val();

                if (!colorId || !sizeId) {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'warning',
                        title: "Bạn cần chọn màu sắc và kích cỡ",
                        showConfirmButton: false,
                        timer: 2000
                    });
                    return;
                }

                if (!quantity || quantity <= 0) {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'warning',
                        title: "Cần nhập số lượng",
                        showConfirmButton: false,
                        timer: 2000
                    });
                    return;
                }

                $.ajax({
                    url: "/api/product-detail/add-to-cart",
                    type: "POST",
                    data: { productDetailId, quantity },
                    success: function (msg) {
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: 'success',
                            title: msg,
                            showConfirmButton: false,
                            timer: 2000
                        });
                    },
                    error: function (xhr) {
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: 'error',
                            title: xhr.responseText || "Có lỗi xảy ra!",
                            showConfirmButton: false,
                            timer: 2000
                        });
                    }
                });
            });

            $("#buyNowBtn").on("click", function () {
                const productDetailId = $("#productDetailId").val();
                const quantity = $("#quantityHidden").val();
                const colorId = $("input[name='colorId']:checked").val();
                const sizeId = $("input[name='sizeId']:checked").val();

                if (!colorId || !sizeId) {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'warning',
                        title: "Bạn cần chọn màu sắc và kích cỡ",
                        showConfirmButton: false,
                        timer: 2000
                    });
                    return;
                }

                if (!quantity || quantity <= 0) {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'warning',
                        title: "Cần nhập số lượng",
                        showConfirmButton: false,
                        timer: 2000
                    });
                    return;
                }

                $.ajax({
                    url: "/api/product-detail/add-to-cart",
                    type: "POST",
                    data: {productDetailId, quantity},
                    success: function () {
                        window.location.href = "/cart";
                    },
                    error: function (xhr) {
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: 'error',
                            title: xhr.responseText || "Có lỗi xảy ra!",
                            showConfirmButton: false,
                            timer: 2000
                        });
                    }
                });
            });
        </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"></script>
    </main>
</div>
</body>
</html>
