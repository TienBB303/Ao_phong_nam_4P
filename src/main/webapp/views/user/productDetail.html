<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{user/layout-user.html}">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>
<div layout:fragment="content">
    <main class="mt-5 pt-4">
        <div class="container mt-5">
            <div class="row g-4">
                <!-- Ảnh sản phẩm -->
                <div class="col-md-6" th:if="${!listProductDetail.isEmpty()}">
                    <div class="position-relative bg-light rounded shadow-sm p-3">
                        <div id="productImageCarousel" class="carousel slide" data-mdb-ride="carousel"
                             style="max-width: 100%; height: 450px; overflow: hidden;">
                            <div class="carousel-inner h-100">
                                <div th:each="image, iterStat : ${uniqueImages}"
                                     th:class="'carousel-item h-100' + (${iterStat.index == 0} ? ' active' : '')">
                                    <img th:src="@{'/image-detail/' + ${image.path_file}}"
                                         class="d-block mx-auto"
                                         alt="Ảnh sản phẩm"
                                         style="max-height: 450px; object-fit: contain;">
                                </div>
                                <div th:if="${uniqueImages.isEmpty()}">
                                    <p class="text-center">Không có ảnh</p>
                                </div>
                            </div>

                            <!-- Nút điều hướng -->
                            <button class="carousel-control-prev" type="button" data-mdb-target="#productImageCarousel"
                                    data-mdb-slide="prev">
                                <span class="carousel-control-prev-icon"></span>
                            </button>
                            <button class="carousel-control-next" type="button" data-mdb-target="#productImageCarousel"
                                    data-mdb-slide="next">
                                <span class="carousel-control-next-icon"></span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Thông tin sản phẩm -->
                <div class="col-md-6">
                    <div class="p-3" id="productInfo" th:data-product-id="${product.id}">
                        <div class="d-flex align-items-center mb-3">
                            <span class="badge bg-dark me-2" th:text="${product.brand.name}"></span>
                            <span class="badge bg-danger" th:text="${product.material.name}"></span>
                        </div>

                        <h2 class="fw-bold mb-3" th:text="${product.name}">Tên sản phẩm</h2>

                        <div class="mb-3">
                            <label for="colorSelect" class="form-label">Chọn màu:</label>
                            <select id="colorSelect" name="colorId" class="form-select form-select-sm w-50">
                                <option disabled selected>-- Chọn màu --</option>
                                <option th:each="color : ${colors}" th:value="${color.id}" th:text="${color.name}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="sizeSelect" class="form-label">Chọn size:</label>
                            <select id="sizeSelect" name="sizeId" class="form-select form-select-sm w-50">
                                <option disabled selected>-- Chọn size --</option>
                                <option th:each="size : ${sizes}" th:value="${size.id}" th:text="${size.name}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="quantity" class="form-label">Số lượng:</label>
                            <input type="number" id="quantity" name="quantity" value="1" min="1"
                                   class="form-control w-25">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Giá: </label>
                            <span id="priceDisplay" class="fw-bold text-danger">--</span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tồn kho: </label>
                            <span id="quantityDisplay" class="fw-bold text-success">--</span>
                        </div>

                        <form th:action="@{/cart/add}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}"/>
                            <input type="hidden" id="colorIdInput" name="colorId"/>
                            <input type="hidden" id="sizeIdInput" name="sizeId"/>
                            <input type="hidden" id="productDetailId" name="productDetailId"/>
                            <input type="hidden" id="cartId" name="cartId" th:value="${session.cartId}"/>
                            <input type="hidden" id="quantityHidden" name="quantity"/>
                            <input type="hidden" id="actionInput" name="action"/>

                            <button type="submit" class="btn btn-primary me-2" name="actionBtn" value="addToCart" disabled>
                                Thêm vào giỏ
                            </button>
                            <button type="submit" class="btn btn-danger" name="actionBtn" value="buyNow" disabled>
                                Mua ngay
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <hr class="my-5"/>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script>
            const colorSelect = document.getElementById("colorSelect");
            const sizeSelect = document.getElementById("sizeSelect");
            const priceDisplay = document.getElementById("priceDisplay");
            const quantityDisplay = document.getElementById("quantityDisplay");
            const productId = document.getElementById("productInfo").getAttribute("data-product-id");

            const form = document.querySelector("form");
            const quantityInput = document.getElementById("quantity");
            const actionInput = document.getElementById("actionInput");
            const buttons = document.querySelectorAll("button[name='actionBtn']");

            let clickedButton = null;

            function toggleButtons(enable) {
                buttons.forEach(btn => btn.disabled = !enable);
            }

            function fetchPriceAndQuantity() {
                const colorId = colorSelect.value;
                const sizeId = sizeSelect.value;

                if (colorId && sizeId) {
                    fetch(`/api/product-detail/price?productId=${productId}&colorId=${colorId}&sizeId=${sizeId}`)
                        .then(response => {
                            if (!response.ok) throw new Error("Không tìm thấy biến thể");
                            return response.json();
                        })
                        .then(data => {
                            const priceFormatted = new Intl.NumberFormat('vi-VN', {
                                style: 'currency',
                                currency: 'VND'
                            }).format(data.price);
                            priceDisplay.textContent = priceFormatted;
                            quantityDisplay.textContent = data.quantity;
                            toggleButtons(true);
                        })
                        .catch(error => {
                            priceDisplay.textContent = "--";
                            quantityDisplay.textContent = "--";
                            toggleButtons(false);
                            console.error("Lỗi khi lấy biến thể:", error);
                        });
                } else {
                    priceDisplay.textContent = "--";
                    quantityDisplay.textContent = "--";
                    toggleButtons(false);
                }
            }

            colorSelect.addEventListener("change", fetchPriceAndQuantity);
            sizeSelect.addEventListener("change", fetchPriceAndQuantity);

            buttons.forEach(btn => {
                btn.addEventListener("click", () => {
                    clickedButton = btn;
                });
            });

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                const colorId = colorSelect.value;
                const sizeId = sizeSelect.value;
                const quantity = quantityInput.value;
                const stock = parseInt(quantityDisplay.textContent);

                if (!colorId || !sizeId) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Thiếu lựa chọn',
                        text: 'Vui lòng chọn đầy đủ màu và size!'
                    });
                    return;
                }

                if (isNaN(stock) || parseInt(quantity) > stock) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Không đủ hàng',
                        text: 'Số lượng vượt quá tồn kho!'
                    });
                    return;
                }

                document.getElementById("colorIdInput").value = colorId;
                document.getElementById("sizeIdInput").value = sizeId;
                document.getElementById("quantityHidden").value = quantity;
                actionInput.value = clickedButton ? clickedButton.value : "addToCart";

                fetch(`/api/product-detail/id?productId=${productId}&colorId=${colorId}&sizeId=${sizeId}`)
                    .then(res => {
                        if (!res.ok) throw new Error("Không tìm thấy biến thể phù hợp");
                        return res.json();
                    })
                    .then(data => {
                        if (!data.id) {
                            Swal.fire({
                                icon: 'error',
                                title: 'Không tìm thấy biến thể',
                                text: 'Vui lòng chọn màu/size khác!'
                            });
                            return;
                        }

                        document.getElementById("productDetailId").value = data.id;

                        if (actionInput.value === "buyNow") {
                            Swal.fire({
                                icon: 'success',
                                title: 'Đang chuyển đến trang thanh toán...',
                                showConfirmButton: false,
                                timer: 1000
                            }).then(() => form.submit());
                        } else {
                            Swal.fire({
                                icon: 'success',
                                title: 'Đã thêm sản phẩm vào giỏ hàng!',
                                showConfirmButton: false,
                                timer: 1500
                            }).then(() => form.submit());
                        }
                    })
                    .catch(err => {
                        Swal.fire({
                            icon: 'error',
                            title: 'Lỗi hệ thống',
                            text: 'Có lỗi khi lấy thông tin sản phẩm.'
                        });
                        console.error(err);
                    });
            });
        </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"></script>
    </main>
</div>
</body>
</html>
