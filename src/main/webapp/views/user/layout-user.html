<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - Trang người dùng">Trang người dùng</title>

    <!--CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/mdb.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style-preset.css}">
    <link rel="stylesheet" th:href="@{/assets/css/uikit.css}">
    <link rel="stylesheet" th:href="@{/assets/css/plugins/landing.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<!-- Navbar -->
<nav class="navbar fixed-top navbar-expand-lg navbar-light bg-white">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent1"
                aria-controls="navbarSupportedContent1" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent1">
            <a class="navbar-brand mt-2 mt-sm-0" href="/">
                <img src="" height="20" alt="" loading="lazy"/>
            </a>
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/product}">Product</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contact}">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/blog}">Blog</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tracking}">Tra cứu đơn hàng</a>
                </li>
            </ul>
        </div>
        <div class="d-flex align-items-center gap-3">
            <!-- Hiển thị thông tin người dùng nếu đã đăng nhập -->
            <div th:if="${session.userAccount}" class="d-flex align-items-center gap-2">
                <span class="text-muted">Xin chào, </span>
                <span class="fw-bold"
                      th:text="${session.userCustomer != null ? session.userCustomer.name : session.userAccount.email}">
                                Tên người dùng
                </span>

                <div class="dropdown">
                    <button class="btn btn-link text-dark text-decoration-none dropdown-toggle" type="button"
                            id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false"><i
                            class="fas fa-user-circle fa-lg"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" th:href="@{/user/profile}"><i class="fas fa-user me-2"></i>Tài
                            khoản</a></li>
                        <li><a class="dropdown-item" th:href="@{/user/change-password-request}">
                            <i class="fas fa-key me-2"></i>Đổi mật khẩu
                        </a></li>
                        <li><a class="dropdown-item" th:href="@{/user/orders}"><i class="fas fa-shopping-bag me-2"></i>Đơn
                            hàng</a></li>
                        <li th:if="${session.userRole == 'ROLE_ADMIN' || session.userRole == 'ROLE_EMPLOYEE'}">
                            <a class="dropdown-item" th:href="@{/admin/dashboard}">
                                <i class="fas fa-tools me-2"></i>Trang quản lý
                            </a>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" th:href="@{/user/logout}"><i class="fas fa-sign-out-alt me-2"></i>Đăng
                            xuất</a></li>
                    </ul>
                </div>
            </div>

            <!-- Hiển thị nút đăng nhập/đăng ký nếu chưa đăng nhập -->
            <div th:unless="${session.userAccount}" class="d-flex align-items-center gap-2">
                <a th:href="@{/user/login}" class="text-dark text-decoration-none">Đăng nhập</a>
                <span class="text-muted">/</span>
                <a th:href="@{/user/signup}" class="text-dark text-decoration-none">Đăng ký</a>
            </div>

            <a class="nav-link position-relative" href="/cart">
                <i class="fas fa-shopping-cart fa-lg"></i>
                <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill"></span>
            </a>

        </div>

    </div>
</nav>
<!-- End Navbar -->

<!-- NỘI DUNG TRANG -->
<main layout:fragment="content" style="padding-top: 80px;"></main>

<!-- FOOTER -->
<footer class="text-center text-white mt-4" style="background-color: #607D8B">
    <hr class="text-dark">
    <div class="container">
        <section class="mb-3">
            <a class="btn-link btn-floating btn-lg text-white" href="#"><i class="fab fa-facebook-f"></i></a>
            <a class="btn-link btn-floating btn-lg text-white" href="#"><i class="fab fa-twitter"></i></a>
            <a class="btn-link btn-floating btn-lg text-white" href="#"><i class="fab fa-google"></i></a>
            <a class="btn-link btn-floating btn-lg text-white" href="#"><i class="fab fa-instagram"></i></a>
            <a class="btn-link btn-floating btn-lg text-white" href="#"><i class="fab fa-youtube"></i></a>
            <a class="btn-link btn-floating btn-lg text-white" href="#"><i class="fab fa-github"></i></a>
        </section>
    </div>
    <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.2); text-color: #E0E0E0">
        © 2025 Copyright:
        <a class="text-white" href="">4PStore</a>
    </div>
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/assets/js/mdb.min.js}"></script>
<script th:src="@{/assets/js/mdb.es.min.js}"></script>
<script th:src="@{/assets/js/mdb.umd.min.js}"></script>
<script th:src="@{/assets/js/plugins/component.js}"></script>
<script th:src="@{/assets/js/plugins/pcoded.js}"></script>
<script th:src="@{/assets/js/plugins/layout-tab.js}"></script>
<script th:src="@{/assets/js/plugins/layout-horizontal.js}"></script>
<script th:src="@{/assets/js/plugins/layout-compact.js}"></script>
</body>
</html>
