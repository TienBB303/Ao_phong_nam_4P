<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Trang thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-control, .form-select {
            border-radius: 0;
        }

        .payment-method {
            border: 1px solid #ccc;
            padding: 15px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .payment-method.active {
            border: 2px solid #000;
            background-color: #f9f9f9;
        }

        .order-summary {
            border-left: 1px solid #dee2e6;
        }

        .btn-dark {
            border-radius: 0;
        }
    </style>
    <script src="js/address.js"></script>
    <script>
        window.onload = function () {
            loadAddress();
        }

        function checkForm() {
            var phone = document.getElementById("phoneck").value;
            var regex = /^0\d{9}$/;
            if (regex.test(phone) == false) {
                alert("Số điện thoại phải là 10 số")
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
<div class="container py-5">
    <h4 class="mb-4">Thông tin giao hàng</h4>
    <div class="row">
        <!-- Form thông tin giao hàng -->
        <div class="col-md-7">
            <form th:action="@{/bill/createNotLogin}" method="post" th:object="${billInsert}"
                  onsubmit="return checkForm()">
                <!-- 👤 Thông tin khách hàng -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label>Họ và tên</label>
                        <th:block th:if="${isGuest}">
                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Họ và tên"
                                   required>
                        </th:block>
                        <th:block th:unless="${isGuest}">
                            <input type="hidden" th:field="*{fullName}"/>
                            <div class="form-control bg-light" th:text="*{fullName}"></div>
                        </th:block>
                    </div>
                    <div class="col-md-6">
                        <label>Số điện thoại</label>
                        <th:block th:if="${isGuest}">
                            <input type="text" th:field="*{phone}" id="phoneck" class="form-control"
                                   placeholder="Số điện thoại" required>
                        </th:block>
                        <th:block th:unless="${isGuest}">
                            <input type="hidden" th:field="*{phone}"/>
                            <div class="form-control bg-light" th:text="*{phone}"></div>
                        </th:block>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <th:block th:if="${isGuest}">
                        <input type="email" th:field="*{email}" class="form-control" placeholder="Email" required>
                    </th:block>
                    <th:block th:unless="${isGuest}">
                        <input type="hidden" th:field="*{email}"/>
                        <div class="form-control bg-light" th:text="*{email}"></div>
                    </th:block>
                </div>

                <div class="row">
                    <div class="col-sm-4">
                        <label>Tỉnh/Thành</label>
                        <th:block th:if="${isGuest}">
                            <select th:field="*{province}" class="form-select" id="tinh"
                                    onchange="loadHuyen(this.options[this.selectedIndex].getAttribute('name-add'));"></select>
                        </th:block>
                        <th:block th:unless="${isGuest}">
                            <input type="hidden" th:field="*{province}" id="provinceValue" th:value="*{province}"/>
                            <div class="form-control bg-light" th:text="*{province}"></div>
                        </th:block>
                    </div>
                    <div class="col-sm-4">
                        <label>Quận/Huyện</label>
                        <th:block th:if="${isGuest}">
                            <select th:field="*{district}" class="form-select" id="huyen"
                                    onchange="loadXa(this.options[this.selectedIndex].getAttribute('name-add'));"></select>
                        </th:block>
                        <th:block th:unless="${isGuest}">
                            <input type="hidden" th:field="*{district}"/>
                            <div class="form-control bg-light" th:text="*{district}"></div>
                        </th:block>
                    </div>
                    <div class="col-sm-4 mb-4">
                        <label>Phường/Xã</label>
                        <th:block th:if="${isGuest}">
                            <select th:field="*{ward}" class="form-select" id="xa"></select>
                        </th:block>
                        <th:block th:unless="${isGuest}">
                            <input type="hidden" th:field="*{ward}"/>
                            <div class="form-control bg-light" th:text="*{ward}"></div>
                        </th:block>
                    </div>
                    <div class="col-sm-12 mb-3">
                        <label>Địa chỉ chi tiết</label>
                        <th:block th:if="${isGuest}">
                            <input th:field="*{street}" class="form-control" placeholder="Tên đường, số nhà">
                        </th:block>
                        <th:block th:unless="${isGuest}">
                            <input type="hidden" th:field="*{street}"/>
                            <div class="form-control bg-light"
                                 th:text="*{street}"></div>
                        </th:block>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Ghi chú</label>
                    <textarea th:field="*{note}" class="form-control" rows="3" placeholder="Ghi chú thêm..."></textarea>
                </div>

                <h5 class="mb-3">Phương thức thanh toán</h5>
                <div class="form-check payment-method active">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="cod" value="COD" checked/>
                    <label class="form-check-label" for="cod">Thanh toán khi nhận hàng (COD)</label>
                </div>
                <div class="form-check payment-method">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="bank" value="BANK"/>
                    <label class="form-check-label" for="bank">Thanh toán chuyển khoản</label>
                </div>

                <!-- 🔐 Hidden inputs cho giảm giá -->
                <input type="hidden" name="discountCode" id="discountCodeInput"/>
                <input type="hidden" name="discountValue" id="discountValueInput"/>
                <input type="hidden" name="discountId" id="discountIdInput"/>

                <button type="submit" class="btn btn-dark w-100 mt-4">Đặt hàng ngay</button>
            </form>
        </div>
        <div class="col-md-5 order-summary ps-md-5 mt-5 mt-md-0">
            <div th:each="item : ${cart.cartDetails}" class="d-flex mb-3">
                <div>
                    <p class="mb-1"
                       th:text="${item.productDetail.product.name} + ' - ' + ${item.productDetail.color.name} + ' - ' + ${item.productDetail.size.name}"></p>
                    <span class="fw-bold text-danger"
                          th:text="${#numbers.formatInteger(item.productDetail.price, 0, 'POINT')} + 'đ'"></span>
                    <a th:href="@{/cart/delete-cart(productDetailId=${item.productDetail.id})}"
                       onclick="return confirm('Bạn chắc chắn muốn xóa sản phẩm này không?')"><i
                            class="fa fa-trash"></i></a>
                    <div class="mt-2">
                        <a th:href="@{/cart/up-down(productDetailId=${item.productDetail.id},quantity=${-1})}"
                           class="btn btn-sm btn-outline-secondary">-</a>
                        <span class="mx-2" th:text="${item.quantity}">1</span>
                        <a th:href="@{/cart/up-down(productDetailId=${item.productDetail.id},quantity=${1})}"
                           class="btn btn-sm btn-outline-secondary">+</a>
                    </div>
                </div>
            </div>
            <div th:if="${isGuest}">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="discount-code" placeholder="Nhập mã giảm giá"/>
                    <button class="btn btn-dark" onclick="applyDiscount()">Áp dụng</button>
                </div>
            </div>

            <div th:if="${!isGuest}">
                <div class="mb-3">
                    <label for="discountSelect" class="form-label">Chọn mã giảm giá</label>
                    <select id="discountSelect" class="form-select" onchange="applySelectedDiscount()">
                        <option value="">-- Không áp dụng mã --</option>
                        <option th:each="discount : ${availableDiscounts}"
                                th:value="${discount.id}"
                                th:text="${discount.code + ' - Giảm ' + #numbers.formatInteger(discount.discountValue, 0, 'POINT') + 'đ'}"
                                th:attr="data-code=${discount.code}, data-amount=${discount.discountValue}">
                        </option>
                    </select>
                </div>
                <div id="discount-message" class="mt-2 text-success" style="display: none;"></div>
            </div>

            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item d-flex justify-content-between">
                    Tổng tiền hàng: <span id="tongtienhang"
                                          th:text="${#numbers.formatInteger(totalCart, 0, 'POINT')} + 'đ'">0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Giảm giá: <span id="giamgia">- 0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Tạm tính: <span id="tamtinh">0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Phí ship:
                    <span id="phiship"
                          th:text="${provinceName != null and provinceName.toLowerCase().contains('Hà Nội') ? '30.000đ' : '40.000đ'}">
                        0đ
                    </span>
                </li>
                <li class="list-group-item d-flex justify-content-between fw-bold fs-5 text-danger">
                    Cần thanh toán:
                    <span id="phaithanhtoan"
                          th:text="${#numbers.formatInteger(cart.total_price_checkout + (provinceName != null and provinceName.toLowerCase().contains('hà nội') ? 30000 : 40000), 0, 'POINT')} + 'đ'">
                        0đ
                    </span>
                </li>
            </ul>
        </div>
    </div>
</div>
<script>
    function parseCurrency(str) {
        return parseInt(str.replace(/[^\d]/g, '')) || 0;
    }

    function formatCurrency(num) {
        return num.toLocaleString('vi-VN') + 'đ';
    }

    function updateTotalAmount() {
        const tongTienHang = parseCurrency(document.getElementById('tongtienhang').innerText);
        const giamGia = parseCurrency(document.getElementById('giamgia').innerText);
        const phiShip = parseCurrency(document.getElementById('phiship').innerText);

        const tamTinh = tongTienHang - giamGia;
        const phaiThanhToan = tamTinh + phiShip;

        document.getElementById('tamtinh').innerText = formatCurrency(tamTinh);
        document.getElementById('phaithanhtoan').innerText = formatCurrency(phaiThanhToan);
    }


    function applyDiscount() {
        const code = document.getElementById("discount-code").value.trim();
        const messageDiv = document.getElementById("discount-message");

        if (!code) {
            messageDiv.innerText = "Vui lòng nhập mã giảm giá.";
            messageDiv.classList.remove("text-success");
            messageDiv.classList.add("text-danger");
            return;
        }

        fetch(`/api/discount/apply?code=${encodeURIComponent(code)}`)
            .then(res => res.json().then(data => ({ok: res.ok, data})))
            .then(response => {
                if (response.ok) {
                    const {discountId, discountAmount, message} = response.data;
                    document.getElementById("discountCodeInput").value = code;
                    document.getElementById("discountValueInput").value = discountAmount;
                    document.getElementById("discountIdInput").value = discountId;

                    messageDiv.innerText = message;
                    messageDiv.classList.remove("text-danger");
                    messageDiv.classList.add("text-success");
                } else {
                    messageDiv.innerText = response.data.message || "Mã không hợp lệ.";
                    messageDiv.classList.remove("text-success");
                    messageDiv.classList.add("text-danger");

                    // Xóa input ẩn nếu mã sai
                    document.getElementById("discountCodeInput").value = '';
                    document.getElementById("discountValueInput").value = '';
                    document.getElementById("discountIdInput").value = '';
                }
            })
            .catch(err => {
                console.error("Lỗi gọi API:", err);
                messageDiv.innerText = "Đã xảy ra lỗi.";
                messageDiv.classList.remove("text-success");
                messageDiv.classList.add("text-danger");
            });
    }

    function applySelectedDiscount() {
        const select = document.getElementById("discountSelect");
        const selectedOption = select.options[select.selectedIndex];

        if (!selectedOption.value) {
            // Nếu chọn "-- Không áp dụng mã --"
            document.getElementById("discountCodeInput").value = '';
            document.getElementById("discountValueInput").value = '';
            document.getElementById("discountIdInput").value = '';
            document.getElementById("giamgia").innerText = "- 0đ";
            updateTotalAmount();
            return;
        }

        const code = selectedOption.getAttribute("data-code");
        const amount = parseInt(selectedOption.getAttribute("data-amount")) || 0;

        document.getElementById("discountCodeInput").value = code;
        document.getElementById("discountValueInput").value = amount;
        document.getElementById("discountIdInput").value = selectedOption.value;

        document.getElementById("giamgia").innerText = "- " + formatCurrency(amount);
        updateTotalAmount();

        const msg = document.getElementById("discount-message");
        if (msg) {
            msg.innerText = `Áp dụng mã ${code} thành công.`;
            msg.classList.remove("text-danger");
            msg.classList.add("text-success");

            msg.style.display = "block";
            setTimeout(() => {
                msg.style.display = "none";
            }, 3000);
        }
    }
    window.addEventListener('DOMContentLoaded', updateTotalAmount);
</script>
</body>
</html>
