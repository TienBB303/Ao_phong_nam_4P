<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Trang thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .form-control, .form-select {
            border-radius: 0;
        }
        .payment-method {
            border: 1px solid #ccc;
            padding: 15px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .payment-method.active {
            border: 2px solid #000;
            background-color: #f9f9f9;
        }
        .order-summary {
            border-left: 1px solid #dee2e6;
        }
        .btn-dark {
            border-radius: 0;
        }
    </style>
    <script src="js/address.js"></script>
    <script>
        window.onload = function() {
            loadAddress();
        }
        function checkForm(){
            var phone = document.getElementById("phoneck").value;
            var regex = /^0\d{9}$/ ;
            if(regex.test(phone) == false){
                alert("Số điện thoại phải là 10 số")
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
<div class="container py-5">
    <h4 class="mb-4">Thông tin giao hàng</h4>
    <div class="row">
        <!-- Form thông tin giao hàng -->
        <div class="col-md-7">
            <form onsubmit="return checkForm()" th:action="@{/bill/createNotLogin}" method="post" th:object="${billInsert}">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" th:field="*{fullName}" class="form-control" placeholder="Họ và tên" name="fullName" required/>
                    </div>
                    <div class="col-md-6">
                        <input type="text" id="phoneck" th:field="*{phone}" class="form-control" placeholder="Số điện thoại" name="phone" required/>
                    </div>
                </div>
                <div class="mb-3">
                    <input type="email" th:field="*{email}" class="form-control" placeholder="Địa chỉ Email" name="email" required/>
                </div>
                <div class="row">
                    <div class="col-sm-4">
                        <label class="">Chọn tỉnh</label>
                        <select th:field="*{province}" name="tinh" onchange="loadHuyen(this.options[this.selectedIndex].getAttribute('name-add'));" class="form-control" id="tinh"></select>
                    </div>
                    <div class="col-sm-4">
                        <label class="">Chọn huyện</label>
                        <select th:field="*{district}" name="huyen"  onchange="loadXa(this.options[this.selectedIndex].getAttribute('name-add'));" class="form-control" id="huyen"></select>
                    </div>
                    <div class="col-sm-4 mb-4">
                        <label class="">Chọn xã</label>
                        <select th:field="*{ward}" name="xa" class="form-control" id="xa"></select>
                    </div>
                    <div class="col-sm-12">
                        <div class="mb-4">
                            <input required th:field="*{street}" name="tenduong" class="form-control" id="addchitiet" placeholder="tên đường, số nhà của bạn">
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <textarea th:field="*{note}" class="form-control" name="note" placeholder="Ghi chú thêm (Ví dụ: Giao hàng giờ hành chính)" rows="3"></textarea>
                </div>

                <h5 class="mb-3">Phương thức thanh toán</h5>
                <div class="form-check payment-method active">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="cod" value="COD" checked/>
                    <label class="form-check-label" for="cod">Thanh toán khi nhận hàng (COD)</label>
                </div>
                <div class="form-check payment-method">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="bank" value="BANK"/>
                    <label class="form-check-label" for="bank">Thanh toán chuyển khoản</label>
                </div>

                <button type="submit" class="btn btn-dark w-100 mt-4">ĐẶT HÀNG NGAY</button>
            </form>
        </div>

        <!-- Tóm tắt đơn hàng -->
        <div class="col-md-5 order-summary ps-md-5 mt-5 mt-md-0">
            <div th:each="item : ${cart.cartDetails}" class="d-flex mb-3">
                <div>
                    <p class="mb-1" th:text="${item.productDetail.product.name} + ' - ' + ${item.productDetail.color.name} + ' - ' + ${item.productDetail.size.name}"></p>
                    <span class="fw-bold text-danger" th:text="${#numbers.formatInteger(item.productDetail.price, 0, 'POINT')} + 'đ'"></span>
                    <a th:href="@{/cart/delete-cart(productDetailId=${item.productDetail.id})}" onclick="return window.confirm('Xác nhận xóa')"><i class="fa fa-trash"></i></a>
                    <div class="mt-2">
                        <a th:href="@{/cart/up-down(productDetailId=${item.productDetail.id},quantity=${-1})}" class="btn btn-sm btn-outline-secondary">-</a>
                        <span class="mx-2" th:text="${item.quantity}">1</span>
                        <a th:href="@{/cart/up-down(productDetailId=${item.productDetail.id},quantity=${1})}" class="btn btn-sm btn-outline-secondary">+</a>
                    </div>
                </div>
            </div>

            <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="Nhập mã giảm giá"/>
                <button class="btn btn-dark">ÁP DỤNG</button>
            </div>

            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item d-flex justify-content-between">
                    Tổng tiền hàng: <span id="tongtienhang" th:text="${#numbers.formatInteger(totalCart, 0, 'POINT')} + 'đ'">0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Giảm giá: <span>- 0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Tạm tính: <span th:text="${#numbers.formatInteger(totalCart, 0, 'POINT')} + 'đ'">0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Chiết khấu: <span>- 0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Phí ship: <span id="phiship">0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between fw-bold fs-5 text-danger">
                    Cần thanh toán: <span id="phaithanhtoan" th:text="${#numbers.formatInteger(cart.total_price_checkout, 0, 'POINT')} + 'đ'">0đ</span>
                </li>
            </ul>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const provinceSelect = document.getElementById("select-province");
        const districtSelect = document.getElementById("select-district");
        const wardSelect = document.getElementById("select-ward");

        fetch("https://esgoo.net/api-tinhthanh/1/0.htm")
            .then(res => res.json())
            .then(data => {
                provinceSelect.innerHTML = '<option selected disabled hidden>Chọn Tỉnh/Thành phố</option>';
                data.data.forEach(p => {
                    provinceSelect.innerHTML += `<option value="${p.full_name}">${p.full_name}</option>`;
                });
            });

        provinceSelect.addEventListener("change", function () {
            const provinceId = this.value;
            districtSelect.innerHTML = '<option selected>Đang tải Quận/Huyện...</option>';
            wardSelect.innerHTML = '<option selected>Chọn Phường/Xã</option>';

            fetch(`https://esgoo.net/api-tinhthanh/2/${provinceId}.htm`)
                .then(res => res.json())
                .then(data => {
                    districtSelect.innerHTML = '<option selected disabled hidden>Chọn Quận/Huyện</option>';
                    data.data.forEach(d => {
                        districtSelect.innerHTML += `<option value="${d.full_name}">${d.full_name}</option>`;
                    });
                });
        });

        districtSelect.addEventListener("change", function () {
            const districtId = this.value;
            wardSelect.innerHTML = '<option selected>Đang tải Phường/Xã...</option>';

            fetch(`https://esgoo.net/api-tinhthanh/3/${districtId}.htm`)
                .then(res => res.json())
                .then(data => {
                    wardSelect.innerHTML = '<option selected disabled hidden>Chọn Phường/Xã</option>';
                    data.data.forEach(w => {
                        wardSelect.innerHTML += `<option value="${w.full_name}">${w.full_name}</option>`;
                    });
                });
        });

        document.querySelectorAll(".payment-method").forEach((item) => {
            item.addEventListener("click", () => {
                document.querySelectorAll(".payment-method").forEach((i) => i.classList.remove("active"));
                item.classList.add("active");
                item.querySelector("input").checked = true;
            });
        });
    });
</script>
</body>
</html>
