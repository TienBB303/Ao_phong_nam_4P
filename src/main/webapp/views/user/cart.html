<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Trang thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .form-control, .form-select {
            border-radius: 0;
        }

        .payment-method {
            border: 1px solid #ccc;
            padding: 15px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .payment-method.active {
            border: 2px solid #000;
            background-color: #f9f9f9;
        }

        .order-summary {
            border-left: 1px solid #dee2e6;
        }

        .btn-dark {
            border-radius: 0;
        }
    </style>
    <script th:src="@{/js/address.js}"></script>
    <script>
        window.onload = function () {
            loadAddress();
        }

        function checkForm() {
            let fullName = document.querySelector("[name='fullName']").value.trim();
            let phone = document.querySelector("[name='phone']").value.trim();
            let email = document.querySelector("[name='email']").value.trim();
            let province = document.querySelector("[name='province']").value.trim();
            let district = document.querySelector("[name='district']").value.trim();
            let ward = document.querySelector("[name='ward']").value.trim();
            let street = document.querySelector("[name='street']").value.trim();
            let paymentMethod = document.querySelector("input[name='paymentMethodId']:checked");

            if (fullName === "") {
                Swal.fire({
                    icon: "error",
                    title: "Cảnh báo",
                    text: "Vui lòng nhập họ và tên"
                });
                return false;
            }

            let phoneRegex = /^(0[0-9]{9})$/;
            if (phone === "" || !phoneRegex.test(phone)) {
                Swal.fire({
                    icon: "error",
                    title: "Số điện thoại không hợp lệ",
                    text: "Vui lòng nhập số điện thoại 10 số, bắt đầu bằng 0"
                });
                return false;
            }

            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === "" || !emailRegex.test(email)) {
                Swal.fire({
                    icon: "error",
                    title: "Email không hợp lệ",
                    text: "Vui lòng nhập đúng định dạng email"
                });
                return false;
            }

            if (province === "" || district === "" || ward === "" || street === "") {
                Swal.fire({
                    icon: "error",
                    title: "Thiếu địa chỉ",
                    text: "Vui lòng nhập đầy đủ địa chỉ giao hàng"
                });
                return false;
            }

            if (!paymentMethod) {
                Swal.fire({
                    icon: "error",
                    title: "Chưa chọn phương thức",
                    text: "Vui lòng chọn phương thức thanh toán"
                });
                return false;
            }

            // Nếu tất cả hợp lệ thì cho submit
            return true;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="container py-5">
    <h4 class="mb-4">Thông tin giao hàng</h4>
    <div class="row">
        <!-- Form thông tin giao hàng -->
        <div class="col-md-7">
            <form th:action="@{/bill/create}" method="post" th:object="${billInsert}"
                  onsubmit="return checkForm()">
                <!-- 👤 Thông tin khách hàng -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label>Họ và tên</label>
                        <input type="text" th:field="*{fullName}" class="form-control"
                               placeholder="Họ và tên" th:readonly="${!isGuest}">
                    </div>
                    <div class="col-md-6">
                        <label>Số điện thoại</label>
                        <input type="text" th:field="*{phone}" class="form-control"
                               placeholder="Số điện thoại" th:readonly="${!isGuest}">
                    </div>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           placeholder="Email" th:readonly="${!isGuest}">
                </div>

                <!-- 📦 Địa chỉ giao hàng -->

                <div class="mb-3" th:if="${!isGuest}">
                    <label>Địa chỉ giao hàng:</label>
                    <select class="form-select" onchange="fillAddress(this)" id="addressSelect">
                        <option th:each="addr : ${addresses}"
                                th:value="${addr.addressDetail + '|' + addr.wardName + '|' + addr.districtName + '|' + addr.provinceName}"
                                th:text="${addr.addressDetail + ', ' + addr.wardName + ', ' + addr.districtName + ', ' + addr.provinceName}">
                        </option>
                    </select>
                    <input type="hidden" th:field="*{street}" id="hiddenStreet"/>
                    <input type="hidden" th:field="*{ward}" id="hiddenWard"/>
                    <input type="hidden" th:field="*{district}" id="hiddenDistrict"/>
                    <input type="hidden" th:field="*{province}" id="hiddenProvince"/>
                </div>
                <div class="row" th:if="${isGuest}">
                    <!-- Tỉnh -->
                    <div class="col-sm-4">
                        <label>Tỉnh/Thành</label>
                        <select th:field="*{province}" class="form-select" id="tinh"
                                onchange="loadHuyen(this.options[this.selectedIndex].getAttribute('name-add'))"
                                th:disabled="${!isGuest}">
                        </select>
                    </div>

                    <!-- Huyện -->
                    <div class="col-sm-4">
                        <label>Quận/Huyện</label>
                        <select th:field="*{district}" class="form-select" id="huyen"
                                onchange="loadXa(this.options[this.selectedIndex].getAttribute('name-add'))"
                                th:disabled="${!isGuest}">
                        </select>
                    </div>

                    <!-- Xã -->
                    <div class="col-sm-4 mb-4">
                        <label>Phường/Xã</label>
                        <select th:field="*{ward}" class="form-select" id="xa"
                                th:disabled="${!isGuest}">
                        </select>
                    </div>

                    <!-- Đường -->
                    <div class="col-sm-12 mb-3">
                        <label>Địa chỉ chi tiết</label>
                        <input th:field="*{street}" class="form-control" placeholder="Tên đường, số nhà"
                               th:readonly="${!isGuest}">
                    </div>
                </div>

                <div class="mb-3">
                    <label>Ghi chú</label>
                    <textarea th:field="*{note}" class="form-control" rows="3"
                              placeholder="Ghi chú thêm..."></textarea>
                </div>

                <h5 class="mb-3">Phương thức thanh toán</h5>

                <div class="form-check payment-method active">
                    <input class="form-check-input" type="radio"
                           name="paymentMethodId" id="cod" value="1" checked/>
                    <label class="form-check-label" for="cod">
                        Thanh toán khi nhận hàng (COD)
                    </label>
                </div>

                <div class="form-check payment-method">
                    <input class="form-check-input" type="radio"
                           name="paymentMethodId" id="Chuyển khoản" value="2"/>
                    <label class="form-check-label" for="Chuyển khoản">
                        Thanh toán qua MoMo
                    </label>
                </div>

                <input type="hidden" name="discountCode" id="discountCodeInput"/>
                <input type="hidden" name="discountValue" id="discountValueInput"/>
                <input type="hidden" name="discountId" id="discountIdInput"/>

                <button type="submit" class="btn btn-dark w-100 mt-4">Đặt hàng ngay</button>
            </form>
        </div>
        <div class="col-md-5 order-summary ps-md-5 mt-5 mt-md-0">
            <div th:each="item : ${cart.cartDetails}" class="d-flex mb-3">
                <div>
                    <p class="mb-1"
                       th:text="${item.productDetail.product.name + ' - ' + item.productDetail.color.name + ' - ' + item.productDetail.size.name}"></p>
                    <span class="fw-bold text-danger"
                          th:text="${#numbers.formatInteger(item.productDetail.price, 0, 'POINT') + 'đ'}"></span>
                    <a href="javascript:void(0);"
                       th:attr="data-href=@{/cart/delete-cart(productDetailId=${item.productDetail.id})}"
                       onclick="confirmDelete(this)">
                        <i class="fa fa-trash text-danger"></i>
                    </a>
                    <div class="mt-2">
                        <a th:href="@{/cart/up-down(productDetailId=${item.productDetail.id},quantity=${-1})}"
                           class="btn btn-sm btn-outline-secondary">-</a>
                        <span class="mx-2" th:text="${item.quantity}">1</span>
                        <a th:href="@{/cart/up-down(productDetailId=${item.productDetail.id},quantity=${1})}"
                           class="btn btn-sm btn-outline-secondary">+</a>
                    </div>
                </div>
            </div>
            <div th:if="${isGuest}">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="discount-code" placeholder="Nhập mã giảm giá"/>
                    <button class="btn btn-dark" onclick="applyDiscount()">Áp dụng</button>
                </div>
            </div>

            <div th:if="${!isGuest}">
                <div class="mb-3">
                    <label for="discountSelect" class="form-label">Chọn mã giảm giá</label>
                    <select id="discountSelect" class="form-select" onchange="applySelectedDiscount()">
                        <option value="">-- Không áp dụng mã --</option>
                        <option th:each="discount : ${availableDiscounts}"
                                th:value="${discount.id}"
                                th:text="${discount.code + ' - Giảm ' + #numbers.formatInteger(discount.discountValue, 0, 'POINT') + 'đ'}"
                                th:attr="data-code=${discount.code}, data-amount=${discount.discountValue}">
                        </option>
                    </select>
                </div>
                <div id="discount-message" class="mt-2 text-success" style="display: none;"></div>
            </div>

            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item d-flex justify-content-between">
                    Tổng tiền hàng: <span id="tongtienhang"
                                          th:text="${#numbers.formatInteger(totalCart, 0, 'POINT')} + 'đ'">0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Giảm giá: <span id="giamgia">- 0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Tạm tính: <span id="tamtinh">0đ</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Phí ship:
                    <span id="phiship"
                          th:text="${provinceName != null and provinceName.toLowerCase().contains('hà nội') ? '30.000đ' : '40.000đ'}">
                        0đ
                    </span>
                </li>
                <li class="list-group-item d-flex justify-content-between fw-bold fs-5 text-danger">
                    Cần thanh toán:
                    <span id="phaithanhtoan"
                          th:text="${#numbers.formatInteger(cart.total_price_checkout + (provinceName != null and provinceName.toLowerCase().contains('hà nội') ? 30000 : 40000), 0, 'POINT') + 'đ'}">
    0đ
                    </span>
                </li>
            </ul>
        </div>
    </div>
</div>
<script th:inline="javascript">
    /*<![CDATA[*/
    let errorMessage = [[${errorMessage}]];
    if (errorMessage !== null && errorMessage !== 'null') {
        Swal.fire({
            icon: 'warning',
            title: 'Thông báo',
            text: errorMessage,
            confirmButtonText: 'OK'
        });
    }

    function confirmDelete(el) {
        const href = el.getAttribute('data-href');
        Swal.fire({
            title: 'Thông báo?',
            text: "Bạn chắc chắn muốn xóa sản phẩm này khỏi giỏ hàng?",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Xóa',
            cancelButtonText: 'Hủy'
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = href;
            }
        });
    }

    let discountValue = 0;

    function parseCurrency(str) {
        const match = str.match(/-?\d+/g);
        if (!match) return 0;
        return parseInt(match.join(''));
    }

    function formatCurrency(num) {
        return num.toLocaleString('vi-VN') + 'đ';
    }

    function updateSummary() {
        const tongTien = parseCurrency(document.getElementById("tongtienhang").textContent);
        const phiShip = parseCurrency(document.getElementById("phiship").textContent);

        const tamTinh = tongTien - discountValue;
        const thanhToan = tamTinh + phiShip;

        document.getElementById("giamgia").textContent = '- ' + formatCurrency(discountValue);
        document.getElementById("tamtinh").textContent = formatCurrency(tamTinh);
        document.getElementById("phaithanhtoan").textContent = formatCurrency(thanhToan);
    }

    function applyDiscount() {
        const code = document.getElementById("discount-code").value.trim();
        if (!code) {
            Swal.fire("Vui lòng nhập mã giảm giá");
            return;
        }

        fetch(`/api/discount/apply?code=${code}`)
            .then(res => {
                if (!res.ok) throw res;
                return res.json();
            })
            .then(data => {
                discountValue = data.discountAmount || 0;
                document.getElementById("discountCodeInput").value = code;
                document.getElementById("discountValueInput").value = discountValue;

                Swal.fire({
                    icon: 'success',
                    title: 'Áp dụng mã thành công',
                    text: data.message
                });

                updateSummary();
            })
            .catch(async err => {
                const errMsg = await err.json();
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi',
                    text: errMsg.message || "Lỗi khi áp mã"
                });

                discountValue = 0;
                document.getElementById("discountCodeInput").value = "";
                document.getElementById("discountValueInput").value = "0";
                updateSummary();
            });
    }

    function applySelectedDiscount() {
        const select = document.getElementById("discountSelect");
        const selectedOption = select.options[select.selectedIndex];
        const discountMessage = document.getElementById("discount-message");

        discountValue = parseInt(selectedOption.getAttribute("data-amount")) || 0;
        const code = selectedOption.getAttribute("data-code") || "";
        const discountId = select.value || "";

        // Gán vào hidden input
        document.getElementById("discountIdInput").value = discountId;
        document.getElementById("discountCodeInput").value = code;
        document.getElementById("discountValueInput").value = discountValue;

        updateSummary();

        if (code) {
            discountMessage.style.display = "block";
            discountMessage.innerText = "Đã áp dụng mã " + code + " (-" + discountValue.toLocaleString('vi-VN') + "đ)";
        } else {
            discountMessage.style.display = "none";
        }
    }


    function fillAddress(selectElement) {
        const selectedAddress = selectElement.value.split('|');
        const provinceName = selectedAddress[3];

        document.getElementById('hiddenStreet').value = selectedAddress[0];
        document.getElementById('hiddenWard').value = selectedAddress[1];
        document.getElementById('hiddenDistrict').value = selectedAddress[2];
        document.getElementById('hiddenProvince').value = provinceName;

        updateShippingFee(provinceName);
    }

    // --- Tính phí ship ---
    function updateShippingFee(provinceName) {
        const phishipElement = document.getElementById('phiship');
        let phiShip = 40000;

        // Chuẩn hoá để so khớp chính xác
        const normalized = provinceName
            .normalize("NFD")                // tách dấu
            .replace(/[\u0300-\u036f]/g, "") // xoá dấu
            .toLowerCase()
            .trim();

        if (normalized.includes("ha noi")) {
            phiShip = 30000;
        }

        phishipElement.textContent = formatCurrency(phiShip);
        updateSummary();
    }

    document.addEventListener("DOMContentLoaded", updateSummary);
    /*]]>*/
</script>
</body>
</html>
