<!-- templates/user/orders.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout-user.html}">
<head>
    <title>Lịch sử đơn hàng</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container mt-5 pt-5">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-shopping-bag me-2"></i>Lịch sử đơn hàng</h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="text-center py-5">
                            <i class="fas fa-shopping-cart fa-3x text-muted mb-3"></i>
                            <h5 class="text-muted">Chưa có đơn hàng nào</h5>
                            <p class="text-muted">Bạn chưa có đơn hàng nào. Hãy mua sắm ngay!</p>
                            <a href="/" class="btn btn-primary">
                                <i class="fas fa-shopping-cart me-1"></i>Mua sắm ngay
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
