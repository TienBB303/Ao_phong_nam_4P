<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách mã giảm giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f6fa;
        }
        .filter-section input,
        .filter-section select {
            border-radius: 6px;
        }
        .table thead {
            background-color: #f1f1f1;
        }
        .badge-status {
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .badge-active {
            color: #198754;
            background-color: #d1e7dd;
        }
        .badge-expired {
            color: #dc3545;
            background-color: #f8d7da;
        }
        .badge-upcoming {
            color: #0d6efd;
            background-color: #cfe2ff;
        }
        .btn-icon {
            border: none;
            background: none;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div th:if="${error}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <h4 class="mb-4 fw-semibold">Mã giảm giá</h4>


    <form class="p-4 rounded shadow-sm mb-4" method="get">
        <div class="row gy-3">
            <div class="col-md-3">
                <label for="code" class="form-label">Mã giảm giá</label>
                <input type="text" name="code" id="code" class="form-control" placeholder="Nhập mã..." th:value="${code}">
            </div>

            <div class="col-md-3">
                <label for="start" class="form-label">Ngày áp dụng</label>
                <input type="date" name="start" id="start" class="form-control" th:value="${start}">
            </div>

            <div class="col-md-3">
                <label for="end" class="form-label">Ngày kết thúc</label>
                <input type="date" name="end" id="end" class="form-control" th:value="${end}">
            </div>

            <div class="col-md-3">
                <label for="status" class="form-label">Trạng thái</label>
                <select name="status" id="status" class="form-select">
                    <option value="">-- Tất cả --</option>
                    <option value="1" th:selected="${status == '1'}">Đang diễn ra</option>
                    <option value="2" th:selected="${status == '2'}">Sắp diễn ra</option>
                    <option value="3" th:selected="${status == '3'}">Đã kết thúc</option>
                    <option value="4" th:selected="${status == '4'}">Đã đóng</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="type" class="form-label">Loại giảm giá</label>
                <select name="type" id="type" class="form-select">
                    <option value="">-- Tất cả --</option>
                    <option value="percent" th:selected="${type == 'percent'}">Phần trăm</option>
                    <option value="amount" th:selected="${type == 'amount'}">Số tiền</option>
                </select>
            </div>

            <div class="col-md-3 d-flex align-items-end gap-2">
                <button type="button" id="search-btn" class="btn btn-primary w-100">🔍 Tìm kiếm</button>
                <a th:href="@{/admin/discount/view}" class="btn btn-outline-secondary w-100">🧹 Hủy</a>
            </div>
        </div>
    </form>


    <a th:href="@{/admin/discount/create}" class="btn btn-primary">➕ Thêm</a>
    <table class="table table-hover table-bordered align-middle text-center">
        <thead>
        <tr>
            <th>STT</th>
            <th>Mã giảm giá</th>
            <th>Tên giảm giá</th>
            <th>Ngày áp dụng</th>
            <th>Ngày hết hạn</th>
            <th>Kiểu</th>
            <th>Giá trị giảm</th>
            <th>Số lượng</th>
            <th>Trạng thái</th>
            <th>Công cụ</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d, iterStat : ${list}">
            <td th:text="${iterStat.index + 1}"></td>
            <td th:text="${d.code}"></td>
            <td th:text="${d.codeName}"></td>
            <td th:text="${#temporals.format(d.startDatetime, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${#temporals.format(d.endDatetime, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${d.discountType == 'percent' ? 'Phần trăm' : 'Số tiền'}"></td>
            <td>
                <span th:text="${d.discountType == 'percent'} ? ${d.discountValue.intValue() + '%'} : ${#numbers.formatDecimal(d.discountValue, 0, 'POINT', 0, 'COMMA')} + '₫'"></span>
            </td>
            <td th:text="${d.usageLimit}"></td>
            <td>
    <span th:switch="${d.displayStatus}">
        <span th:case="'Đã kết thúc'" class="badge badge-expired">Đã kết thúc</span>
        <span th:case="'Sắp diễn ra'" class="badge badge-upcoming">Sắp diễn ra</span>
        <span th:case="'Đã đóng'" class="badge bg-secondary">Đã đóng</span>
        <span th:case="'Đang diễn ra'" class="badge badge-active">Đang diễn ra</span>
    </span>            </td>

            <td>

                <a th:href="@{'/admin/discount/toggle-status/' + ${d.id}}"
                   onclick="return confirm('Bạn có chắc chắn muốn đổi trạng thái?')">
                    <button type="button" class="btn-icon text-danger">🔄</button>
                </a>

                <a th:href="@{'/admin/discount/edit/' + ${d.id}}">
                    <button class="btn-icon text-dark">✏️</button>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="mt-3">
        <nav>
            <ul class="pagination">
                <!-- Nút Previous -->
                <li class="page-item" th:if="${currentPage > 0}">
                    <a class="page-link" href="javascript:void(0)" onclick="changePage([[${currentPage - 1}]])">«</a>
                </li>

                <!-- Các nút số trang -->
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" href="javascript:void(0)" th:text="${i + 1}" th:onclick="'changePage(' + ${i} + ')'"></a>
                </li>

                <!-- Nút Next -->
                <li class="page-item" th:if="${currentPage < totalPages - 1}">
                    <a class="page-link" href="javascript:void(0)" onclick="changePage([[${currentPage + 1}]])">»</a>
                </li>
            </ul>
        </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>

<script>
    function changePage(page) {
        const params = new URLSearchParams(window.location.search);
        params.set("page", page);
        window.location.search = params.toString();
    }

    document.addEventListener("DOMContentLoaded", function () {
        const searchBtn = document.getElementById("search-btn");
        if (searchBtn) {
            searchBtn.addEventListener("click", function (e) {
                e.preventDefault();
                const params = new URLSearchParams();

                params.set("page", 0); // reset về trang đầu tiên
                params.set("code", document.querySelector("input[name='code']").value);
                params.set("start", document.querySelector("input[name='start']").value);
                params.set("end", document.querySelector("input[name='end']").value);
                params.set("status", document.querySelector("select[name='status']").value);
                params.set("type", document.querySelector("select[name='type']").value);

                window.location.search = params.toString();
            });
        }
    });
</script>

</body>
</html>
