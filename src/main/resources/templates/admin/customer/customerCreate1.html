<style>
    /* Đảm bảo Select2 chiếm đủ chiều rộng */
    .select2-container {
        width: 100% !important;
    }

    /* Căn chỉnh chiều cao và border giống với Bootstrap input */
    .select2-selection--single {
        height: 38px !important;
        padding: 6px 12px;
        font-size: 14px;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        display: flex;
        align-items: center;
    }

    /* Căn giữa văn bản hiển thị */
    .select2-selection__rendered {
        line-height: 24px !important;
    }

    /* Đảm bảo icon mũi tên căn chỉnh đúng */
    .select2-selection__arrow {
        height: 100% !important;
    }

    /* Dropdown menu không đè lên input */
    .select2-dropdown {
        z-index: 9999;
    }
</style>

    <section>
        <div class="pc-container">

                <div class="container mt-5">
                    <!-- Hiển thị thông báo lỗi -->
                    <div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Hiển thị thông báo thành công -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <h4 class="mb-4 fw-semibold">Thêm mới khách hàng</h4>

                    <!-- Form thêm khách hàng -->
                    <form th:action="@{/admin/customer/save}" th:object="${customerDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Mã khách hàng:</label>
                            <input type="text" th:field="*{code}" class="form-control" readonly/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tên:</label>
                            <input type="text" th:field="*{name}" id="name" class="form-control" required/>
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email:</label>
                            <input type="email" th:field="*{email}" id="email" class="form-control" required/>
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Số điện thoại:</label>
                            <input type="text" th:field="*{phoneNumber}" id="phoneNumber" class="form-control" required/>
                            <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="province" class="form-label">Tỉnh/Thành phố</label>
                            <select id="province" name="province">
                                <option value="">-- Chọn Tỉnh/Thành phố --</option>
                                <option value="01">Hà Nội</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="district" class="form-label">Quận/Huyện</label>
                            <input type="text" id="district" class="form-control" required/>
                        </div>

                        <div class="mb-3">
                            <label for="ward" class="form-label">Phường/Xã</label>
                            <input type="text" id="ward" class="form-control" required/>
                        </div>
                        <!-- Ẩn input cuối cùng để bind về địa chỉ đầy đủ -->
                        <input type="hidden" name="address" id="fullAddress" th:field="*{address}" />

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/customer/view}" class="btn btn-outline-secondary">⬅ Quay lại</a>
                            <button type="submit" class="btn btn-primary">💾 Lưu khách hàng</button>
                        </div>
                    </form>
                </div> <!-- đóng .container -->
            </div> <!-- đóng .pc-content -->

<!-- Script validation -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        // Gọi update mỗi khi người dùng gõ vào input
        document.getElementById("district").addEventListener("input", updateFullAddress);
        document.getElementById("ward").addEventListener("input", updateFullAddress);
        document.getElementById("province").addEventListener("change", updateFullAddress);

        // Gọi lại trước khi submit
        form.addEventListener("submit", function (e) {
            updateFullAddress();
        });
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const phoneInput = document.getElementById("phoneNumber");

        fetchProvinces();

        form.addEventListener("submit", function (e) {
            updateFullAddress();
            let isValid = true;

            // Tên
            nameInput.setCustomValidity("");
            const nameRegex = /^[a-zA-ZÀ-ỹ\s]+$/;
            if (!nameRegex.test(nameInput.value.trim())) {
                nameInput.setCustomValidity("Tên không được chứa ký tự đặc biệt hoặc số.");
                isValid = false;
            }
            nameInput.reportValidity();

            // Email
            emailInput.setCustomValidity("");
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value.trim())) {
                emailInput.setCustomValidity("Email không đúng định dạng.");
                isValid = false;
            }
            emailInput.reportValidity();

            // SĐT
            phoneInput.setCustomValidity("");
            const phoneRegex = /^(0[3|5|7|8|9])[0-9]{8}$/;
            if (!phoneRegex.test(phoneInput.value.trim())) {
                phoneInput.setCustomValidity("Số điện thoại phải gồm 10 chữ số.");
                isValid = false;
            }
            phoneInput.reportValidity();

            if (!isValid) e.preventDefault();
        });

        // Sự kiện onchange

        document.getElementById("district").addEventListener("change", function () {
            const districtCode = this.value;
            if (districtCode) fetchWards(districtCode);
            else {
                document.getElementById("ward").innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
                $('#ward').select2({
                    placeholder: "-- Chọn hoặc nhập Phường/Xã --",
                    tags: true,
                    allowClear: true
                });
            }
            updateFullAddress();
        });

        document.getElementById("ward").addEventListener("change", updateFullAddress);
    });

    async function fetchProvinces() {
        const provinceSelect = document.getElementById("province");
        provinceSelect.innerHTML = '<option>Đang tải...</option>';
        try {
            const res = await fetch("/api/geo/provinces");
            const provinces = await res.json();

            // Gán lại HTML không có placeholder, vì mặc định là Hà Nội
            provinceSelect.innerHTML = '';
            let haNoiCode = '';

            provinces.forEach(p => {
                const selected = p.name === "Hà Nội" ? 'selected' : '';
                if (selected) haNoiCode = p.code;
                provinceSelect.innerHTML += `<option value="${p.code}" ${selected}>${p.name}</option>`;
            });

            // Gọi luôn fetchDistricts nếu mặc định là Hà Nội
            if (haNoiCode) {
                await fetchDistricts(haNoiCode);
            }

        } catch (err) {
            console.error("Lỗi tỉnh/thành:", err);
            provinceSelect.innerHTML = '<option value="">-- Lỗi tải dữ liệu --</option>';
        } finally {
            $('#province').select2({
                placeholder: "-- Chọn Tỉnh/Thành phố --",
                allowClear: true
            });
        }
    }

    function updateFullAddress() {
        const province = document.getElementById("province");
        const provinceText = province.options[province.selectedIndex]?.text?.trim() || "";

        const district = document.getElementById("district").value.trim();
        const ward = document.getElementById("ward").value.trim();

        const full = [ward, district, provinceText].filter(Boolean).join(", ");
        document.getElementById("fullAddress").value = full;
    }
