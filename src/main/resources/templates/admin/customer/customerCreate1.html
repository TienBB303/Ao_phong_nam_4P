<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">

<head>
    <title></title>
</head>
<body>
<div layout:fragment="content">
        <div class="pc-container">
            <div class="pc-content">
                <div class="container mt-5">
                    <!-- Hiển thị thông báo lỗi -->
                    <div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Hiển thị thông báo thành công -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <h4 class="mb-4 fw-semibold">Thêm mới khách hàng</h4>
                    <form id="customerForm" th:action="@{/admin/customer/save}" th:object="${customerDto}" method="post" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label">Mã khách hàng:</label>
                            <input type="text" th:field="*{code}" class="form-control" readonly/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tên:</label>
                            <input type="text" th:field="*{name}" id="name" class="form-control" required/>
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại:</label>
                            <input type="text" th:field="*{phoneNumber}" id="phoneNumber" class="form-control" required/>
                            <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Giới tính:</label>
                            <div>
                                <input type="radio" th:field="*{gender}" value="true" id="male" checked>
                                <label for="male">Nam</label>
                                <input type="radio" th:field="*{gender}" value="false" id="female">
                                <label for="female">Nữ</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ngày sinh:</label>
                            <input type="date" th:field="*{birthday}" class="form-control"/>
                            <div class="text-danger" th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}">Ngày sinh không đúng định dạng</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email:</label>
                            <input type="email" th:field="*{email}" id="email" class="form-control" required/>
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                            <!-- Ẩn trường trạng thái, chỉ hiển thị chữ -->
                            <input type="hidden" th:field="*{isActive}" value="true"/>
                            <div class="mb-3">
                                <label class="form-label">Trạng thái</label>
                                <span class="form-control-plaintext">Hoạt động</span>
                            </div>
                        <hr/>
                        <h5 class="fw-semibold">ĐỊA CHỈ GIAO HÀNG</h5>
                        <div class="mb-3">
                            <label for="province" class="form-label">Tỉnh/Thành phố</label>
                            <select th:field="*{address.provinceId}" id="province" class="form-select"></select>
                            <input type="hidden" th:field="*{address.provinceName}" id="provinceName"/>
                        </div>
                        <div class="mb-3">
                            <label for="district" class="form-label">Quận/Huyện</label>
                            <select th:field="*{address.districtId}" id="district" class="form-select"></select>
                            <input type="hidden" th:field="*{address.districtName}" id="districtName"/>
                        </div>
                        <div class="mb-3">
                            <label for="ward" class="form-label">Phường/Xã</label>
                            <select th:field="*{address.wardId}" id="ward" class="form-select"></select>
                            <input type="hidden" th:field="*{address.wardName}" id="wardName"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ chi tiết:</label>
                            <input type="text" th:field="*{address.addressDetail}" class="form-control"/>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" th:field="*{address.isDefault}" id="isDefault">
                            <label class="form-check-label" for="isDefault">
                                Đây là địa chỉ mặc định
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="otherReceiver" onclick="toggleReceiverForm()">
                            <label class="form-check-label" for="otherReceiver">
                                Người nhận khác người mua
                            </label>
                        </div>
                        <div id="receiverForm" style="display:none;">
                            <div class="mb-3">
                                <label class="form-label">Tên người nhận:</label>
                                <input type="text" th:field="*{address.receiverName}" class="form-control"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">SĐT người nhận:</label>
                                <input type="text" th:field="*{address.receiverPhoneNumber}" class="form-control"/>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/customer/view}" class="btn btn-outline-secondary">⬅ Quay lại</a>
                            <button type="submit" class="btn btn-primary">💾 Lưu khách hàng</button>
                        </div>
                    </form>
                </div> <!-- đóng .container -->
            </div> <!-- đóng .pc-content -->
        </div> <!-- đóng .pc-container -->


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    const token = '9c1ee582-5a3b-11f0-99f8-027692bb547c';
    const provinceSelect = document.getElementById('province');
    const districtSelect = document.getElementById('district');
    const wardSelect = document.getElementById('ward');

    // Load tỉnh
    fetch('https://online-gateway.ghn.vn/shiip/public-api/master-data/province', {
        headers: { 'token': token }
    })
        .then(res => res.json())
        .then(data => {
            provinceSelect.innerHTML = '<option value="">-- Chọn tỉnh/thành phố --</option>';
            data.data.forEach(province => {
                provinceSelect.innerHTML += `<option value="${province.ProvinceID}">${province.ProvinceName}</option>`;
            });
            districtSelect.innerHTML = '<option value="">-- Chọn quận/huyện --</option>';
            wardSelect.innerHTML = '<option value="">-- Chọn phường/xã --</option>';
        });

    // Load quận khi chọn tỉnh
    $('#province').on('change', function() {
        const provinceId = provinceSelect.value;
        if (!provinceId) {
            districtSelect.innerHTML = '<option value="">-- Chọn quận/huyện --</option>';
            wardSelect.innerHTML = '<option value="">-- Chọn phường/xã --</option>';
            $('#provinceName').val('');
            return;
        }
        districtSelect.innerHTML = '<option>Loading...</option>';
        fetch('https://online-gateway.ghn.vn/shiip/public-api/master-data/district', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'token': token
            },
            body: JSON.stringify({ province_id: parseInt(provinceId) })
        })
            .then(res => res.json())
            .then(data => {
                districtSelect.innerHTML = '<option value="">-- Chọn quận/huyện --</option>';
                data.data.forEach(district => {
                    districtSelect.innerHTML += `<option value="${district.DistrictID}">${district.DistrictName}</option>`;
                });
                wardSelect.innerHTML = '<option value="">-- Chọn phường/xã --</option>';
                $('#districtName').val('');
                $('#wardName').val('');
            });
        $('#provinceName').val($("#province option:selected").text());
    });

    // Load phường khi chọn quận
    $('#district').on('change', function() {
        const districtId = districtSelect.value;
        if (!districtId) {
            wardSelect.innerHTML = '<option value="">-- Chọn phường/xã --</option>';
            $('#districtName').val('');
            $('#wardName').val('');
            return;
        }
        wardSelect.innerHTML = '<option>Loading...</option>';
        fetch(`https://online-gateway.ghn.vn/shiip/public-api/master-data/ward?district_id=${districtId}`, {
            headers: { 'token': token }
        })
            .then(res => res.json())
            .then(data => {
                wardSelect.innerHTML = '<option value="">-- Chọn phường/xã --</option>';
                data.data.forEach(ward => {
                    wardSelect.innerHTML += `<option value="${ward.WardCode}">${ward.WardName}</option>`;
                });
                $('#wardName').val('');
            });
        $('#districtName').val($("#district option:selected").text());
    });

    // Khi chọn lại phường
    $('#ward').on('change', function() {
        $('#wardName').val($("#ward option:selected").text());
    });

    // Khi submit form, validate và cập nhật input ẩn
    $('#customerForm').on('submit', function(e) {
        // Cập nhật input ẩn
        $('#provinceName').val($("#province option:selected").text());
        $('#districtName').val($("#district option:selected").text());
        $('#wardName').val($("#ward option:selected").text());

        // Validate
        let isValid = true;
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const phoneInput = document.getElementById("phoneNumber");

        // Validate tên
        nameInput.setCustomValidity("");
        const nameRegex = /^[a-zA-ZÀ-ỹ\s]+$/;
        if (!nameRegex.test(nameInput.value.trim())) {
            nameInput.setCustomValidity("Tên không được chứa ký tự đặc biệt hoặc số.");
            isValid = false;
        }

        // Validate email
        emailInput.setCustomValidity("");
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailInput.value.trim())) {
            emailInput.setCustomValidity("Email không đúng định dạng.");
            isValid = false;
        }

        // Validate số điện thoại
        phoneInput.setCustomValidity("");
        const phoneRegex = /^0\d{9}$/;
        if (!phoneRegex.test(phoneInput.value.trim())) {
            phoneInput.setCustomValidity("Số điện thoại phải bắt đầu bằng 0 và có đúng 10 chữ số.");
            isValid = false;
        }

        nameInput.reportValidity();
        emailInput.reportValidity();
        phoneInput.reportValidity();

        if (!isValid) {
            e.preventDefault();
        }
    });
    function toggleReceiverForm() {
        const checkbox = document.getElementById('otherReceiver');
        const receiverForm = document.getElementById('receiverForm');
        if (checkbox.checked) {
            receiverForm.style.display = 'block';
        } else {
            receiverForm.style.display = 'none';
            $('#receiverForm input').val('');
        }
    }
</script>
</div>


</body>
</html>
