<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm mới khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/@tabler/icons-webfont@2.30.0/tabler-icons.min.css" rel="stylesheet">

    <style>
        body {
            background-color: white;
            color: black;
        }

        .form-control, .form-select {
            border-radius: 6px;
            color: black;
        }

        a, button {
            color: black;
            transition: color 0.2s ease;
        }

        a:hover, button:hover {
            color: #0d6efd !important;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <!-- Hiển thị thông báo lỗi -->
    <div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Hiển thị thông báo thành công -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <h4 class="mb-4 fw-semibold">Thêm mới khách hàng</h4>

    <!-- Form thêm khách hàng -->
    <form th:action="@{/admin/customer/save}" th:object="${customer}" method="post">
        <div class="mb-3">
            <label class="form-label">Mã khách hàng:</label>
            <input type="text" th:field="*{code}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Tên:</label>
            <input type="text" th:field="*{name}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" th:field="*{email}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Số điện thoại:</label>
            <input type="text" th:field="*{phoneNumber}" class="form-control" required />
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/admin/customer/view}" class="btn btn-outline-secondary">⬅ Quay lại</a>
            <button type="submit" class="btn btn-primary">💾 Lưu khách hàng</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
