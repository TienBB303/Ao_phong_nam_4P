<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head}">
    <title>Quan ly khach hang | 4PStore</title>
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
</head>
<body>
<header th:replace="~{admin/fragments/header :: header}"></header>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<section>
    <section>
        <div class="pc-container">
            <div class="pc-content">
                <div class="container mt-5">
                    <!-- Hiển thị thông báo lỗi -->
                    <div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Hiển thị thông báo thành công -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <h4 class="mb-4 fw-semibold">Thêm mới khách hàng</h4>
                    <form th:action="@{/admin/customer/save}" th:object="${customerDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Mã khách hàng:</label>
                            <input type="text" th:field="*{code}" class="form-control" readonly/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tên:</label>
                            <input type="text" th:field="*{name}" id="name" class="form-control" required/>
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email:</label>
                            <input type="email" th:field="*{email}" id="email" class="form-control" required/>
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại:</label>
                            <input type="text" th:field="*{phoneNumber}" id="phoneNumber" class="form-control"
                                   required/>
                            <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}"
                                 th:errors="*{phoneNumber}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="province" class="form-label">Tỉnh/Thành phố</label>
                            <select id="province" class="form-select" onchange="updateFullAddress()"></select>
                        </div>
                        <div class="mb-3">
                            <label for="district" class="form-label">Quận/Huyện</label>
                            <select id="district" class="form-select" onchange="updateFullAddress()"></select>
                        </div>
                        <div class="mb-3">
                            <label for="ward" class="form-label">Phường/Xã</label>
                            <select id="ward" class="form-select" onchange="updateFullAddress()"></select>
                        </div>
                        <input type="hidden" name="address" id="fullAddress" th:field="*{address}"/>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/customer/view}" class="btn btn-outline-secondary">⬅ Quay lại</a>
                            <button type="submit" class="btn btn-primary">💾 Lưu khách hàng</button>
                        </div>
                    </form>
                </div> <!-- đóng .container -->
            </div> <!-- đóng .pc-content -->
        </div> <!-- đóng .pc-container -->
    </section> <!-- đóng section trong -->
</section> <!-- đóng section ngoài -->
<!-- Select2 JS -->
<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    const token = '9c1ee582-5a3b-11f0-99f8-027692bb547c';
    const provinceSelect = document.getElementById('province');
    const districtSelect = document.getElementById('district');
    const wardSelect = document.getElementById('ward');
    const fullAddressInput = document.getElementById("fullAddress");

    // Load tỉnh
    fetch('https://online-gateway.ghn.vn/shiip/public-api/master-data/province', {
        headers: { 'token': token }
    })
        .then(res => res.json())
        .then(data => {
            data.data.forEach(province => {
                provinceSelect.innerHTML += `<option value="${province.ProvinceID}">${province.ProvinceName}</option>`;
            });
        });

    // Load quận khi chọn tỉnh
    provinceSelect.addEventListener('change', () => {
        districtSelect.innerHTML = '<option>Loading...</option>';
        fetch('https://online-gateway.ghn.vn/shiip/public-api/master-data/district', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'token': token
            },
            body: JSON.stringify({ province_id: parseInt(provinceSelect.value) })
        })
            .then(res => res.json())
            .then(data => {
                districtSelect.innerHTML = '';
                data.data.forEach(district => {
                    districtSelect.innerHTML += `<option value="${district.DistrictID}">${district.DistrictName}</option>`;
                });
            });
    });

    // Load phường khi chọn quận
    districtSelect.addEventListener('change', () => {
        wardSelect.innerHTML = '<option>Loading...</option>';
        fetch(`https://online-gateway.ghn.vn/shiip/public-api/master-data/ward?district_id=${districtSelect.value}`, {
            headers: { 'token': token }
        })
            .then(res => res.json())
            .then(data => {
                wardSelect.innerHTML = '';
                data.data.forEach(ward => {
                    wardSelect.innerHTML += `<option value="${ward.WardCode}">${ward.WardName}</option>`;
                });
            });
    });

    // Cập nhật địa chỉ khi chọn phường
    wardSelect.addEventListener('change', () => {
        updateFullAddress();
    });

    function updateFullAddress() {
        const provinceText = provinceSelect.options[provinceSelect.selectedIndex]?.text || "";
        const districtText = districtSelect.options[districtSelect.selectedIndex]?.text || "";
        const wardText = wardSelect.options[wardSelect.selectedIndex]?.text || "";
        const fullAddress = `${wardText}, ${districtText}, ${provinceText}`;
        fullAddressInput.value = fullAddress;
    }

    document.getElementById('addressForm').addEventListener('submit', (e) => {
        let isValid = true;
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const phoneInput = document.getElementById("phoneNumber");

        // Validate tên
        nameInput.setCustomValidity("");
        const nameRegex = /^[a-zA-ZÀ-ỹ\s]+$/;
        if (!nameRegex.test(nameInput.value.trim())) {
            nameInput.setCustomValidity("Tên không được chứa ký tự đặc biệt hoặc số.");
            isValid = false;
        }

        // Validate email
        emailInput.setCustomValidity("");
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailInput.value.trim())) {
            emailInput.setCustomValidity("Email không đúng định dạng.");
            isValid = false;
        }

        // Validate số điện thoại
        phoneInput.setCustomValidity("");
        const phoneRegex = /^0\d{9}$/;
        if (!phoneRegex.test(phoneInput.value.trim())) {
            phoneInput.setCustomValidity("Số điện thoại phải bắt đầu bằng 0 và có đúng 10 chữ số.");
            isValid = false;
        }

        nameInput.reportValidity();
        emailInput.reportValidity();
        phoneInput.reportValidity();

        updateFullAddress();

        if (!isValid) {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
