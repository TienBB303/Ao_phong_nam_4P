<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/@tabler/icons-webfont@2.30.0/tabler-icons.min.css" rel="stylesheet">

    <style>
        body {
            background-color: white;
            color: black;
        }

        .form-label {
            font-weight: 500;
        }

        .form-control, .form-select {
            border-radius: 6px;
        }

        .btn-back {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <h4 class="fw-semibold mb-4">Chỉnh sửa thông tin khách hàng</h4>

    <form th:action="@{/admin/customer/update}" th:object="${customer}" method="post" class="p-4 rounded shadow-sm bg-light">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="code" class="form-label">Mã khách hàng</label>
            <input type="text" id="code" th:field="*{code}" class="form-control" readonly>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label">Họ và tên</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="phoneNumber" class="form-label">Phone number</label>
            <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" required>
        </div>


        <div class="mb-3">
            <label for="isActive" class="form-label">Trạng thái</label>
            <select id="isActive" th:field="*{isActive}" class="form-select">
                <option th:value="true" th:selected="*{isActive == true}">Hoạt động</option>
                <option th:value="false" th:selected="*{isActive == false}">Không hoạt động</option>
            </select>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/admin/customer/view}" class="btn btn-outline-secondary btn-back">← Quay lại</a>
            <button type="submit" class="btn btn-primary">💾 Lưu thay đổi</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
