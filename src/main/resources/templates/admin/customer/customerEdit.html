<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head}">
    <title>Quản lý khách hàng | 4PStore</title>
</head>
<body>
<header th:replace="~{admin/fragments/header :: header}"></header>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

<section>
    <div class="pc-container">
        <div class="pc-content">
            <!--                <div class="page-header">-->
            <!--                    <div class="page-block">-->
            <!--                        <div class="row align-items-center">-->
            <!--                            <div class="col-md-12">-->
            <!--                                <div class="page-header-title">-->
            <!--                                    <h5 class="m-b-10">Quản lý khách hàng</h5>-->
            <!--                                </div>-->
            <!--                                <ul class="breadcrumb">-->
            <!--                                    <li class="breadcrumb-item" aria-current="page">Thêm khách hàng</li>-->
            <!--                                </ul>-->
            <!--                            </div>-->
            <!--                        </div>-->
            <!--                    </div>-->
            <!--                </div>-->
            <div class="container mt-5">

                <!-- Hiển thị thông báo -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Form chỉnh sửa -->
                <h4 class="fw-semibold mb-4">Chỉnh sửa thông tin khách hàng</h4>

                <form th:action="@{/admin/customer/update}" th:object="${customerDto}" method="post"
                      class="p-4 rounded shadow-sm bg-light">

                    <input type="hidden" th:field="*{id}"/>

                    <div class="mb-3">
                        <label class="form-label">Mã khách hàng:</label>
                        <input type="text" th:field="*{code}" class="form-control" readonly/>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Họ và tên</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Số điện thoại</label>
                        <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}"
                             th:errors="*{phoneNumber}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Địa chỉ</label>
                        <input type="text" id="address" th:field="*{address}" class="form-control">
                        <div class="text-danger" th:if="${#fields.hasErrors('address')}"
                             th:errors="*{address}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="isActive" class="form-label">Trạng thái</label>
                        <select id="isActive" th:field="*{isActive}" class="form-select">
                            <option th:value="true">Hoạt động</option>
                            <option th:value="false">Không hoạt động</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/customer/view}" class="btn btn-outline-secondary">← Quay lại</a>
                        <button type="submit" class="btn btn-primary">💾 Lưu thay đổi</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</section>
<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const phoneInput = document.getElementById("phoneNumber");

        form.addEventListener("submit", function (e) {
            let isValid = true;

            // Tên
            nameInput.setCustomValidity("");
            const nameRegex = /^[a-zA-ZÀ-ỹ\s]+$/;
            if (!nameRegex.test(nameInput.value.trim())) {
                nameInput.setCustomValidity("Tên không được chứa ký tự đặc biệt hoặc số.");
                isValid = false;
            }
            nameInput.reportValidity();

            // Email
            emailInput.setCustomValidity("");
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value.trim())) {
                emailInput.setCustomValidity("Email không đúng định dạng.");
                isValid = false;
            }
            emailInput.reportValidity();
            phoneInput.setCustomValidity("");
            // Regex chuẩn cho SĐT Việt Nam 10 số (bắt đầu bằng 0 và đầu số hợp lệ)
            const phoneRegex = /^0\d{9}$/;
            if (!phoneRegex.test(phoneInput.value.trim())) {
                phoneInput.setCustomValidity("Số điện thoại phải bắt đầu bằng 0 và có độ dài từ 10 đến 12 chữ số.");
                isValid = false;
            }
            phoneInput.reportValidity();

            if (!isValid) {
                e.preventDefault(); // Ngăn chặn submit form nếu có lỗi
            }
        });
    });
</script>
</body>
</html>
