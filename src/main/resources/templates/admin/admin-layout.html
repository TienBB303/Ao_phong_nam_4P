<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .sidebar {
            width: 250px;
            background-color: #6c757d;
            color: white;
            min-height: 100vh;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
        }

        .sidebar .nav-link:hover {
            background-color: #5a6268;
        }

        .main-content {
            background-color: #e9ecef;
            padding: 30px;
            width: 100%;
            min-height: 100vh;
        }

        .logo-box {
            text-align: center;
            padding: 20px 0;
        }

        .logo-box img {
            width: 70px;
        }

        .logo-box p {
            margin: 0;
            font-weight: bold;
        }
        .logo-box {
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;

        }

        .logo-img {
            width: 180px;
            height: auto;
            object-fit: contain;
            margin-bottom: 8px;
            background-color: transparent;
        }

        .logo-text {
            font-weight: bold;
            color: white;
            font-size: 16px;
            margin: 0;
        }
    </style>
</head>
<body>
<!-- Wrapper chứa cả sidebar và content -->
<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column p-3">
        <div class="logo-box">
            <img th:src="@{/admin/images/logo1.png}" alt="Logo" class="logo-img">
            <p class="logo-text">4P Store</p>
        </div>
        <hr>
        <ul class="nav nav-pills flex-column">
            <li class="nav-item"><a href="#" data-url="/admin/home" class="nav-link menu-link">Trang chủ</a></li>
            <li class="nav-item"><a href="#" data-url="" class="nav-link menu-link">Bán hàng tại quầy</a></li>
            <li class="nav-item"><a href="#" data-url="" class="nav-link menu-link fw-bold">Quản lý sản phẩm</a></li>
            <li class="nav-item"><a href="#" data-url="" class="nav-link menu-link">Quản lý hóa đơn</a></li>
            <li class="nav-item"><a href="#" data-url="/admin/discount/view" class="nav-link menu-link" >Công cụ khuyến mãi</a></li>
            <li class="nav-item"><a href="#" data-url="" class="nav-link menu-link">Thống kê</a></li>
            <li class="nav-item"><a href="#" data-url="" class="nav-link menu-link">Quản lý tài khoản</a></li>
        </ul>
    </div>

    <!-- Main content hiển thị bên phải -->
    <div class="main-content" id="main-content">
        <h2>Chào mừng bạn đến với trang quản lý</h2>
        <p>Chọn một mục ở menu bên trái để hiển thị nội dung.</p>
    </div>
</div>


<script defer>
    function loadContent(url) {
        console.log("Loading content from:", url);
        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error("Lỗi mạng");
                return res.text();
            })
            .then(html => {
                document.getElementById("main-content").innerHTML = html;
                bindDynamicEvents();
                bindAjaxForm();
            })
            .catch(err => {
                document.getElementById("main-content").innerHTML =
                    "<div class='alert alert-danger'>Không thể tải nội dung.</div>";
                console.error("Lỗi:", err);
            });
    }

    function bindDynamicEvents() {
        document.querySelectorAll(".btn-create").forEach(btn => {
            btn.addEventListener("click", function (e) {
                e.preventDefault();
                loadContent("/admin/product/create");
            });
        });

        document.querySelectorAll(".btn-edit").forEach(btn => {
            btn.addEventListener("click", function (e) {
                e.preventDefault();
                const id = this.getAttribute("data-id");
                loadContent(`/admin/product/edit/${id}`);
            });
        });

    }

    document.addEventListener("DOMContentLoaded", function () {
        const links = document.querySelectorAll(".menu-link");
        console.log("Gán sự kiện cho", links.length, "menu-link");
        links.forEach(link => {
            link.addEventListener("click", function (e) {
                e.preventDefault();
                const url = this.getAttribute("data-url");
                if (url) {
                    loadContent(url);
                }
            });
        });

        bindDynamicEvents();
        bindAjaxForm();
    });

    function bindAjaxForm() {
        document.querySelectorAll(".ajax-form").forEach(form => {
            form.addEventListener("submit", function (e) {
                e.preventDefault();

                const formData = new FormData(form);
                const action = form.getAttribute("action") || form.action;

                fetch(action, {
                    method: "POST",
                    body: formData
                })
                    .then(res => res.text())
                    .then(html => {
                        document.getElementById("main-content").innerHTML = html;
                        bindDynamicEvents();
                        bindAjaxForm();
                    })
                    .catch(err => {
                        alert("Lỗi khi gửi form.");
                        console.error(err);
                    });
            });
        });
    }


</script>

</body>
</html>
