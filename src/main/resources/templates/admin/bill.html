<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">

<head>
    <title></title>
</head>
<body>
<div layout:fragment="content">


                    <form method="get" action="">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Quản lý hóa đơn</h5>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary" id="search-btn">🔍 Tìm kiếm</button>
                                <a th:href="@{/admin/bill/view}" class="btn btn-outline-secondary">🧹 Hủy</a>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <input type="text" name="code" class="form-control" placeholder="Mã hóa đơn"
                                       th:value="${code}">
                            </div>
                            <div class="col">
                                <input type="date" name="startDate" class="form-control" th:value="${startDate}" />
                            </div>
                            <div class="col">
                                <input type="date" name="endDate" class="form-control" th:value="${endDate}" />
                            </div>
                            <div class="col">
                                <select name="status" class="form-control">
                                    <option value="">Trạng thái</option>
                                    <option value="1" th:selected="${status == 1}">Chờ xác nhận</option>
                                    <option value="2" th:selected="${status == 2}">Đã xác nhận</option>
                                    <option value="3" th:selected="${status == 3}">Đang giao</option>
                                    <option value="4" th:selected="${status == 4}">Hoàn thành</option>
                                    <option value="5" th:selected="${status == 5}">Đã huỷ</option>
                                </select>
                            </div>
                            <div class="col">
                                <select name="type" class="form-control">
                                    <option value="">Loại đơn</option>
                                    <option value="0" th:selected="${type == false}">Tại quầy</option>
                                    <option value="1" th:selected="${type == true}">Online</option>
                                </select>
                            </div>
                            <div class="col">
                                <input type="text" name="name" class="form-control" placeholder="Họ và tên"
                                       th:value="${name}">
                            </div>
                        </div>

                        <div class="row mb-3 align-items-end">
                            <div class="col-3">
                                <input type="text" name="phoneNumber" class="form-control" placeholder="Số điện thoại"
                                       th:value="${phoneNumber}">
                            </div>

                        </div>
                    </form>

                    <table class="table table-bordered text-center">
                        <thead>
                        <tr>
                            <th>STT</th>
                            <th>Mã hóa đơn</th>
                            <th>Họ và tên</th>
                            <th>SĐT</th>
                            <th>Ngày đặt</th>
                            <th>Tổng tiền</th>
                            <th>Loại đơn</th>
                            <th>Hình thức TT</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="bill, iterStat : ${bills}">
                            <td th:text="${iterStat.index + 1}">1</td>
                            <td th:text="${bill.code}">HD001</td>
                            <td th:text="${bill.name}">Nguyễn Văn A</td>
                            <td th:text="${bill.phoneNumber}">0123456789</td>
                            <td th:text="${#temporals.format(bill.createdAt, 'dd-MM-yyyy HH:mm')}">---</td>
                            <td th:text="${bill.total_checkout != null ? #numbers.formatDecimal(bill.total_checkout, 0, 'POINT', 0, 'COMMA') + '₫' : '0₫'}">0₫</td>
                            <td th:text="${bill.typeBill != null and bill.typeBill == true ? 'Online' : 'Tại quầy'}">Tại quầy</td>
                            <td th:text="${bill.paymentMethod.name}"></td>
                            <td>
                                 <span th:switch="${bill.status}">
                                   <span th:case="1">Chờ xác nhận</span>
                                   <span th:case="2">Đã xác nhận</span>
                                   <span th:case="3">Đang giao</span>
                                   <span th:case="4">Hoàn thành</span>
                                   <span th:case="5">Đã huỷ</span>
                                   <span th:case="6">Không rõ</span>
                                 </span>
                            </td>
                            <td>
                                <a th:href="@{'/admin/bill/getbill-detail/' + ${bill.id}}" class="btn btn-sm btn-primary">Xem</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <div class="d-flex justify-content-end">
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/bill/view(page=${currentPage - 1})}">«</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/admin/bill/view(page=${i})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/bill/view(page=${currentPage + 1})}">»</a>
                            </li>
                        </ul>
                    </div>

</div>

<header th:replace="~{admin/fragments/footer :: footer}"></header>
</body>
</html>
