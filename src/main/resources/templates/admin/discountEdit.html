<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Chỉnh sửa mã giảm giá</title>
    <meta charset="UTF-8">
    <style>
        label {
            display: block;
            margin: 8px 0 4px;
        }
        input, select, textarea {
            width: 300px;
            padding: 5px;
        }
        button {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<h2>Chỉnh sửa mã giảm giá</h2>

<form th:action="@{'/admin/discount/update/' + ${discount.id}}"
      th:object="${discount}" method="post">

    <label>Mã</label>
    <input type="text" th:field="*{code}" required/>

    <label>Tên mã</label>
    <input type="text" th:field="*{codeName}" required/>

    <div class="mb-3">
        <label class="form-label d-block">Loại giảm giá</label>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="discountType" value="percent"
                   th:field="*{discountType}" onclick="handleEditDiscountTypeChange()">
            <label class="form-check-label">Phần trăm</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="discountType" value="amount"
                   th:field="*{discountType}" onclick="handleEditDiscountTypeChange()">
            <label class="form-check-label">Số tiền</label>
        </div>
    </div>

    <label>Giá trị</label>
    <input type="number" step="1" th:field="*{discountValue}" required/>
    <label>Ngày bắt đầu</label>
    <input type="datetime-local"
           name="startDatetime"
           th:value="${discount.startDatetime != null ? #temporals.format(discount.startDatetime, 'yyyy-MM-dd''T''HH:mm') : ''}" />

    <label>Ngày kết thúc</label>
    <input type="datetime-local"
           name="endDatetime"
           th:value="${discount.endDatetime != null ? #temporals.format(discount.endDatetime, 'yyyy-MM-dd''T''HH:mm') : ''}" />

    <label>Đơn tối thiểu</label>
    <input type="number" step="0.01" th:field="*{minPurchase}"/>

    <div id="maxDiscountGroup">
        <label>Giảm tối đa</label>
        <input type="number" step="0.01" th:field="*{maxDiscount}"/>
    </div>


    <label>Số lượng</label>
    <input type="number" th:field="*{usageLimit}"/>

    <label>Mô tả</label>
    <textarea th:field="*{description}"></textarea>

    <label>Trạng thái</label>
    <select th:field="*{status}">
        <option th:value="true">Đang hoạt động</option>
        <option th:value="false">Ngừng</option>
    </select>

    <br/>
    <button type="submit">💾 Lưu lại</button>
    <a th:href="@{/admin/discount/view}" class="btn btn-secondary">Quay lại</a>
</form>
<script>
    function handleEditDiscountTypeChange() {
        const percentRadio = document.querySelector('input[name="discountType"][value="percent"]');
        const maxDiscountGroup = document.getElementById('maxDiscountGroup');
        const maxDiscountInput = document.querySelector('input[name="maxDiscount"]');

        if (percentRadio.checked) {
            maxDiscountGroup.style.display = 'block';
        } else {
            maxDiscountGroup.style.display = 'none';
            maxDiscountInput.value = ''; // hoặc '0' nếu bạn muốn lưu 0 thay vì null
        }
    }
    window.onload = handleEditDiscountTypeChange;
</script>
</body>
</html>
