<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa mã giảm giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f6fa;
        }

        .form-container {
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 900px;
            margin: 40px auto;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }

        .form-title {
            text-align: center;
            font-weight: bold;
            font-size: 26px;
            margin-bottom: 30px;
        }

        .form-buttons {
            text-align: right;
            margin-top: 30px;
        }

        .btn-cancel {
            border: 1px solid #dc3545;
            color: #dc3545;
            background: none;
        }

        .btn-cancel:hover {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
<div class="container form-container">
    <h2 class="form-title">Thông tin mã giảm giá</h2>

    <form th:action="@{'/admin/discount/update/' + ${discount.id}}" th:object="${discount}" method="post">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Mã giảm giá *</label>
                <input type="text" class="form-control" th:field="*{code}" required/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Tên giảm giá *</label>
                <input type="text" class="form-control" th:field="*{codeName}" required/>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Ngày áp dụng *</label>
                <input type="datetime-local" class="form-control"
                       th:field="*{startDatetime}"
                       th:value="${discount.startDatetime != null ? #temporals.format(discount.startDatetime, 'yyyy-MM-dd''T''HH:mm') : ''}"
                       required/>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Ngày kết thúc *</label>
                <input type="datetime-local" class="form-control"
                       th:field="*{endDatetime}"
                       th:value="${discount.endDatetime != null ? #temporals.format(discount.endDatetime, 'yyyy-MM-dd''T''HH:mm') : ''}"
                       required/>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label d-block">Phương thức giảm *</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="discountType" value="percent"
                           th:field="*{discountType}" onclick="handleEditDiscountTypeChange()">
                    <label class="form-check-label">Giảm theo phần trăm</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="discountType" value="amount"
                           th:field="*{discountType}" onclick="handleEditDiscountTypeChange()">
                    <label class="form-check-label">Giảm theo tiền</label>
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Giá trị giảm *</label>
                <input type="number" class="form-control" th:field="*{discountValue}" required/>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Số tiền áp dụng cho đơn tối thiểu từ (đ) *</label>
                <input type="number" class="form-control" th:field="*{minPurchase}" required/>
            </div>

            <div class="col-md-6 mb-3" id="maxDiscountGroup">
                <label class="form-label">Số tiền giảm tối đa (đ)</label>
                <input type="number" class="form-control" th:field="*{maxDiscount}"/>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Số lượng tối đa *</label>
                <input type="number" class="form-control" th:field="*{usageLimit}" required/>
            </div>
        </div>



        <div class="form-buttons">
            <a th:href="@{/admin/discount/view}" class="btn btn-cancel me-2">Hủy</a>
            <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
    </form>
</div>

<script>
    function handleEditDiscountTypeChange() {
        const percentRadio = document.querySelector('input[name="discountType"][value="percent"]');
        const maxDiscountGroup = document.getElementById('maxDiscountGroup');
        const maxDiscountInput = maxDiscountGroup.querySelector('input');

        if (percentRadio.checked) {
            maxDiscountGroup.style.display = 'block';
            maxDiscountInput.disabled = false;
        } else {
            maxDiscountGroup.style.display = 'none';
            maxDiscountInput.disabled = true;
            maxDiscountInput.value = '';
        }
    }

    window.onload = handleEditDiscountTypeChange;
</script>
</body>
</html>
