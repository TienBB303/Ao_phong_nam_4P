<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head}">
</head>
<body>
<header th:replace="~{admin/fragments/header :: header}"></header>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<section>
    <div class="pc-container">
        <div class="pc-content">
            <div class="page-header">
                <div class="page-block">
                    <div class="row align-items-center">
                        <div class="col-md-12">
                            <div class="page-header-title">
                                <h5 class="m-b-10">Quản lý nhân viên</h5>
                            </div>
                            <ul class="breadcrumb">
                                <li class="breadcrumb-item"><a href="/admin/dashboard">Dashboard</a></li>
                                <li class="breadcrumb-item" aria-current="page">Quản lý tài khoản</li>
                                <li class="breadcrumb-item" aria-current="page">Nhân viên</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col d-flex justify-content-between align-items-center">
                        <a th:href="@{/admin/employee/add}" class="btn btn-primary">Thêm mới</a>
                        <input type="text" class="form-control ms-auto" style="max-width: 300px;" placeholder="Tìm kiếm...">
                    </div>
                </div>

                <table id="multi-colum-dt" class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Mã TK</th>
                            <th>Họ và tên</th>
                            <th>Email</th>
                            <th>Địa chỉ</th>
                            <th>Ngày sinh</th>
                            <th>SĐT</th>
                            <th>Giới tính</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e, i : ${listEmployee}">
                            <td th:text="${i.index + 1}"></td>
                            <td th:text="${e.code}"></td>
                            <td th:text="${e.fullName}"></td>
                            <td th:text="${e.email}"></td>
                            <td th:text="${e.addressDetail}"></td>
                            <td th:text="${e.birthOfDate}"></td>
                            <td th:text="${e.phoneNumber}"></td>
                            <td th:text="${e.gender}"></td>
                            <td>
    <span th:class="${e.status} ? 'badge bg-success' : 'badge bg-danger'"
          th:text="${e.status} ? 'Đang hoạt động' : 'Đã khóa'"></span>
                            </td>

                            <td>
                                <a th:href="@{'/admin/employee/detail'(id=${e.id})}" class="btn btn-info">Chi tiết</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-end">

                        <!-- Previous -->
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link"
                               th:href="${currentPage > 0} ? @{|?page=${currentPage - 1}&size=5|} : '#'">Previous</a>
                        </li>

                        <!-- Page Numbers -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{|?page=${i}&size=5|}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <!-- Next -->
                        <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                            <a class="page-link"
                               th:href="${currentPage < totalPages - 1} ? @{|?page=${currentPage + 1}&size=5|} : '#'">Next</a>
                        </li>

                    </ul>
                </nav>
            </div>
        </div>
    </div>
</section>
<header th:replace="~{admin/fragments/footer :: footer}"></header>
</body>
</html>
