<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head}">
    <title>Quản lý sản phẩm | 4PStore</title>

</head>
<body>
<header th:replace="~{admin/fragments/header :: header}"></header>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<section>
    <div class="pc-container">
        <div class="pc-content">
            <div class="page-header">
                <div class="page-block">
                    <div class="row align-items-center">
                        <div class="col-md-12">
                            <div class="page-header-title">
                                <h5 class="m-b-10">Thêm biến thể</h5>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
            <div class="container discount-form-container">
                <div class="container mt-5">
                    <form id="TaoBienThe" th:object="${productForm}" th:action="@{/admin/product/save-product}" method="post" enctype="multipart/form-data">
                        <input type="hidden" class="form-control" id="product_code" name="code" th:value="${productForm.code}">
                        <input type="hidden" class="form-control" id="product_name" name="name" th:value="${productForm.name}">
                        <input type="hidden" class="form-control" id="product_category" name="categoryId" th:value="${productForm.categoryId}">
                        <input type="hidden" class="form-control" id="product_brand" name="brandId" th:value="${productForm.brandId}">
                        <input type="hidden" class="form-control" id="product_material" name="materialId" th:value="${productForm.materialId}">
                        <input type="hidden" class="form-control" id="product_description" name="description" th:value="${productForm.description}">

                        <div>
                            <a class="btn btn-secondary" id="return" href="/admin/product/view-add" title="Quay lại">
                                <i class="bi bi-arrow-bar-left"></i>
                            </a>
                        </div>

                        <br>
                        <!-- Chọn nhiều màu và kích cỡ -->
                        <div class="card shadow-sm rounded mb-4">
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="multi_color" class="form-label">Chọn nhiều màu sắc</label>
                                        <select id="multi_color" class="form-select" name="selectedColorIds" multiple>
                                            <option th:each="color : ${listColor}"
                                                    th:value="${color.id}"
                                                    th:text="${color.name}"
                                                    th:attr="data-color=${color.code}"
                                                    th:selected="${selectedColorIds != null and selectedColorIds.contains(color.id)}">
                                            </option>
                                        </select>
                                        <span id="add_color" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#modalAddColor">
                                            <i class="fas fa-plus"></i>
                                        </span>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="multi_size" class="form-label">Chọn nhiều kích cỡ</label>
                                        <select id="multi_size" class="form-select" name="selectedSizeIds" multiple>
                                            <option th:each="size : ${listSize}"
                                                    th:value="${size.id}"
                                                    th:text="${size.code}"
                                                    th:selected="${selectedSizeIds != null and selectedSizeIds.contains(size.id)}">
                                            </option>
                                        </select>
                                        <span id="add_size" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#modalAddSize">
                                            <i class="fas fa-plus"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr>
<!--                        <div id="variant-list">-->
                        <div id="variant-group-list">
                            <div th:each="variant, stat : ${productForm.variants}" class="variant-item row mb-3">
                                <div class="col-md-2">
                                    <label>Màu sắc</label>
                                    <input class="form-control" th:each="color : ${listColor}" th:if="${color.id == variant.colorId}" th:value="${color.name}" disabled/>
                                    <input type="hidden" th:name="'variants[' + ${stat.index} + '].colorId'" th:value="${variant.colorId}"/>
                                </div>

                                <!-- Kích cỡ -->
                                <div class="col-md-2">
                                    <label>Kích cỡ</label>
                                    <input class="form-control" th:each="size : ${listSize}" th:if="${size.id == variant.sizeId}" th:value="${size.name}" disabled/>
                                    <input type="hidden" th:name="'variants[' + ${stat.index} + '].sizeId'" th:value="${variant.sizeId}"/>
                                </div>

                                <!-- Số lượng -->
                                <div class="col-md-2">
                                    <label>Số lượng</label>
                                    <input type="number" class="form-control" th:name="'variants[' + ${stat.index} + '].quantity'" th:value="${variant.quantity}">
                                </div>

                                <!-- Giá tiền -->
                                <div class="col-md-2">
                                    <label>Giá tiền</label>
                                    <input type="number" class="form-control" th:name="'variants[' + ${stat.index} + '].price'" th:value="${variant.price}">
                                </div>

                                <!-- Nút Xóa -->
                                <div class="col-md-2 d-flex align-items-end">
                                    <button type="button" class="btn btn-danger remove-variant">Xóa</button>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-primary" id="add-variant-btn">
                                <i class="bi bi-plus-circle"></i> Thêm biến thể
                            </button>

                            <button type="submit" class="btn btn-success" id="Confirm">
                                <i class="bi bi-check-circle-fill"></i> Xác nhận
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</div>

<!--modal add nhanh-->
<div class="modal fade" id="modalAddColor" tabindex="-1" aria-labelledby="modalAddColorLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalAddColorLabel">Thêm mới màu sắc</h5>
            </div>
            <div class="modal-body">
                <form id="addColor" method="post" action="/admin/product/add-nhanh/color">
                    <div class="mb-3">
                        <label for="color_code" class="form-label">Mã màu</label><span class="text-danger">*</span>
                        <input type="color" class="form-control form-control-color" id="color_code" name="colorCode"
                               value="#000000" title="Chọn màu" required>
                    </div>
                    <div class="mb-3">
                        <label for="color_name" class="form-label">Tên</label><span class="text-danger">*</span>
                        <input type="text" class="form-control" id="color_name" name="colorName" placeholder="Nhập tên màu sắc">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-success">
                            <i class="bi bi-check-lg"></i>
                        </button>
                        <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!--thêm nhanh kích thước-->
<div class="modal fade" id="modalAddSize" tabindex="-1" aria-labelledby="modalAddSizeLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalAddSizeLabel">Thêm mới kích thước</h5>
            </div>
            <div class="modal-body">
                <form id="addSize" method="post" action="/admin/product/add-nhanh/size">
                    <div class="mb-3">
                        <label for="size_code" class="form-label">Mã</label><span class="text-danger">*</span>
                        <input type="text" class="form-control" id="size_code" name="sizeCode" placeholder="Nhập mã">
                    </div>
                    <div class="mb-3">
                        <label for="size_name" class="form-label">Tên</label>
                        <input type="text" class="form-control" id="size_name" name="sizeName" placeholder="Nhập tên kích thước">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-success">
                            <i class="bi bi-check-lg"></i>
                        </button>
                        <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<footer th:replace="admin/fragments/footer :: footer"></footer>

<!--báo lỗi-->
<script th:if="${alert != null}" th:inline="javascript">
    Swal.fire({
        toast: true,
        icon: [[${type}]],
        title: '[[${alert}]]', // Thông báo từ controller
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });
</script>

<!--Thêm nhiều biến thể-->
<script>
    let variantIndex = $('#variant-group-list .variant-item').length;

    function createVariantItem(colorId, colorName, sizeId, sizeName, quantity, price) {
        return `
    <div class="variant-item row bg-light p-3 rounded-3 shadow-sm mb-2 mx-1 align-items-center">
        <div class="col-md-3 mb-2 mb-md-0">
            <input type="text" class="form-control" value="${sizeName}" disabled>
            <input type="hidden" name="variants[${variantIndex}].sizeId" value="${sizeId}">
        </div>
        <div class="col-md-3 mb-2 mb-md-0">
            <input type="number" class="form-control" name="variants[${variantIndex}].quantity" value="${quantity}">
        </div>
        <div class="col-md-3 mb-2 mb-md-0">
            <input type="number" class="form-control" name="variants[${variantIndex}].price" value="${price}">
        </div>
        <div class="col-md-3 text-end">
            <button type="button" class="btn btn-outline-danger w-100 remove-variant">
                <i class="bi bi-trash"></i> Xóa
            </button>
        </div>
        <input type="hidden" name="variants[${variantIndex}].colorId" value="${colorId}">
    </div>`;
    }


    function createColorBlock(colorId, colorName, colorCode) {
        return `
    <div class="card shadow rounded-3 mb-4 color-block" data-color="${colorId}">
        <div class="card-header text-white d-flex justify-content-between align-items-center rounded-top"
             data-bs-toggle="collapse" data-bs-target="#color-body-${colorId}" style="cursor: pointer; background-color: ${colorCode};">
            <strong>${colorName}</strong>
            <i class="bi bi-chevron-down"></i>
        </div>
        <div class="collapse show" id="color-body-${colorId}">
            <div class="p-3">
                <div class="variant-item row bg-light p-3 rounded-3 shadow-sm mb-2 mx-1 align-items-center">
                    <div class="col-md-3 mb-2 mb-md-0">

                    </div>
                    <div class="col-md-3 mb-2 mb-md-0">
                        <input type="number" class="form-control quantity-input" placeholder="Nhập số lượng" data-color-id="${colorId}">
                    </div>
                    <div class="col-md-3 mb-2 mb-md-0">
                        <input type="number" class="form-control price-input" placeholder="Nhập giá" data-color-id="${colorId}">
                    </div>
                    <div class="col-md-3 text-end">
                        <button type="button" class="btn btn-warning w-100 apply-price-quantity" data-color-id="${colorId}">
                            Áp dụng
                        </button>
                    </div>
                </div>

                <div class="variant-list-inner">
                    <!-- Biến thể sẽ được thêm tại đây -->
                </div>

                <div class="form-group mt-3">
                    <input type="file" name="colorImages[${colorId}][]" class="form-control multi-image-input" multiple accept="image/*">
                    <div class="selected-images mt-2 d-flex flex-wrap gap-2" id="preview-color-${colorId}"></div>
                </div>
            </div>
        </div>
    </div>`;
    }

    function updateVariantIndexes() {
        variantIndex = 0;
        $('#variant-group-list .variant-item').each(function () {
            $(this).find('input[name]').each(function () {
                const name = $(this).attr('name');
                const newName = name.replace(/\[\d+\]/, `[${variantIndex}]`);
                $(this).attr('name', newName);
            });
            variantIndex++;
        });
    }

    $(document).ready(function () {
        $('#multi_color').select2({placeholder: 'Chọn màu sắc', templateResult: formatColor, templateSelection: formatColor});
        $('#multi_size').select2({placeholder: 'Chọn kích cỡ'});

        function formatColor(state) {
            if (!state.id) return state.text;
            const colorCode = $(state.element).data('color');
            if (!colorCode) return state.text;

            return $(`
            <span>
                <span style="display: inline-block; width: 15px; height: 15px; background-color: ${colorCode}; border-radius: 50%; border: 1px solid #ccc; margin-right: 8px;"></span>
                ${state.text}
            </span>
        `);
        }

        $('#add-variant-btn').on('click', function () {
            const selectedColors = $('#multi_color').val();
            const selectedSizes = $('#multi_size').val();

            if (!selectedColors || !selectedSizes) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Vui lòng chọn màu và kích cỡ!',
                    toast: true,
                    position: 'top-end',
                    timer: 2000,
                    showConfirmButton: false
                });
                return;
            }

            selectedColors.forEach(colorId => {
                const colorName = $('#multi_color option[value="' + colorId + '"]').text();
                const colorCode = $('#multi_color option[value="' + colorId + '"]').data('color'); // Lấy từ th:attr="data-color=${color.code}"

                let colorBlock = $(`.color-block[data-color="${colorId}"]`);

                // Tạo block nếu chưa tồn tại
                if (colorBlock.length === 0) {
                    const htmlBlock = createColorBlock(colorId, colorName, colorCode);
                    $('#variant-group-list').append(htmlBlock);
                    colorBlock = $(`.color-block[data-color="${colorId}"]`);
                }

                const variantListInner = colorBlock.find('.variant-list-inner');

                selectedSizes.forEach(sizeId => {
                    const sizeName = $('#multi_size option[value="' + sizeId + '"]').text();

                    // Kiểm tra trùng
                    const exists = variantListInner.find(`input[value="${sizeId}"][name$=".sizeId"]`).length > 0;
                    if (exists) {
                        // Swal.fire("Thông báo", `Biến thể màu ${colorName} - size ${sizeName} đã tồn tại`, "info");
                        return;
                    }

                    // Gọi controller lưu session
                    $.post('/admin/product/add2', {
                        colorId: colorId,
                        sizeId: sizeId,
                        // quantity: quantity,
                        // price: price
                    }, function (response) {
                        if (response === 'success') {
                            const html = createVariantItem(colorId, colorName, sizeId, sizeName);
                            // const html = createVariantItem(colorId, colorName, sizeId, sizeName, quantity, price);
                            variantListInner.append(html);
                            updateVariantIndexes();
                        } else {
                            Swal.fire("Thông báo", response, "info");
                        }
                    });
                });
            });
        });

        // Xóa biến thể
        $(document).on('click', '.remove-variant', function () {
            const variantItem = $(this).closest('.variant-item');

            const colorId = variantItem.find('input[name$=".colorId"]').val();
            const sizeId = variantItem.find('input[name$=".sizeId"]').val();

            // Gọi controller để xóa ở server
            $.post('/admin/product/remove-variant', {
                colorId: colorId,
                sizeId: sizeId
            }, function (response) {
                if (response === 'success') {
                    variantItem.remove();

                    const variantContainer = variantItem.closest('.variant-list-inner');
                    if (variantContainer.children().length === 0) {
                        variantContainer.closest('.color-block').remove();
                    }

                    updateVariantIndexes();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Lỗi',
                        toast: true,
                        position: 'top-end',
                        timer: 1500,
                        showConfirmButton: false
                    });
                }
            });
        });

    });
</script>
<!--áp giá-->
<script>
    $(document).on('click', '.apply-price-quantity', function () {
        const colorId = $(this).data('color-id');
        const colorBlock = $(`.color-block[data-color="${colorId}"]`);
        const quantity = parseInt(colorBlock.find('.quantity-input').val());
        const price = parseInt(colorBlock.find('.price-input').val());

        if (isNaN(quantity) || isNaN(price) || quantity < 0 || price < 0) {
            Swal.fire({
                icon: 'warning',
                title: 'Số lượng và giá phải >= 0',
                toast: true,
                position: 'top-end',
                timer: 2000,
                showConfirmButton: false
            });
            return;
        }

        // Gọi controller riêng để cập nhật vào session
        $.post('/admin/product/apply-price', {
            colorId: colorId,
            quantity: quantity,
            price: price
        }, function (response) {
            if (response === 'success') {
                // Áp dụng trên giao diện
                colorBlock.find('.variant-item').each(function () {
                    $(this).find('input[name$=".quantity"]').val(quantity);
                    $(this).find('input[name$=".price"]').val(price);
                });

                Swal.fire({
                    icon: 'success',
                    title: 'Đã áp dụng thành công',
                    toast: true,
                    position: 'top-end',
                    timer: 1500,
                    showConfirmButton: false
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi',
                    toast: true,
                    position: 'top-end',
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        });
    });
</script>
</body>
</html>
