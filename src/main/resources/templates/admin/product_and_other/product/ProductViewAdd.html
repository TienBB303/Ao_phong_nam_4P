<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>4P Store</title>
    <link rel="icon" type="image/png" href="https://png.pngtree.com/png-vector/20221011/ourmid/pngtree-letter-v-logo-icon-vector-png-image_6295820.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>

<!-- Main-->
<div id="main" class="container mt-4">
    <h3>Thêm sản phẩm</h3>
    <div class="card-header">
        <a class="btn btn-outline-primary" href="/admin/product/hien-thi" style="width: 70px">
            <i class="bi bi-arrow-return-left"></i>
        </a>
    </div>
    <div class="card-body">
        <!--Form tạo biến thể-->
        <div class="card p-4">
            <form id="TaoBienThe" th:action="@{/admin/product/add}" method="post" enctype="multipart/form-data">
                <!-- Thông tin sản phẩm -->
                <div class="row">
                    <div class="col-md-6">
                        <!-- Phần tên sản phẩm -->
                        <div class="mb-3">
                            <label for="product_code" class="form-label">
                                Mã sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="product_code" name="code" th:value="${productForm.code}" placeholder="Mã tạo tự động/ nhập thủ công">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <!-- Kiểu quạt-->
                        <div class="mb-3">
                            <label for="product_name" class="form-label">
                                Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="product_name" name="name" th:value="${productForm.name}" placeholder="Nhập tên sản phẩm">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="product_category" class="form-label">Loại sản phẩm</label>
                            <div class="d-flex align-items-center">
                                <select class="form-select me-2" id="product_category" name="categoryId">
                                    <option th:each="cate : ${listCategory}"
                                            th:value="${cate.id}"
                                            th:text="${cate.name}"
                                            th:if="${cate.status}"
                                            th:selected="${cate.id == productForm.categoryId}">
                                    </option>
                                </select>
                                <span id="add_category" class="btn btn-outline-secondary">
                                    <i class="fas fa-plus"></i>
                                </span>
                            </div>

                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="product_brand" class="form-label">Hãng</label>
                            <div class="d-flex align-items-center">
                                <select class="form-select me-2" id="product_brand" name="brandId">
                                    <option th:each="brand : ${listBrand}"
                                            th:value="${brand.id}"
                                            th:text="${brand.name}"
                                            th:if="${brand.status}"
                                            th:selected="${brand.id == productForm.brandId}">
                                    </option>
                                </select>
                                <span id="add_brand" class="btn btn-outline-secondary">
                                    <i class="fas fa-plus"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="product_category" class="form-label">Chất liệu</label>
                            <div class="d-flex align-items-center">
                                <select class="form-select me-2" id="product_material" name="materialId">
                                    <option th:each="mate : ${listMaterial}"
                                            th:value="${mate.id}"
                                            th:text="${mate.name}"
                                            th:if="${mate.status}"
                                            th:selected="${mate.id == productForm.materialId}">
                                    </option>
                                </select>
                                <span id="add_material" class="btn btn-outline-secondary">
                                    <i class="fas fa-plus"></i>
                                </span>
                            </div>

                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="product_brand" class="form-label">Mô tả</label>
                            <input type="text" class="form-control" id="product_description" name="description"  placeholder="Nhập mô tả">
                        </div>
                    </div>
                </div>
                <hr>
                <div id="variant-list">
                    <div th:each="variant, stat : ${productForm.variants}" class="variant-item row mb-3">
                        <!-- Màu sắc -->
                        <div class="col-md-2">
                            <label>Màu sắc</label>
                            <select class="form-select" th:name="'variants[' + ${stat.index} + '].colorId'">
                                <option th:each="color : ${listColor}"
                                        th:value="${color.id}"
                                        th:text="${color.name}"
                                        th:selected="${color.id == variant.colorId}">
                                </option>
                            </select>
                        </div>

                        <!-- Kích cỡ -->
                        <div class="col-md-2">
                            <label>Kích cỡ</label>
                            <select class="form-select" th:name="'variants[' + ${stat.index} + '].sizeId'">
                                <option th:each="size : ${listSize}"
                                        th:value="${size.id}"
                                        th:text="${size.name}"
                                        th:selected="${size.id == variant.sizeId}">
                                </option>
                            </select>
                        </div>

                        <!-- Số lượng -->
                        <div class="col-md-2">
                            <label>Số lượng</label>
                            <input type="number"
                                   class="form-control"
                                   th:name="'variants[' + ${stat.index} + '].quantity'"
                                   th:value="${variant.quantity}" min="0">
                        </div>

                        <!-- Giá tiền -->
                        <div class="col-md-2">
                            <label>Giá tiền</label>
                            <input type="number"
                                   class="form-control"
                                   th:name="'variants[' + ${stat.index} + '].price'"
                                   th:value="${variant.price}" min="0">
                        </div>

                        <!-- Nút Xóa -->
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="button" class="btn btn-danger remove-variant">Xóa</button>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <button type="button" class="btn btn-success" id="add-variant-btn">Thêm biến thể</button>
                </div>
                <div class="mb-3">
                    <button type="submit" class="btn btn-success" id="Confirm">Xác nhận</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:if="${alert != null}" th:inline="javascript">
    Swal.fire({
        toast: true,
        icon: [[${type}]],
        title: '[[${alert}]]', // Thông báo từ controller
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });
</script>
<script>
    function updateVariantIndexes() {
        $('#variant-list .variant-item').each(function (i) {
            $(this).find('select, input').each(function () {
                const name = $(this).attr('name');
                const newName = name.replace(/\[\d+\]/, `[${i}]`);
                $(this).attr('name', newName);
            });
        });
        index = $('#variant-list .variant-item').length; // cập nhật lại index
    }

    $('#add-variant-btn').on('click', function () {
        const newItem = $('.variant-item:first').clone();
        // newItem.find('select, input').each(function () {
        //     $(this).val(''); // Xóa dữ liệu của các ô input, select
        // });
        newItem.find('input').val(''); // Xóa dữ liệu của các ô input
        newItem.find('select').each(function () {
            $(this).prop('selectedIndex', 0); // chọn option đầu tiên
        });
        $('#variant-list').append(newItem);
        updateVariantIndexes();
    });

    $(document).on('click', '.remove-variant', function () {
        if ($('.variant-item').length > 1) {
            $(this).closest('.variant-item').remove();
            updateVariantIndexes();
        }
    });

</script>

<!-- Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
