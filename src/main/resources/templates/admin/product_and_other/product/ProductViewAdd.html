<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head}">
    <title>Quản lý sản phẩm | 4PStore</title>

</head>
<body>
<header th:replace="~{admin/fragments/header :: header}"></header>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<section>
    <div class="pc-container">
        <div class="pc-content">
            <div class="page-header">
                <div class="page-block">
                    <div class="row align-items-center">
                        <div class="col-md-12">
                            <div class="page-header-title">
                                <h5 class="m-b-10">Quản lý sản phẩm</h5>
                            </div>
                            <ul class="breadcrumb">
                            </ul>
                        </div>
                    </div>
                </div>

            </div>
            <div class="container discount-form-container">
                <div class="container mt-5">
                    <form id="TaoBienThe" th:action="@{/admin/product/add}" method="post" enctype="multipart/form-data">
                        <div class="card shadow-sm rounded mb-4">
                            <div class="card-body">
                                <!-- Thông tin sản phẩm -->
                                <div class="row">
                                    <div class="col-md-6">
                                        <!-- Phần tên sản phẩm -->
                                        <div class="mb-3">
                                            <label for="product_code" class="form-label">
                                                Mã sản phẩm <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="product_code" name="code"
                                                   th:value="${productForm.code}"
                                                   placeholder="Mã tạo tự động/ nhập thủ công">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <!-- Kiểu quạt-->
                                        <div class="mb-3">
                                            <label for="product_name" class="form-label">
                                                Tên sản phẩm <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="product_name" name="name"
                                                   th:value="${productForm.name}" placeholder="Nhập tên sản phẩm">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="product_category" class="form-label">Loại sản phẩm</label>
                                            <div class="d-flex align-items-center">
                                                <select class="form-select me-2" id="product_category"
                                                        name="categoryId">
                                                    <option th:each="cate : ${listCategory}"
                                                            th:value="${cate.id}"
                                                            th:text="${cate.name}"
                                                            th:if="${cate.status}"
                                                            th:selected="${cate.id == productForm.categoryId}">
                                                    </option>
                                                </select>
                                                <span id="add_category" class="btn btn-outline-secondary"
                                                      data-bs-toggle="modal" data-bs-target="#modalAddCategory">
                                    <i class="fas fa-plus"></i>
                                </span>
                                            </div>

                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="product_brand" class="form-label">Hãng</label>
                                            <div class="d-flex align-items-center">
                                                <select class="form-select me-2" id="product_brand" name="brandId">
                                                    <option th:each="brand : ${listBrand}"
                                                            th:value="${brand.id}"
                                                            th:text="${brand.name}"
                                                            th:if="${brand.status}"
                                                            th:selected="${brand.id == productForm.brandId}">
                                                    </option>
                                                </select>
                                                <span id="add_brand" class="btn btn-outline-secondary"
                                                      data-bs-toggle="modal" data-bs-target="#modalAddBrand">
                                    <i class="fas fa-plus"></i>
                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="product_category" class="form-label">Chất liệu</label>
                                            <div class="d-flex align-items-center">
                                                <select class="form-select me-2" id="product_material"
                                                        name="materialId">
                                                    <option th:each="mate : ${listMaterial}"
                                                            th:value="${mate.id}"
                                                            th:text="${mate.name}"
                                                            th:if="${mate.status}"
                                                            th:selected="${mate.id == productForm.materialId}">
                                                    </option>
                                                </select>
                                                <span id="add_material" class="btn btn-outline-secondary"
                                                      data-bs-toggle="modal" data-bs-target="#modalAddMaterial">
                                    <i class="fas fa-plus"></i>
                                </span>
                                            </div>

                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="product_brand" class="form-label">Mô tả</label>
                                            <input type="text" class="form-control" id="product_description"
                                                   name="description"
                                                   placeholder="Nhập mô tả" th:value="${productForm.description}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <!-- Chọn nhiều màu và kích cỡ -->
                        <div class="card shadow-sm rounded mb-4">
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="multi_color" class="form-label">Chọn nhiều màu sắc</label>
                                        <select id="multi_color" class="form-select" multiple>
                                            <option th:each="color : ${listColor}"
                                                    th:value="${color.id}"
                                                    th:text="${color.name}"
                                                    th:attr="data-color=${color.code}"
                                                    th:selected="${selectedColorIds != null and selectedColorIds.contains(color.id)}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="multi_size" class="form-label">Chọn nhiều kích cỡ</label>
                                        <select id="multi_size" class="form-select" multiple>
                                            <option th:each="size : ${listSize}"
                                                    th:value="${size.id}"
                                                    th:text="${size.code}"
                                                    th:selected="${selectedSizeIds != null and selectedSizeIds.contains(size.id)}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <!-- Ô nhập chung -->
                        <div class="card shadow-sm rounded mb-4">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-5">
                                        <label for="common_price" class="form-label">Áp dụng giá cho tất cả</label>
                                        <input type="number" class="form-control" id="common_price" placeholder="Nhập giá chung" name="all_price">
                                    </div>
                                    <div class="col-5">
                                        <label for="common_quantity" class="form-label">Áp dụng số lượng cho tất cả</label>
                                        <input type="number" class="form-control" id="common_quantity" placeholder="Nhập SL chung" name="all_quantity">
                                    </div>
<!--                                    <div class="col-2 d-flex align-items-end">-->
<!--                                        <button type="button" class="btn btn-outline-success w-100" id="apply_common">-->
<!--                                            <i class="bi bi-check-circle"></i> Áp dụng cho tất cả-->
<!--                                        </button>-->
<!--                                    </div>-->
                                    <div class="col-md-2 d-flex align-items-end">
                                        <button type="button" class="btn btn-outline-success w-100" id="apply_common">
                                            <i class="bi bi-check-circle"></i> Áp dụng
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div id="variant-list">
                            <div th:each="variant, stat : ${productForm.variants}"
                                 class="variant-item row mb-3">
                                <div class="col-md-2">
                                    <label>Màu sắc</label>
                                    <input class="form-control"
                                           th:each="color : ${listColor}"
                                           th:if="${color.id == variant.colorId}"
                                           th:value="${color.name}" disabled/>
                                    <input type="hidden" th:name="'variants[' + ${stat.index} + '].colorId'"
                                           th:value="${variant.colorId}"/>
                                </div>

                                <!-- Kích cỡ -->
                                <div class="col-md-2">
                                    <label>Kích cỡ</label>
                                    <input class="form-control"
                                           th:each="size : ${listSize}"
                                           th:if="${size.id == variant.sizeId}"
                                           th:value="${size.name}" disabled/>
                                    <input type="hidden" th:name="'variants[' + ${stat.index} + '].sizeId'"
                                           th:value="${variant.sizeId}"/>
                                </div>

                                <!-- Số lượng -->
                                <div class="col-md-2">
                                    <label>Số lượng</label>
                                    <input type="number"
                                           class="form-control"
                                           th:name="'variants[' + ${stat.index} + '].quantity'"
                                           th:value="${variant.quantity}">
                                </div>

                                <!-- Giá tiền -->
                                <div class="col-md-2">
                                    <label>Giá tiền</label>
                                    <input type="number"
                                           class="form-control"
                                           th:name="'variants[' + ${stat.index} + '].price'"
                                           th:value="${variant.price}">
                                </div>

                                <!-- Nút Xóa -->
                                <div class="col-md-2 d-flex align-items-end">
                                    <button type="button" class="btn btn-danger remove-variant">Xóa</button>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-primary" id="add-variant-btn">
                                <i class="bi bi-plus-circle"></i> Thêm biến thể
                            </button>
                            <button type="submit" class="btn btn-success" id="Confirm">
                                <i class="bi bi-check-circle-fill"></i> Xác nhận
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</div>
<!--Modal add kiểu loại nhanh-->
<div class="modal fade" id="modalAddCategory" tabindex="-1" aria-labelledby="modalAddCategoryLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalAddCategoryLabel">Thêm mới kiểu loại</h5>
            </div>
            <div class="modal-body">
                <form id="addCategory" method="post" action="/admin/product/add-nhanh/category">
                    <div class="mb-3">
                        <label for="category_name" class="form-label">Tên kiểu loại</label><span
                            class="text-danger">*</span>
                        <input type="text" class="form-control" id="category_name" name="categoryName"
                               placeholder="Nhập tên kiểu loại">
                    </div>
                    <div class="mb-3">
                        <label for="category_description" class="form-label">Mô tả</label>
                        <input type="text" class="form-control" id="category_description" name="categoryDescription"
                               placeholder="Nhập mô tả">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-success">
                            <i class="bi bi-check-lg"></i>
                        </button>
                        <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!--Modal add hãng nhanh-->
<div class="modal fade" id="modalAddBrand" tabindex="-1" aria-labelledby="modalAddBrandLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalAddBrandLabel">Thêm mới hãng</h5>
            </div>
            <div class="modal-body">
                <form id="addBrand" method="post" action="/admin/product/add-nhanh/brand">
                    <div class="mb-3">
                        <label for="brand_name" class="form-label">Tên hãng</label><span class="text-danger">*</span>
                        <input type="text" class="form-control" id="brand_name" name="brandName"
                               placeholder="Nhập tên hãng">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-success">
                            <i class="bi bi-check-lg"></i>
                        </button>
                        <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!--Modal add chất liệu nhanh-->
<div class="modal fade" id="modalAddMaterial" tabindex="-1" aria-labelledby="modalAddMaterialLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalAddMaterialLabel">Thêm mới chất liệu</h5>
            </div>
            <div class="modal-body">
                <form id="addMaterial" method="post" action="/admin/product/add-nhanh/material">
                    <div class="mb-3">
                        <label for="material_name" class="form-label">Tên chất liệu</label><span
                            class="text-danger">*</span>
                        <input type="text" class="form-control" id="material_name" name="materialName"
                               placeholder="Nhập tên chất liệu">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-success">
                            <i class="bi bi-check-lg"></i>
                        </button>
                        <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<footer th:replace="admin/fragments/footer :: footer"></footer>

<!--báo lỗi-->
<script th:if="${alert != null}" th:inline="javascript">
    Swal.fire({
        toast: true,
        icon: [[${type}]],
        title: '[[${alert}]]', // Thông báo từ controller
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });
</script>

<!--Thêm nhiều biến thể-->
<script>
    let variantIndex = 0;

    function createVariantItem(colorId, colorName, sizeId, sizeName) {
        return `
        <div class="variant-item row mb-3">
            <div class="col-md-2">
                <label>Màu sắc</label>
                <input class="form-control" value="${colorName}" disabled>
                <input type="hidden" name="variants[${variantIndex}].colorId" value="${colorId}">
            </div>
            <div class="col-md-2">
                <label>Kích cỡ</label>
                <input class="form-control" value="${sizeName}" disabled>
                <input type="hidden" name="variants[${variantIndex}].sizeId" value="${sizeId}">
            </div>
            <div class="col-md-2">
                <label>Số lượng</label>
                <input type="number" class="form-control" name="variants[${variantIndex}].quantity" min="0">
            </div>
            <div class="col-md-2">
                <label>Giá tiền</label>
                <input type="number" class="form-control" name="variants[${variantIndex}].price" min="0">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="button" class="btn btn-danger remove-variant">Xóa</button>
            </div>
        </div>
        `;
    }

    function updateVariantIndexes() {
        $('#variant-list .variant-item').each(function (i) {
            $(this).find('input, select').each(function () {
                const nameAttr = $(this).attr('name');
                if (nameAttr) {
                    const newName = nameAttr.replace(/\[\d+\]/, `[${i}]`);
                    $(this).attr('name', newName);
                }
            });
        });
        variantIndex = $('#variant-list .variant-item').length;
    }

    $(document).ready(function () {
        // $('#multi_color').select2({placeholder: 'Chọn màu sắc'});
        $('#multi_color').select2({placeholder: 'Chọn màu sắc', templateResult: formatColor, templateSelection: formatColor});
        function formatColor(state) {
            if (!state.id) return state.text;

            const colorCode = $(state.element).data('color');
            if (!colorCode) return state.text;

            const $color = $(`
                <span>
                    <span style="display: inline-block; width: 15px; height: 15px; background-color: ${colorCode}; border-radius: 50%;border: 1px solid #ccc; margin-right: 8px;"></span>
                    ${state.text}
                </span>
            `);
            return $color;
        }
        $('#multi_size').select2({placeholder: 'Chọn kích cỡ'});

        $('#add-variant-btn').on('click', function () {
            const selectedColors = $('#multi_color').val();
            const selectedSizes = $('#multi_size').val();
            let price = $('#common_price').val();
            let quantity = $('#common_quantity').val();
            let countAdded = 0;

            // Kiểm tra nếu chưa chọn gì
            if (!selectedColors || !selectedSizes) {
                return;
            }

            selectedColors.forEach(function (colorId) {
                const colorName = $('#multi_color option[value="' + colorId + '"]').text();
                selectedSizes.forEach(function (sizeId) {
                    const sizeName = $('#multi_size option[value="' + sizeId + '"]').text();

                    $.post('/admin/product/add-variant', {
                        colorId: colorId,
                        sizeId: sizeId,
                        // all_price: price,
                        // all_quantity: quantity
                    }, function (response) {
                        if (response === 'success') {
                            const html = createVariantItem(colorId, colorName, sizeId, sizeName);
                            $('#variant-list').append(html);
                            updateVariantIndexes();
                            countAdded++; //  tăng số biến thể
                        }

                        if (colorId === selectedColors[selectedColors.length - 1]
                            && sizeId === selectedSizes[selectedSizes.length - 1]) {

                            if (countAdded === 0 && $('#variant-list .variant-item').length > 0) {
                                Swal.fire({
                                    icon: 'info',
                                    title: 'Tất cả biến thể bạn chọn đã tồn tại!',
                                    toast: true,
                                    position: 'top-end',
                                    timer: 2000,
                                    showConfirmButton: false
                                });
                            }
                        }
                    });
                });
            });
        });


        // Nút Xóa
        $(document).on('click', '.remove-variant', function () {
            $(this).closest('.variant-item').remove();
            updateVariantIndexes();
        });
    });
</script>
<!--áp giá-->
<script>
    $(document).ready(function () {
        $('#apply_common').click(function () {
            const price = $('#common_price').val();
            const quantity = $('#common_quantity').val();

            if (!price && !quantity) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Vui lòng nhập giá hoặc số lượng để áp dụng!',
                    toast: true,
                    position: 'top-end',
                    timer: 2000,
                    showConfirmButton: false
                });
                return;
            }

            $('#variant-list .variant-item').each(function () {
                if (price) {
                    $(this).find('input[name$=".price"]').val(price);
                }
                if (quantity) {
                    $(this).find('input[name$=".quantity"]').val(quantity);
                }
            });
        });
    });

</script>
</body>
</html>
