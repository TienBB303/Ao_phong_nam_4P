<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <th:block th:insert="~{admin/fragments/head :: head}"></th:block>
    <meta charset="UTF-8">
<!--    <title>4P Store</title>-->
<!--    <link rel="icon" type="image/png" href="https://png.pngtree.com/png-vector/20221011/ourmid/pngtree-letter-v-logo-icon-vector-png-image_6295820.png">-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<header th:replace="~{admin/fragments/header :: header}"></header>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<!-- Main-->
<div id="main" class="container mt-4">
    <h3>Kích thước</h3>
    <div class="card-header">
        <a class="btn btn-outline-primary" href="/admin/product/view-atribute" style="width: 70px">
            <i class="bi bi-arrow-return-left"></i>
        </a>
    </div>
    <section>
        <div class="container mt-5">
            <div class="page-content">
        <!--        dữ liệu thực hiện trong selection-->
        <section class="row">
            <div class="card">
                <div class="card-header">
                    <form method="get" action="/admin/size/hien-thi" th:object="${listSize}" style="padding-bottom: 20px">
                        <div class="row">
                            <div class="col-5">
                                <input type="text" id="searchInput" class="form-control" name="sizeNameSearch"
                                       placeholder="Nhập kích thước..." th:value="${param.sizeNameSearch}">
                            </div>
                            <div class="col-5">
                                <select id="status" name="sizeStatusSearch" class="form-select">
                                    <option value="" th:selected="${sizeStatusSearch == null}">Tất cả trạng thái</option>
                                    <option value="true" th:selected="${sizeStatusSearch == true}">Hoạt động</option>
                                    <option value="false" th:selected="${sizeStatusSearch == false}">Không hoạt động</option>
                                </select>
                            </div>
                            <div class="col-2">
                                <button class="btn btn-primary" type="submit" id="sbmt">
                                    <i class="bi bi-search"></i>
                                </button>
                                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalThemMoi">
                                    <i class="bi bi-plus"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
                <div th:if="${#lists.isEmpty(listSize.content)}" class="d-flex flex-column justify-content-center align-items-center" style="height: 400px;">
                    <img src="https://shop.nebulacare.in/Content/Images/nodata.jpg" style="max-height: 400px;">
                </div>
                <div th:if="${!#lists.isEmpty(listSize.content)}" class="card-body">
                    <table class="table table-striped table-bordered dataTable-table" id="table1">
                        <thead>
                        <tr>
                            <th style="text-align: center">STT</th>
                            <th style="text-align: center">Mã</th>
                            <th style="text-align: center">Tên kích thước</th>
                            <th style="text-align: center">Trạng thái</th>
                            <th style="text-align: center">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cate, iter : ${listSize.content}" th:data-id="${cate.id}">
                            <td th:text="${listSize.number * listSize.size + iter.index + 1}"></td>
                            <td th:text="${cate.code}"></td>
                            <td th:text="${cate.name}"></td>
                            <td style="text-align: center">
                                <span th:if="${cate.status}" class="badge bg-success">Hoạt động</span>
                                <span th:unless="${cate.status}" class="badge bg-danger">Không hoạt động</span>
                            </td>
                            <td style="text-align: center">
                                <a class="btn btn-outline-warning hienThiThongTinModal" style="width: 70px" title="Sửa" th:attr="data-id=${cate.id}" data-bs-toggle="modal" data-bs-target="#modalChinhSua">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a class="btn btn-outline-info thayDoiTrangThai" style="width: 70px" title="Xem" th:attr="data-id=${cate.id}">
                                    <i class="bi bi-arrow-left-right"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="dataTable-bottom">
                    <nav th:if="${listSize.totalPages > 0}">
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${listSize.first} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/size/hien-thi(page=${listSize.number > 0 ? listSize.number - 1 : 0}, size=${listSize.size},sizeNameSearch=${sizeNameSearch},sizeStatusSearch=${sizeStatusSearch})}">
                                    Trước
                                </a>
                            </li>

                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, listSize.totalPages - 1)}"
                                th:classappend="${i == listSize.number} ? 'active'">
                                <a class="page-link"
                                   th:href="@{/admin/size/hien-thi(page=${i},  size=${listSize.size}, sizeNameSearch=${sizeNameSearch}, sizeStatusSearch=${sizeStatusSearch})}"
                                   th:text="${i + 1}">1</a>
                            </li>

                            <li class="page-item" th:classappend="${listSize.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/size/hien-thi(page=${listSize.number + 1}, size=${listSize.size}, sizeNameSearch=${sizeNameSearch},    sizeStatusSearch=${sizeStatusSearch})}">
                                    Sau
                                </a>
                            </li>
                        </ul>
                    </nav>

                </div>
            </div>
        </section>
            </div>
        </div>
    </section>
</div>
<!--    modal thêm-->
<div class="modal fade" id="modalThemMoi" tabindex="-1" aria-labelledby="modalThemMoiLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalThemMoiLabel">Thêm mới kích thước</h5>
            </div>
            <div class="modal-body">
                <form id="addSize" method="post" action="/admin/size/add">
                    <div class="mb-3">
                        <label for="size_code" class="form-label">Mã</label><span class="text-danger">*</span>
                        <input type="text" class="form-control" id="size_code" name="sizeCode" placeholder="Nhập mã">
                    </div>
                    <div class="mb-3">
                        <label for="size_name" class="form-label">Tên</label>
                        <input type="text" class="form-control" id="size_name" name="sizeName" placeholder="Nhập tên kích thước">
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-success">
                            <i class="bi bi-check-lg"></i>
                        </button>
                        <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!--    Modal chỉnh sửa-->
<div class="modal fade" id="modalChinhSua" tabindex="-1" aria-labelledby="modalChinhSuaLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalChinhSuaLabel">Chỉnh sửa kích thước</h5>
            </div>
            <div class="modal-body">
                <form id="updateSize" method="post" action="/admin/size/update">
                    <input type="hidden" id="size_id" name="sizeId">
                    <div class="mb-3">
                        <label for="size_code_update" class="form-label">Mã</label><span class="text-danger">*</span>
                        <input type="text" class="form-control" id="size_code_update" name="sizeCodeUpdate" placeholder="Nhập mã kích thước">
                    </div>
                    <div class="mb-3">
                        <label for="size_name_update" class="form-label">Tên</label>
                        <input type="text" class="form-control" id="size_name_update" name="sizeNameUpdate" placeholder="Nhập tên kích thước">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-success">
                            <i class="bi bi-check-lg"></i>
                        </button>
                        <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
<!--    Script-->


<script th:if="${alert != null}" th:inline="javascript">
    Swal.fire({
        toast: true,
        icon: [[${type}]],
        title: '[[${alert}]]', // Thông báo từ controller
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });
</script>
<!--    Detail-->
<script>
    $(document).on('click', '.hienThiThongTinModal', function () {
        const id = $(this).data('id');
        console.log("ID lấy được:", id);
        $('#size_id').val(id); // Gắn ID vào input ẩn trong form

        $.ajax({
            url: `/admin/size/detail/${id}`,
            type: 'GET',
            success: function (response) {
                console.log("Response:", response);
                $('#size_id').val(response.id);
                $('#size_name_update').val(response.name);
                $('#size_code_update').val(response.code);
            },
            error: function (xhr) {
            }
        });
    });
</script>
<script>
    $(document).on('click', '.thayDoiTrangThai', function () {
        const id = $(this).data('id');
        Swal.fire({
            title: 'Bạn có chắc muốn đổi trạng thái?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Có',
            cancelButtonText: 'Không'
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = `/admin/size/change-status/${id}`;
            }
        });
    });

</script>

<footer th:replace="admin/fragments/footer :: footer"></footer>
</body>

</html>
