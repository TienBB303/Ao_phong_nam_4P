<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Thêm mã giảm giá</title>
    <meta charset="UTF-8">
    <style>
        label {
            display: block;
            margin-top: 10px;
        }
        input, textarea, select {
            width: 300px;
            padding: 5px;
        }
        button {
            margin-top: 15px;
            padding: 8px 16px;
        }
        .unit-label {
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Thêm mã giảm giá</h2>

    <form th:action="@{/admin/discount/create}" th:object="${discount}" method="post">
        <div class="mb-3">
            <label class="form-label">Mã</label>
            <input type="text" class="form-control" th:field="*{code}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Tên mã</label>
            <input type="text" class="form-control" th:field="*{codeName}" required>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Loại giảm giá</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" th:field="*{discountType}" value="percent"
                       onclick="handleDiscountTypeChange()">
                <label class="form-check-label">Phần trăm</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" th:field="*{discountType}" value="amount"
                       onclick="handleDiscountTypeChange()">
                <label class="form-check-label">Số tiền</label>
            </div>
        </div>


        <div class="mb-3">
            <label class="form-label">Giá trị giảm</label>
            <div class="input-group">
                <input type="number" class="form-control" id="discountValue" th:field="*{discountValue}" required>
                <span class="input-group-text" id="discountUnit">%</span>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Ngày bắt đầu</label>
            <input type="datetime-local" class="form-control" th:field="*{startDatetime}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Ngày kết thúc</label>
            <input type="datetime-local" class="form-control" th:field="*{endDatetime}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Đơn hàng tối thiểu</label>
            <input type="number" class="form-control" th:field="*{minPurchase}" step="0.01">
        </div>

        <div class="mb-3" id="maxDiscountGroup">
            <label class="form-label">Giảm tối đa</label>
            <input type="number" class="form-control" th:field="*{maxDiscount}" step="0.01">
        </div>

        <div class="mb-3">
            <label class="form-label">Giới hạn sử dụng</label>
            <input type="number" class="form-control" th:field="*{usageLimit}">
        </div>

        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <select class="form-select" th:field="*{status}">
                <option th:value="true">Đang hoạt động</option>
                <option th:value="false">Không hoạt động</option>
            </select>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary me-2">Lưu</button>
            <a th:href="@{/admin/discount/view}" class="btn btn-secondary">Quay lại</a>
        </div>
    </form>
</div>
<script>
    function handleDiscountTypeChange() {
        const percentRadio = document.querySelector('input[name="discountType"][value="percent"]');
        const amountRadio = document.querySelector('input[name="discountType"][value="amount"]');
        const discountInput = document.getElementById('discountValue');
        const unitLabel = document.getElementById('discountUnit');
        const maxDiscountGroup = document.getElementById('maxDiscountGroup');
        const maxDiscountInput = maxDiscountGroup.querySelector('input');

        if (percentRadio.checked) {
            discountInput.max = 100;
            discountInput.min = 0;
            unitLabel.textContent = '%';
            maxDiscountGroup.style.display = 'block';
            maxDiscountInput.disabled = false;
        } else if (amountRadio.checked) {
            discountInput.removeAttribute('max');
            discountInput.removeAttribute('min');
            unitLabel.textContent = '₫';
            maxDiscountGroup.style.display = 'none';
            maxDiscountInput.disabled = true;
        }
    }
    window.onload = handleDiscountTypeChange;
</script>

</body>
</html>
