<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết mã giảm giá</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .info {
            margin-bottom: 12px;
        }

        .label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Chi tiết mã giảm giá</h2>

<div class="info">
    <span class="label">Mã:</span>
    <span th:text="${discount.code}">Mã giảm giá</span>
</div>

<div class="info">
    <span class="label">Tên mã:</span>
    <span th:text="${discount.codeName}">Tên mã</span>
</div>

<div class="info">
    <span class="label">Loại:</span>
    <span th:text="${discount.discountType}">Loại</span>
</div>

<div class="info">
    <span class="label">Giá trị:</span>
    <span th:text="${discount.discountValue} ">Giá trị</span>
</div>

<div class="info">
    <span class="label">Ngày bắt đầu:</span>
    <span th:text="${#temporals.format(discount.startDatetime, 'dd/MM/yyyy HH:mm')}">Ngày bắt đầu</span>
</div>

<div class="info">
    <span class="label">Ngày kết thúc:</span>
    <span th:text="${#temporals.format(discount.endDatetime, 'dd/MM/yyyy HH:mm')}">Ngày kết thúc</span>
</div>

<div class="info">
    <span class="label">Đơn tối thiểu:</span>
    <span th:text="${discount.minPurchase}">Đơn tối thiểu</span>
</div>

<div class="info">
    <span class="label">Giảm tối đa:</span>
    <span th:text="${discount.maxDiscount}">Giảm tối đa</span>
</div>

<div class="info">
    <span class="label">Số lượng giới hạn:</span>
    <span th:text="${discount.usageLimit}">Số lượng</span>
</div>

<div class="info">
    <span class="label">Mô tả:</span>
    <span th:text="${discount.description}">Mô tả</span>
</div>

<div class="info">
    <span class="label">Trạng thái:</span>
    <span th:text="${discount.status ? 'Đang hoạt động' : 'Ngừng'}">Trạng thái</span>
</div>

<br>
<a th:href="@{/admin/discount/view}">
    <button>⬅️ Quay lại danh sách</button>
</a>

</body>
</html>
