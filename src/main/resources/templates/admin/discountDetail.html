<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title>Chi tiết mã giảm giá</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .card {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333;
        }

        .info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 6px;
        }

        .label {
            font-weight: bold;
            color: #444;
        }

        .value {
            color: #222;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 8px 16px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #0056b3;
        }
        .content-wrapper {
            padding-top: 80px;
        }
    </style>
</head>
<body>
<section layout:fragment="content" class="content-wrapper">
<div class="card">
    <h2>Chi tiết mã giảm giá</h2>

    <div class="info">
        <span class="label">Mã:</span>
        <span class="value" th:text="${discount.code}">Mã giảm giá</span>
    </div>

    <div class="info">
        <span class="label">Tên mã:</span>
        <span class="value" th:text="${discount.codeName}">Tên mã</span>
    </div>

    <div class="info">
        <span class="label">Loại:</span>
        <span class="value" th:text="${discount.discountType}">Loại</span>
    </div>

    <div class="info">
        <span class="label">Giá trị:</span>
        <span class="value" th:text="${discount.discountValue}">Giá trị</span>
    </div>

    <div class="info">
        <span class="label">Ngày bắt đầu:</span>
        <span class="value" th:text="${#temporals.format(discount.startDatetime, 'dd/MM/yyyy HH:mm')}">Ngày bắt đầu</span>
    </div>

    <div class="info">
        <span class="label">Ngày kết thúc:</span>
        <span class="value" th:text="${#temporals.format(discount.endDatetime, 'dd/MM/yyyy HH:mm')}">Ngày kết thúc</span>
    </div>

    <div class="info">
        <span class="label">Đơn tối thiểu:</span>
        <span class="value" th:text="${discount.minPurchase}">Đơn tối thiểu</span>
    </div>

    <div class="info">
        <span class="label">Giảm tối đa:</span>
        <span class="value" th:text="${discount.maxDiscount}">Giảm tối đa</span>
    </div>

    <div class="info">
        <span class="label">Số lượng giới hạn:</span>
        <span class="value" th:text="${discount.usageLimit}">Số lượng</span>
    </div>

    <div class="info">
        <span class="label">Mô tả:</span>
        <span class="value" th:text="${discount.description}">Mô tả</span>
    </div>

    <div class="info">
        <span class="label">Trạng thái:</span>
        <span class="value" th:switch="${discount.status}">
            <span th:case="1">Đang diễn ra</span>
            <span th:case="2">Sắp diễn ra</span>
            <span th:case="3">Hết hạn</span>
            <span th:case="4">Đã đóng</span>
            <span th:case="*">Không xác định</span>
        </span>
    </div>

    <div class="button-container">
        <a th:href="@{/admin/discount/view}">
            <button>⬅️ Quay lại danh sách</button>
        </a>
    </div>
</div>
</section>
<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
</body>
</html>
